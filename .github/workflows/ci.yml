# CustomerLake CI — Validate DAB on every push/PR
# Owner: @devops (Release Engineering)
# Updated by @devops agent run 27 (2026-10-06): validate all 3 targets, add YAML lint
# Updated by @devops DEVOPS-V98-REGRESSION-RCA (2026-10-15): add app regression guard
name: CI - Bundle Validate

on:
  push:
    branches: ['feature/*', 'devops/*', 'main']
  pull_request:
    branches: ['main', 'release/*']

jobs:
  validate:
    name: Validate Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Validate dev target
        run: databricks bundle validate --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Validate test target
        run: databricks bundle validate --target test
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Validate prod target
        run: databricks bundle validate --target prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Verify tagging mandate
        run: |
          echo "Checking all resource YAMLs contain customerlake_project tag..."
          for f in resources/*.yml; do
            if ! grep -q 'customerlake_project' "$f"; then
              echo "ERROR: $f missing customerlake_project tag"
              exit 1
            fi
          done
          echo "All resource YAMLs pass tagging check."

      - name: Verify notebook paths exist
        run: |
          echo "Checking all notebook_path references resolve to files..."
          ERRORS=0
          for f in resources/*.yml; do
            # Extract notebook_path values (relative to resources/)
            grep -oP 'notebook_path:\s*\K\S+' "$f" | while read -r nbpath; do
              # Resolve relative path from resources/ dir
              resolved="resources/${nbpath}"
              # Check .py, .ipynb, or bare path (Databricks notebook)
              if [ ! -f "${resolved}" ] && [ ! -f "${resolved}.py" ] && [ ! -f "${resolved}.ipynb" ] && [ ! -d "${resolved}" ]; then
                echo "ERROR: $f references notebook_path '$nbpath' — not found at ${resolved}"
                ERRORS=$((ERRORS+1))
              fi
            done
          done
          if [ $ERRORS -gt 0 ]; then
            echo "FAIL: $ERRORS broken notebook_path reference(s)"
            exit 1
          fi
          echo "All notebook paths verified."

      - name: Check for email_notifications on all jobs
        run: |
          echo "Checking all job resources have email_notifications..."
          WARNINGS=0
          for f in resources/*.job.yml; do
            if ! grep -q 'email_notifications' "$f"; then
              echo "WARNING: $f missing email_notifications"
              WARNINGS=$((WARNINGS+1))
            fi
          done
          if [ $WARNINGS -gt 0 ]; then
            echo "WARN: $WARNINGS job(s) without email_notifications"
          else
            echo "All jobs have email_notifications configured."
          fi

      # ── App Regression Guard (DEVOPS-V98-REGRESSION-RCA) ──────────────
      # Prevents deploying an app that has fewer pages, lines, or endpoints
      # than the .app-baseline.json thresholds. Root cause: v65.1.0→v56.0.0
      # regression from uncommitted workspace edits lost during branch checkout.
      - name: App regression guard — page count
        run: |
          echo "=== APP REGRESSION GUARD ==="
          BASELINE=".app-baseline.json"
          if [ ! -f "$BASELINE" ]; then
            echo "SKIP: .app-baseline.json not found — guard not active"
            exit 0
          fi

          INDEX="customerlake-app/static/index.html"
          APPPY="customerlake-app/app.py"
          ERRORS=0

          # --- index.html checks ---
          if [ -f "$INDEX" ]; then
            LINE_COUNT=$(wc -l < "$INDEX")
            PAGE_COUNT=$(grep -cP "case\s+'[^']+':\s*$" "$INDEX" || true)
            MIN_LINES=$(python3 -c "import json; print(json.load(open('$BASELINE'))['index_html']['min_lines'])")
            MIN_PAGES=$(python3 -c "import json; print(json.load(open('$BASELINE'))['index_html']['min_pages'])")

            echo "index.html: $LINE_COUNT lines (min: $MIN_LINES), $PAGE_COUNT pages (min: $MIN_PAGES)"

            if [ "$LINE_COUNT" -lt "$MIN_LINES" ]; then
              echo "FAIL: index.html line count $LINE_COUNT < baseline $MIN_LINES — REGRESSION DETECTED"
              ERRORS=$((ERRORS+1))
            fi
            if [ "$PAGE_COUNT" -lt "$MIN_PAGES" ]; then
              echo "FAIL: index.html page count $PAGE_COUNT < baseline $MIN_PAGES — REGRESSION DETECTED"
              ERRORS=$((ERRORS+1))
            fi
          else
            echo "FAIL: $INDEX not found"
            ERRORS=$((ERRORS+1))
          fi

          # --- app.py checks ---
          if [ -f "$APPPY" ]; then
            APP_LINES=$(wc -l < "$APPPY")
            APP_ENDPOINTS=$(grep -cP '@app\.(get|post|put|delete|patch)\(' "$APPPY" || true)
            APP_VERSION=$(grep -oP 'APP_VERSION\s*=\s*["'\''"](\K[^"'\''"]+)' "$APPPY" || echo "unknown")
            MIN_APP_LINES=$(python3 -c "import json; print(json.load(open('$BASELINE'))['app_py']['min_lines'])")
            MIN_ENDPOINTS=$(python3 -c "import json; print(json.load(open('$BASELINE'))['app_py']['min_endpoints'])")

            echo "app.py: $APP_LINES lines (min: $MIN_APP_LINES), $APP_ENDPOINTS endpoints (min: $MIN_ENDPOINTS), version: $APP_VERSION"

            if [ "$APP_LINES" -lt "$MIN_APP_LINES" ]; then
              echo "FAIL: app.py line count $APP_LINES < baseline $MIN_APP_LINES — REGRESSION DETECTED"
              ERRORS=$((ERRORS+1))
            fi
            if [ "$APP_ENDPOINTS" -lt "$MIN_ENDPOINTS" ]; then
              echo "FAIL: app.py endpoint count $APP_ENDPOINTS < baseline $MIN_ENDPOINTS — REGRESSION DETECTED"
              ERRORS=$((ERRORS+1))
            fi
          else
            echo "FAIL: $APPPY not found"
            ERRORS=$((ERRORS+1))
          fi

          # --- Verdict ---
          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "BLOCKED: $ERRORS regression(s) detected. This commit would reduce the app below known-good thresholds."
            echo "If this is intentional, update .app-baseline.json and get @devops approval."
            exit 1
          fi
          echo "PASS: App meets all regression guard thresholds."
