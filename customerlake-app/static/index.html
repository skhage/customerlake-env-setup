<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1117">
  <title>CustomerLake — AI-Driven Customer Intelligence</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg-primary: #0f1117;
      --bg-secondary: #1a1d29;
      --bg-card: #1e2130;
      --bg-hover: #252840;
      --border: #2d3148;
      --text-primary: #e8eaf0;
      --text-secondary: #9498b0;
      --text-muted: #8b8fa8;
      --accent: #4f8ff7;
      --accent-hover: #3a7de8;
      --accent-light: rgba(79,143,247,0.12);
      --success: #34d399;
      --success-bg: rgba(52,211,153,0.12);
      --warning: #fbbf24;
      --warning-bg: rgba(251,191,36,0.12);
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.12);
      --info: #818cf8;
      --info-bg: rgba(129,140,248,0.12);
      --radius: 8px;
      --radius-lg: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }
    .app-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 240px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 20px 0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .sidebar-logo {
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .sidebar-logo h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sidebar-logo p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 14px;
      transition: all 0.15s;
      border-left: 3px solid transparent;
      background: none;
      border-right: none;
      border-top: none;
      border-bottom: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }
    .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-item.active {
      background: var(--accent-light);
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 500;
    }
    .nav-icon { font-size: 18px; width: 24px; text-align: center; }
    .main-content { flex: 1; padding: 24px 32px; overflow-y: auto; max-height: 100vh; }
    .page-header { margin-bottom: 24px; }
    .page-header h2 { font-size: 22px; font-weight: 600; }
    .page-header p { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
    }
    .kpi-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-value { font-size: 28px; font-weight: 700; margin-top: 4px; }
    .kpi-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .search-bar input, .search-bar select {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }
    .search-bar input { flex: 1; }
    .search-bar input:focus, .search-bar select:focus { border-color: var(--accent); }
    .search-bar select { min-width: 140px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }
    tr:hover td { background: var(--bg-hover); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); }
    .badge-danger { background: var(--danger-bg); color: var(--danger); }
    .badge-info { background: var(--info-bg); color: var(--info); }
    .badge-neutral { background: var(--bg-hover); color: var(--text-secondary); }
    .btn {
      padding: 6px 14px;
      border-radius: var(--radius);
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); color: #000; }
    .btn-danger { background: var(--danger); color: #000; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
    .entity-link {
      color: var(--accent);
      cursor: pointer;
      font-weight: 500;
    }
    .entity-link:hover { text-decoration: underline; }
    .source-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      margin-right: 4px;
    }
    .source-TMF_PARTY { background: rgba(79,143,247,0.2); color: var(--accent); }
    .source-SALESFORCE { background: rgba(52,211,153,0.2); color: var(--success); }
    .source-ORACLE_ERP { background: rgba(251,191,36,0.2); color: var(--warning); }
    .confidence-bar {
      width: 60px;
      height: 6px;
      background: var(--bg-hover);
      border-radius: 3px;
      display: inline-block;
      vertical-align: middle;
      margin-left: 4px;
    }
    .confidence-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--success);
    }
    .detail-panel {
      position: fixed;
      right: 0;
      top: 0;
      width: 520px;
      height: 100vh;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 24px;
      z-index: 100;
      box-shadow: -4px 0 24px rgba(0,0,0,0.4);
    }
    .detail-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }
    .detail-section { margin-bottom: 20px; }
    .detail-section h3 {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .diff-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(79,143,247,0.15);
      color: var(--accent);
    }
    .journey-event:hover {
      background: var(--bg-hover);
      border-radius: var(--radius);
      margin-left: -4px;
      padding-left: 4px;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      color: var(--text-muted);
    }
    /* Skeleton shimmer — CMO-138: instant layout while data loads */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-hover) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: var(--radius);
    }
    .skeleton-kpi {
      height: 120px;
      min-width: 200px;
    }
    .skeleton-text {
      height: 14px;
      width: 60%;
      margin-bottom: 8px;
    }
    .skeleton-text.short { width: 40%; }
    .skeleton-text.long { width: 80%; }
    .skeleton-banner {
      height: 80px;
      width: 100%;
      margin-bottom: 16px;
    }
    .skeleton-table {
      height: 200px;
      width: 100%;
      margin-bottom: 16px;
    }
    .skeleton-section {
      margin-bottom: 24px;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
    .steward-actions {
      display: flex;
      gap: 6px;
    }
    .bar-chart-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .bar-label { width: 100px; font-size: 12px; color: var(--text-secondary); text-align: right; }
    .bar-track {
      flex: 1;
      height: 20px;
      background: var(--bg-hover);
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding-left: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      min-width: 30px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    /* Focus-visible for all interactive elements (UX-FIX-3) */
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
    .entity-link:focus-visible, .btn:focus-visible, .nav-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    /* Mobile hamburger toggle (UX-FIX-2) */
    .mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 110;
    }
    .mobile-header h1 {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hamburger-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      padding: 6px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hamburger-btn:hover { background: var(--bg-hover); }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
    }
    .sidebar-overlay.open { display: block; }
    /* Table scroll wrapper (UX-FIX-5) */
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* Error card (UX-FIX-5) */
    .error-card {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      border-radius: var(--radius-lg);
      padding: 24px;
      text-align: center;
    }
    .error-card p { color: var(--danger); margin-bottom: 12px; font-size: 14px; }
    .error-card .error-detail { color: var(--text-muted); font-size: 12px; margin-bottom: 16px; }
    @media (max-width: 768px) {
      .sidebar { display: none; position: fixed; z-index: 100; top: 0; left: 0; height: 100vh; }
      .sidebar.mobile-open { display: flex; }
      .mobile-header { display: flex; }
      .main-content { padding: 16px; max-height: none; }
      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
      .detail-panel { width: 100%; }
    }
    /* Simulation Environment Banner (CMO-82: synthetic data disclaimer) */
    .sim-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(251,191,36,0.10);
      border: 1px solid rgba(251,191,36,0.35);
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
    }
    .sim-banner strong { color: var(--warning); font-weight: 600; letter-spacing: 0.5px; }
    .sim-banner .sim-icon { flex-shrink: 0; color: var(--warning); }
    .sim-banner .sim-dismiss {
      margin-left: auto;
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      border-radius: 4px;
      font-size: 11px;
    }
    .sim-banner .sim-dismiss:hover { color: var(--text-primary); background: var(--bg-hover); }
    .sim-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 4px;
      vertical-align: middle;
    }
    .sim-badge--synthetic {
      background: rgba(251,191,36,0.15);
      color: var(--warning);
      border: 1px solid rgba(251,191,36,0.3);
    }
    .sim-badge--production {
      background: rgba(52,211,153,0.12);
      color: var(--success);
      border: 1px solid rgba(52,211,153,0.25);
    }
    /* Demo Walkthrough Styles */
    .demo-step-bar {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 12px 0;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .demo-step-bar-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: var(--radius);
      transition: all 0.15s;
      white-space: nowrap;
    }
    .demo-step-bar-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .demo-step-bar-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .demo-step-bar-item.completed-step { color: var(--success); }
    .demo-step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      background: var(--bg-hover);
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .demo-step-bar-item.active .demo-step-num { background: var(--accent); color: #fff; }
    .demo-step-bar-item.completed-step .demo-step-num { background: var(--success); color: #fff; }
    .demo-step-connector {
      width: 24px;
      height: 2px;
      background: var(--border);
      flex-shrink: 0;
    }
    .demo-step-connector.completed-conn { background: var(--success); }
    .demo-landing-hero {
      text-align: center;
      padding: 40px 24px 32px;
      margin-bottom: 24px;
    }
    .demo-landing-hero h2 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .demo-landing-hero p { color: var(--text-secondary); font-size: 14px; max-width: 600px; margin: 0 auto; }
    .demo-step-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.15s;
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 16px;
      align-items: start;
    }
    .demo-step-card:hover { border-color: var(--accent); background: rgba(79,143,247,0.04); }
    .demo-step-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .demo-step-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .demo-step-card .demo-duration { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .demo-step-card .demo-talk { font-size: 13px; color: var(--text-secondary); margin-top: 8px; font-style: italic; line-height: 1.5; }
    .demo-step-card .demo-metrics { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
    .demo-step-card .demo-metric {
      background: var(--bg-hover);
      border-radius: var(--radius);
      padding: 8px 12px;
      min-width: 100px;
    }
    .demo-step-card .demo-metric-val { font-size: 18px; font-weight: 700; }
    .demo-step-card .demo-metric-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .demo-pages { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .demo-page-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: var(--radius);
      background: var(--accent-light);
      color: var(--accent);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      font-family: inherit;
    }
    .demo-page-link:hover { background: var(--accent); color: #fff; }
    .demo-start-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 32px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--accent), #818cf8);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      margin-top: 24px;
    }
    .demo-start-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    @media (max-width: 768px) {
      .demo-step-card { grid-template-columns: 1fr; }
      .demo-step-icon { width: 40px; height: 40px; font-size: 18px; }
      .demo-step-bar { overflow-x: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

    // ---- Focus Trap Hook (UX-FIX-4) ----
    function useFocusTrap(isOpen) {
      const ref = useRef(null);
      useEffect(() => {
        if (!isOpen || !ref.current) return;
        const panel = ref.current;
        const focusable = panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if (focusable.length) focusable[0].focus();
        const trap = (e) => {
          if (e.key !== 'Tab' || !focusable.length) return;
          const first = focusable[0], last = focusable[focusable.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        };
        panel.addEventListener('keydown', trap);
        return () => panel.removeEventListener('keydown', trap);
      }, [isOpen]);
      return ref;
    }

    // ---- Profile Search Page ----
    function ProfileSearchPage() {
      const [profiles, setProfiles] = useState([]);
      const [total, setTotal] = useState(0);
      const [loading, setLoading] = useState(false);
      const [searchError, setSearchError] = useState(null);
      const [query, setQuery] = useState('');
      const [segment, setSegment] = useState('');
      const [status, setStatus] = useState('');
      const [filters, setFilters] = useState({segments: [], statuses: []});
      const [detail, setDetail] = useState(null);
      const [detailData, setDetailData] = useState(null);
      const [journeyData, setJourneyData] = useState(null);

      useEffect(() => { api('/api/profiles/filters').then(setFilters).catch(() => null); }, []);

      // UX-FIX-8: Escape key closes detail panel
      useEffect(() => {
        const handler = (e) => { if (e.key === 'Escape' && detail) { setDetail(null); setDetailData(null); setJourneyData(null); } };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
      }, [detail]);

      const search = useCallback(() => {
        setLoading(true);
        setSearchError(null);
        const params = new URLSearchParams();
        if (query) params.set('q', query);
        if (segment) params.set('segment', segment);
        if (status) params.set('status', status);
        api(`/api/profiles/search?${params}`).then(d => {
          setProfiles(d.profiles || []);
          setTotal(d.total || 0);
        }).catch(e => setSearchError(e.message || 'Failed to search profiles')).finally(() => setLoading(false));
      }, [query, segment, status]);

      useEffect(() => { search(); }, []);

      const openDetail = (entityId) => {
        setDetail(entityId);
        setJourneyData(null);
        api(`/api/profiles/${entityId}`).then(setDetailData);
        api(`/api/profiles/${entityId}/journey`).then(setJourneyData).catch(() => null);
      };

      return (
        <div>
          <div className="page-header">
            <h2>Profile Search</h2>
            <p>Search identity-resolved 360° customer profiles across all source systems</p>
          </div>
          <div className="search-bar">
            <input placeholder="Search by name, entity ID, or account number..." value={query} onChange={e => setQuery(e.target.value)} onKeyDown={e => e.key === 'Enter' && search()} />
            <select value={segment} onChange={e => setSegment(e.target.value)}>
              <option value="">All Segments</option>
              {filters.segments.map(s => <option key={s.segment} value={s.segment}>{s.segment} ({s.count})</option>)}
            </select>
            <select value={status} onChange={e => setStatus(e.target.value)}>
              <option value="">All Statuses</option>
              {filters.statuses.map(s => <option key={s.lifecycle_status} value={s.lifecycle_status}>{s.lifecycle_status} ({s.count})</option>)}
            </select>
            <button className="btn btn-primary" onClick={search}>Search</button>
          </div>
          {searchError && <ErrorCard message={searchError} onRetry={search} />}
          <div className="card">
            <div style={{display:'flex', justifyContent:'space-between', marginBottom: '8px'}}>
              <span style={{fontSize:'13px', color:'var(--text-muted)'}}>{fmt(total)} profiles found</span>
            </div>
            {loading ? <div className="loading" role="status" aria-live="polite">Searching...</div> : (
              <div className="table-scroll">
              <table>
                <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Customer profile search results</caption>
                <thead><tr>
                  <th>Entity ID</th><th>Name</th><th>Lifecycle</th><th>Segment</th>
                  <th>Sources</th><th>Revenue</th><th>Churn Risk</th><th>Xrefs</th>
                </tr></thead>
                <tbody>
                  {profiles.map(p => (
                    <tr key={p.entity_id}>
                      <td><span className="entity-link" tabIndex={0} role="button" onClick={() => openDetail(p.entity_id)} onKeyDown={e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), openDetail(p.entity_id))}>{p.entity_id}</span></td>
                      <td>{p.name}</td>
                      <td><span className={`badge ${statusBadge(p.lifecycle_status)}`}>{p.lifecycle_status}</span></td>
                      <td>{p.customer_segment}</td>
                      <td>
                        <span>{p.source_count || 0} sources</span>
                      </td>
                      <td>{fmtCur(p.total_billed_amount)}</td>
                      <td>
                        {p.churn_risk_score != null && <>
                          <span className={`badge ${p.churn_risk_score > 0.7 ? 'badge-danger' : p.churn_risk_score > 0.4 ? 'badge-warning' : 'badge-success'}`} style={{marginRight:'4px'}}>{p.churn_risk_score > 0.7 ? 'HIGH' : p.churn_risk_score > 0.4 ? 'MED' : 'LOW'}</span>
                          <span style={{fontSize:'12px', color:'var(--text-secondary)'}}>{(p.churn_risk_score * 100).toFixed(0)}%</span>
                        </>}
                      </td>
                      <td>{p.xref_count || 0}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              </div>
            )}
          </div>

          {detail && detailData && (
            <div className="detail-panel" role="dialog" aria-label="Customer profile detail" ref={useFocusTrap(!!detail)}>
              <button className="detail-close" aria-label="Close detail panel" onClick={() => {setDetail(null); setDetailData(null); setJourneyData(null);}}><Icon d={icons.x} size={16} /></button>
              <h2 style={{marginBottom: '4px'}}>Entity {detail}</h2>
              {detailData.entity && (
                <div style={{marginBottom: '16px'}}>
                  <span className={`badge ${statusBadge(detailData.entity.status)}`}>{detailData.entity.status}</span>
                  <span style={{marginLeft:'8px', color:'var(--text-muted)', fontSize:'12px'}}>{detailData.entity.entity_type}</span>
                </div>
              )}
              <div className="detail-section">
                <h3>Linked Accounts ({detailData.accounts?.length || 0})</h3>

                  <div key={i} style={{padding:'8px', borderBottom:'1px solid var(--border)', fontSize:'13px'}}>
                    <span className={`source-badge source-${a.source_instance}`}>{a.source_instance}</span>
                    {a.account_name} — <span className={`badge ${statusBadge(a.account_status)}`}>{a.account_status}</span>
                    {a.mrr && <span style={{marginLeft:'8px', color:'var(--success)'}}>{fmtCur(a.mrr)} MRR</span>}
                  </div>
                ))}
              </div>
              <div className="detail-section">
                <h3>Identity Graph ({detailData.identity_graph?.length || 0} cross-refs)</h3>
                {detailData.identity_graph?.map((x, i) => (
                  <div key={i} style={{padding:'6px 0', fontSize:'12px', display:'flex', alignItems:'center', gap:'8px'}}>
                    <span className={`source-badge source-${x.source_instance}`}>{x.source_instance}</span>
                    <span style={{color:'var(--text-secondary)'}}>{x.object_type}:{x.source_record_id}</span>
                    <span className="badge badge-neutral">{x.match_rule}</span>

                        <div style={{fontSize:'20px', fontWeight:700, color:'var(--success)'}}>

                          {detailData.ml_predictions.ltv.ltv_tier} LTV

                    </div>

              {/* V10: Customer Journey Timeline */}
              {journeyData && journeyData.events && journeyData.events.length > 0 && (

                    <Icon d={icons.trendingUp} size={14} /> Customer Journey ({journeyData.total_events} events)

                  <div style={{display:'flex', gap:'6px', marginBottom:'10px', flexWrap:'wrap'}}>
                    {Object.entries(journeyData.event_type_counts || {}).map(([type, count]) => (
                      <span key={type} className="badge" style={{
                        background: type === 'digital' ? 'var(--accent-light)' :
                                    type === 'activation' ? 'var(--success-bg)' :
                                    type === 'identity' ? 'var(--info-bg)' :
                                    type === 'campaign' ? 'var(--warning-bg)' :
                                    type === 'consent' ? 'rgba(107,111,136,0.15)' : 'var(--bg-hover)',
                        color: type === 'digital' ? 'var(--accent)' :
                               type === 'activation' ? 'var(--success)' :
                               type === 'identity' ? 'var(--info)' :
                               type === 'campaign' ? 'var(--warning)' :
                               type === 'consent' ? 'var(--text-secondary)' : 'var(--text-secondary)',
                      }}>{type} ({count})</span>
                    ))}
                  </div>
                  <div style={{position:'relative', paddingLeft:'20px', borderLeft:'2px solid var(--border)'}}>
                    {journeyData.events.slice(0, 20).map((ev, i) => {
                      const typeColor = ev.event_type === 'digital' ? 'var(--accent)' :
                                        ev.event_type === 'activation' ? 'var(--success)' :
                                        ev.event_type === 'identity' ? 'var(--info)' :
                                        ev.event_type === 'campaign' ? 'var(--warning)' :
                                        ev.event_type === 'consent' ? 'var(--text-muted)' : 'var(--text-secondary)';
                      const ts = ev.event_timestamp ? new Date(ev.event_timestamp).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '';
                      return (
                        <div key={i} style={{position:'relative', paddingBottom:'12px', fontSize:'12px'}}>
                          <div style={{position:'absolute', left:'-25px', top:'2px', width:'10px', height:'10px', borderRadius:'50%', background: typeColor, border:'2px solid var(--bg-secondary)'}} />

                            <span style={{fontSize:'10px', fontWeight:600, textTransform:'uppercase', color: typeColor}}>{ev.event_type}</span>
                            {ev.source_system && <span className={`source-badge source-${ev.source_system}`} style={{fontSize:'9px'}}>{ev.source_system}</span>}
                            <span style={{color:'var(--text-muted)', fontSize:'10px', marginLeft:'auto'}}>{ts}</span>
                          </div>
                          <div style={{color:'var(--text-primary)', marginTop:'2px', fontWeight:500}}>
                            {ev.event_category}{ev.event_detail ? ` \u2014 ${ev.event_detail}` : ''}
                          </div>
                          <div style={{color:'var(--text-muted)', marginTop:'1px', display:'flex', gap:'8px', flexWrap:'wrap'}}>
                            {ev.source_channel && <span>{ev.source_channel}</span>}
                            {ev.delivery_status && <span className={`badge ${ev.delivery_status === 'delivered' ? 'badge-success' : ev.delivery_status === 'bounced' ? 'badge-danger' : 'badge-neutral'}`}>{ev.delivery_status}</span>}
                            {ev.conversion_outcome && <span className="badge badge-success">Converted</span>}
                            {ev.attributed_revenue && Number(ev.attributed_revenue) > 0 && <span style={{color:'var(--success)'}}>{fmtCur(ev.attributed_revenue)}</span>}
                            {ev.device_type && <span>{ev.device_type}</span>}
                            {ev.duration_seconds && <span>{ev.duration_seconds}s</span>}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  <div style={{fontSize:'10px', color:'var(--text-muted)', marginTop:'8px', padding:'6px 8px', background:'var(--accent-light)', borderRadius:'var(--radius)'}}>
                    <span className="diff-badge">UNIQUE</span> Cross-source journey across {Object.keys(journeyData.event_type_counts || {}).length} data domains \u2014 identity-resolved to a single entity
                  </div>
                </div>
              )}
              {journeyData && (!journeyData.events || journeyData.events.length === 0) && (
                <div className="detail-section">
                  <h3>Customer Journey</h3>
                  <div style={{fontSize:'12px', color:'var(--text-muted)'}}>No journey events found for this entity.</div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ---- Audience Builder Page ----
    function AudienceBuilderPage() {
      const [data, setData] = useState(null);

      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

        setLoading(true);

          api('/api/audiences'),
          api('/api/audiences/summary'),
        ]).then(([d, s]) => { setData(d); setSummary(s); }).catch(e => setError(e.message || 'Failed to load audiences')).finally(() => setLoading(false));
      }, []);

      if (loading) return <div className="loading" role="status" aria-live="polite">Loading audiences...</div>;

              <div className="card-title">Channel Reach</div>
              {channels.map(c => (
                <div className="bar-chart-row" key={c.channel_type} role="img" aria-label={`${c.channel_type}: ${fmt(c.reach)} reach`}>
                  <div className="bar-label">{c.channel_type}</div>
                  <div className="bar-track">
                    <div className="bar-fill" style={{width: `${(c.reach/maxReach*100).toFixed(0)}%`, background: 'var(--accent)'}}>{fmt(c.reach)}</div>
                  </div>

              ))}

              <div className="card-title">CustomerLake Advantage</div>
              <ul style={{listStyle:'none', fontSize:'13px', lineHeight:'2.2'}}>

                <li><span className="diff-badge">RESOLVE</span> Entity-level targeting ensures campaigns reach real people, not records</li>
                <li><span className="diff-badge">MULTI-CH</span> {channels.length} channels orchestrated from a single audience definition</li>
                <li><span className="diff-badge">CONSENT</span> Consent-aware: audiences respect opt-out preferences</li>

          <div className="card">
            <div className="card-title">Audience Segments</div>
            <div className="table-scroll">
            <table>
              <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Audience segments with entity-level deduplication</caption>
              <thead><tr><th>Audience</th><th>Purpose</th><th>Channel</th><th>Members</th><th>Unique Entities</th><th>Orgs</th></tr></thead>
              <tbody>
                {(data?.audiences || []).slice(0, 40).map((a, i) => (
                  <tr key={i}>
                    <td style={{fontWeight:500}}>{a.audience_name}</td>
                    <td><span className="badge badge-info">{a.purpose}</span></td>
                    <td>{a.channel_type}</td>
                    <td>{fmt(a.total_members)}</td>
                    <td>{fmt(a.unique_entities)}</td>
                    <td>{fmt(a.unique_orgs)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            </div>
          </div>
        </div>
      );
    }

                <div style={{fontSize:'13px'}}>

                  {[['Sends', fs.sends, 'var(--text-secondary)'],

                    ['Responses', fs.responses, 'var(--accent)'],
                    ['Meetings', fs.meetings, 'var(--warning)'],

                    const maxVal = fs.sends || 1;

                        <div className="bar-label">{label}</div>
                        <div className="bar-track">
                          <div className="bar-fill" style={{width: `${Math.max((val/maxVal*100), 5).toFixed(0)}%`, background: color}}>{fmt(val)}</div>

                      </div>
                    );
                  })}
                </div>
                <div style={{fontSize:'13px', color:'var(--text-muted)', marginTop:'8px'}}>

              </div>
              <div className="card">

                <div className="table-scroll">

                  <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Conversion funnel metrics by campaign</caption>
                  <thead><tr><th>Campaign</th><th>Channel</th><th>Sends</th><th>Opens</th><th>Responses</th><th>Conversions</th><th>Open Rate</th><th>Conv Rate</th><th>Avg Deal</th><th>Revenue</th></tr></thead>
                  <tbody>
                    {(funnel?.campaigns || []).map((c, i) => (
                      <tr key={i}>

                        <td>{c.channel_type}</td>
                        <td>{fmt(c.sends)}</td>
                        <td>{fmt(c.opens)}</td>
                        <td>{fmt(c.responses)}</td>
                        <td>{fmt(c.conversions)}</td>
                        <td>{fmtPct(c.avg_open_rate)}</td>
                        <td>{fmtPct(c.avg_conversion_rate)}</td>
                        <td>{fmtCur(c.avg_deal_size)}</td>
                        <td style={{color:'var(--success)'}}>{fmtCur(c.revenue)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                </div>
              </div>
            </div>
          )}
          {view === 'activation' && activation && (() => {

            const actCh = activation?.channels || [];

                  <div className="kpi-card">
                    <div className="kpi-label">Total Activations</div>
                    <div className="kpi-value">{fmt(actSum.total_activations)}</div>
                    <div className="kpi-sub">{actSum.channel_count} channels · {actSum.platform_count} platforms</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Omnichannel Revenue</div>
                    <div className="kpi-value" style={{color:'var(--success)'}}>{fmtCur(actSum.total_revenue)}</div>
                    <div className="kpi-sub">ROAS: {actSum.overall_roas}x on {fmtCur(actSum.total_cost)} spend</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Conversion Rate</div>
                    <div className="kpi-value">{fmtPct(actSum.overall_conversion_rate)}</div>
                    <div className="kpi-sub">{fmt(actSum.total_conversions)} across all channels</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Unique Entities</div>
                    <div className="kpi-value">{fmt(actSum.unique_entities)}</div>
                    <div className="kpi-sub">{actSum.audiences_activated} audiences activated</div>
                  </div>
                </div>
                <div className="card">
                  <div className="card-title">Channel + Platform Performance</div>
                  {actCh.map((c, i) => (
                    <div className="bar-chart-row" key={i} role="img" aria-label={`${c.channel}: ${fmtCur(c.total_revenue)} revenue`}>
                      <div className="bar-label" style={{width:'130px'}}>{c.channel}</div>
                      <div className="bar-track">
                        <div className="bar-fill" style={{width: `${Math.max((c.total_revenue/maxRev*100), 8).toFixed(0)}%`, background: c.channel === 'email' ? 'var(--accent)' : c.channel === 'paid_social' ? 'var(--info)' : c.channel === 'sms' ? '#6B8CC7' : c.channel === 'push_notification' ? 'var(--text-secondary)' : 'var(--text-muted)'}}>{fmtCur(c.total_revenue)}</div>
                      </div>
                    </div>

                </div>
                <div className="card">
                  <div className="card-title">Activation Detail</div>
                  <div className="table-scroll">
                  <table>
                    <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Omnichannel activation from activation_log</caption>
                    <thead><tr><th>Channel</th><th>Platform</th><th>Activations</th><th>Conversions</th><th>Conv Rate</th><th>Cost</th><th>Revenue</th><th>ROAS</th><th>Match Rate</th></tr></thead>
                    <tbody>
                      {actCh.map((c, i) => (
                        <tr key={i}>
                          <td style={{fontWeight:500}}>{c.channel}</td>
                          <td>{c.platform}</td>
                          <td>{fmt(c.activations)}</td>
                          <td>{fmt(c.conversions)}</td>
                          <td>{fmtPct(c.conversion_rate)}</td>
                          <td>{fmtCur(c.total_cost)}</td>
                          <td style={{color:'var(--success)'}}>{fmtCur(c.total_revenue)}</td>
                          <td style={{fontWeight:600, color: c.roas > 5 ? 'var(--success)' : c.roas > 1 ? 'var(--warning)' : 'var(--danger)'}}>{c.roas ? c.roas + 'x' : '—'}</td>
                          <td>{fmtPct(c.avg_match_rate)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  </div>
                </div>
                {/* V4: Purpose Breakdown — addresses CMO-9 cost/ROI by purpose */}
                {activation?.by_purpose && activation.by_purpose.length > 0 && (
                  <div className="card">
                    <div className="card-title">ROI by Marketing Purpose</div>
                    <div className="table-scroll">

                      <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Revenue and cost attribution by marketing purpose — the CMO's view</caption>

                      <tbody>
                        {activation.by_purpose.map((p, i) => {
                          const roi = p.cost > 0 ? ((p.revenue - p.cost) / p.cost * 100).toFixed(0) : null;

                            <tr key={i}>
                              <td style={{fontWeight:500}}>{p.purpose}</td>
                              <td>{fmt(p.activations)}</td>
                              <td>{fmt(p.conversions)}</td>
                              <td>{fmtCur(p.cost)}</td>
                              <td style={{color:'var(--success)'}}>{fmtCur(p.revenue)}</td>

                  </div>

          })()}

    // ---- Identity Steward Page ----
    function IdentityStewardPage() {
      const [inbox, setInbox] = useState({items: [], counts: {}});
      const [loading, setLoading] = useState(true);
      const [filter, setFilter] = useState('pending');
      const [entityDetail, setEntityDetail] = useState(null);
      const [actionError, setActionError] = useState(null);
      const [revImpact, setRevImpact] = useState(null);
      const [revLoading, setRevLoading] = useState(true);
      const [revError, setRevError] = useState(null);

      const loadInbox = useCallback(() => {
        setLoading(true);
        api(`/api/steward/inbox?status_filter=${filter}`)
          .then(setInbox)
          .finally(() => setLoading(false));
      }, [filter]);

      useEffect(() => { loadInbox(); }, [loadInbox]);

      // APP-IDENTITY-REV: Load revenue impact data
      useEffect(() => {
        setRevLoading(true);
        setRevError(null);
        api('/api/steward/revenue-impact')
          .then(setRevImpact)
          .catch(err => { setRevImpact(null); setRevError(err.message || 'Failed to load revenue impact data'); })
          .finally(() => setRevLoading(false));
      }, []);

      // V7-UX-FIX-2: Escape-to-close for entity detail panel
      useEffect(() => {
        const handler = (e) => { if (e.key === 'Escape' && entityDetail) setEntityDetail(null); };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
      }, [entityDetail]);

      const handleAction = async (decisionId, action) => {
        try {
          await apiPost('/api/steward/adjudicate', {
            decision_id: decisionId,
            action: action,
            steward_notes: `${action} via CustomerLake Steward UI`,
            steward_id: 'demo_steward',
          });
          loadInbox();
        } catch (err) {
          console.error('Steward action failed:', err);
          setActionError(err.message);
          setTimeout(() => setActionError(null), 5000);
        }
      };

      const openEntity = (entityId) => {
        api(`/api/steward/entity/${entityId}`).then(setEntityDetail);
      };

      const counts = inbox.counts || {};

      return (
        <div>
          <div className="page-header">
            <h2>Identity Steward</h2>
            <p>Revenue-aware identity resolution: adjudication, conflict triage, and marketing impact powered by Lakebase</p>
          </div>
          {actionError && (
            <div role="alert" style={{background:'var(--danger-bg)', border:'1px solid var(--danger)', borderRadius:'var(--radius-lg)', padding:'16px 24px', marginBottom:'16px', display:'flex', alignItems:'center', justifyContent:'space-between', fontSize:'13px'}}>
              <span style={{color:'var(--danger)', fontWeight:500}}>Action failed: {actionError}</span>
              <button className="btn btn-ghost btn-sm" onClick={() => setActionError(null)} aria-label="Dismiss error" style={{color:'var(--danger)', padding:'4px 8px'}}><Icon d={icons.x} size={14} /></button>
            </div>
          )}
          <div className="kpi-grid">
            <div className="kpi-card">
              <div className="kpi-label">Pending Review</div>
              <div className="kpi-value" style={{color:'var(--info)'}}>{fmt(counts.pending)}</div>
            </div>
            <div className="kpi-card">
              <div className="kpi-label">Approved</div>
              <div className="kpi-value" style={{color:'var(--success)'}}>{fmt(counts.approved)}</div>
            </div>
            <div className="kpi-card">
              <div className="kpi-label">Rejected</div>
              <div className="kpi-value" style={{color:'var(--danger)'}}>{fmt(counts.rejected)}</div>
            </div>
             <div className="kpi-card">
               <div className="kpi-label">Deferred</div>
               <div className="kpi-value">{fmt(counts.deferred)}</div>
             </div>
           </div>

           {/* APP-IDENTITY-REV: Revenue Impact of Identity Resolution */}
           {revLoading ? (
             <div className="card" role="status" aria-live="polite" style={{textAlign:'center',padding:'24px',color:'var(--text-muted)'}}>Loading revenue impact data...</div>
           ) : revError ? (
             <div className="error-card" role="alert">
               <p>Failed to load revenue impact data</p>
               <p className="error-detail">{revError}</p>
               <button className="btn btn-primary btn-sm" onClick={() => { setRevLoading(true); setRevError(null); api('/api/steward/revenue-impact').then(setRevImpact).catch(err => { setRevImpact(null); setRevError(err.message); }).finally(() => setRevLoading(false)); }}>Retry</button>
             </div>
           ) : revImpact && revImpact.headline && !revImpact.error ? (() => {
             const h = revImpact.headline;
             const tiers = revImpact.tier_revenue || [];
             const maxTierRev = Math.max(...tiers.map(t => t.total_revenue || 0), 1);
             const eq = revImpact.entity_quality || [];
             return (
               <div>
                 {/* Differentiator banner */}
                 <div role="note" style={{background:'var(--accent-light)',border:'1px solid var(--accent)',borderRadius:'var(--radius-lg)',padding:'12px 20px',marginBottom:'16px',fontSize:'13px',color:'var(--accent)'}}>
                   <strong>CustomerLake Differentiator:</strong> {revImpact.differentiator}
                 </div>

                 {/* Revenue impact KPIs */}
                 <div className="kpi-grid" style={{gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))'}}>
                   <div className="kpi-card">
                     <div className="kpi-label">Attributed Revenue</div>
                     <div className="kpi-value" style={{color:'var(--success)'}}>{fmtCur(h.total_attributed_revenue)}</div>
                     <div className="kpi-sub">100% from resolved entities</div>
                   </div>
                   <div className="kpi-card">
                     <div className="kpi-label">Revenue at Risk</div>
                     <div className="kpi-value" style={{color:'var(--danger)'}}>{fmtCur(h.revenue_at_risk)}</div>
                     <div className="kpi-sub">{h.risk_pct}% of total — from identity conflicts</div>
                   </div>
                   <div className="kpi-card">
                     <div className="kpi-label">Identity Conflicts</div>
                     <div className="kpi-value" style={{color:'var(--warning)'}}>{fmt(h.total_conflicts)}</div>
                     <div className="kpi-sub">{fmt(h.conflicted_entities)} entities affected</div>
                   </div>
                   <div className="kpi-card">
                     <div className="kpi-label">Conversions at Risk</div>
                     <div className="kpi-value" style={{color:'var(--danger)'}}>{fmt(h.conversions_at_risk)}</div>
                     <div className="kpi-sub">Attributed to conflicted identities</div>
                   </div>
                 </div>

                 {/* Diff-badges: What only CustomerLake can do here (V16-UX-FIX-3) */}
                 <div style={{display:'flex', gap:6, flexWrap:'wrap', marginBottom:16}}>
                   <span className="diff-badge">IDENTITY-RESOLVED</span>
                   <span className="diff-badge">CROSS-SOURCE</span>
                   <span className="diff-badge">REVENUE-LINKED</span>
                   <span className="diff-badge">CONFLICT-AWARE</span>
                 </div>

                 {/* Revenue by Resolution Tier */}
                 <div className="card">
                   <div className="card-title">Revenue by Identity Resolution Tier</div>
                   <p style={{fontSize:'12px',color:'var(--text-muted)',marginBottom:'12px'}}>Higher-resolution entities (more cross-source links) drive disproportionate revenue</p>
                   {tiers.map((t, i) => {
                     const pct = maxTierRev > 0 ? ((t.total_revenue || 0) / maxTierRev * 100) : 0;
                     const tierLabel = t.resolution_tier === 'high' ? 'High (3+ sources)' : t.resolution_tier === 'medium' ? 'Medium (2 sources)' : 'Single source';
                     const tierColor = t.resolution_tier === 'high' ? 'var(--success)' : t.resolution_tier === 'medium' ? 'var(--accent)' : 'var(--text-muted)';
                     return (
                       <div key={i} style={{marginBottom:'12px'}}>
                         <div style={{display:'flex',justifyContent:'space-between',marginBottom:'4px',fontSize:'13px'}}>
                           <span style={{color:'var(--text-primary)',fontWeight:500}}>{tierLabel}</span>
                           <span style={{color:'var(--text-secondary)'}}>{fmtCur(t.total_revenue)} · {fmt(t.entities)} entities · {fmt(t.conversions)} conversions</span>
                         </div>
                         <div className="bar-chart-row" role="img" aria-label={`${tierLabel}: ${fmtCur(t.total_revenue)} revenue from ${fmt(t.entities)} entities`} style={{height:'8px',background:'var(--bg-hover)',borderRadius:'4px'}}>
                           <div style={{width:`${pct}%`,height:'100%',background:tierColor,borderRadius:'4px',transition:'width 0.3s'}}></div>
                         </div>
                       </div>
                     );
                   })}
                 </div>

                 {/* Entity Resolution Quality by Type */}
                 {eq.length > 0 && (
                   <div className="card">
                     <div className="card-title">Resolution Quality by Entity Type</div>
                     <div className="table-scroll">
                     <table>
                       <caption className="kpi-label" style={{captionSide:'top',textAlign:'left',marginBottom:'8px'}}>Cross-source linking depth per entity type</caption>
                       <thead><tr><th>Type</th><th>Total</th><th>Avg Xrefs</th><th>High (3+)</th><th>Medium (2)</th><th>Single</th></tr></thead>
                       <tbody>
                         {eq.map((row, i) => (
                           <tr key={i}>
                             <td style={{fontWeight:500,textTransform:'capitalize'}}>{row.entity_type}</td>
                             <td>{fmt(row.entity_count)}</td>
                             <td>{row.avg_xrefs}</td>
                             <td><span className="badge badge-success">{fmt(row.high_res)}</span></td>
                             <td><span className="badge badge-info">{fmt(row.medium_res)}</span></td>
                             <td><span className="badge badge-neutral">{fmt(row.single_source)}</span></td>
                           </tr>
                         ))}
                       </tbody>
                     </table>
                     </div>
                   </div>
                 )}
               </div>
             );
           })() : null}

           <div className="card">
             <div style={{display:'flex', gap:'8px', marginBottom:'12px'}} role="tablist" aria-label="Identity steward decision filters">
              {['pending','approved','rejected','deferred'].map(s => (
                <button key={s} role="tab" id={`tab-steward-${s}`} aria-selected={filter === s} aria-controls="panel-steward-decisions" className={`btn btn-sm ${filter === s ? 'btn-primary' : 'btn-ghost'}`}
                  onClick={() => setFilter(s)}>{s} ({counts[s] || 0})</button>
              ))}
            </div>
            <div role="tabpanel" id="panel-steward-decisions" aria-labelledby={`tab-steward-${filter}`}>
            {loading ? <div className="loading" role="status" aria-live="polite">Loading review items...</div> : (
              inbox.items.length === 0 ? <div className="empty-state" role="status" aria-live="polite">No items with status "{filter}"</div> : (
                <div className="table-scroll">
                <table>
                  <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Identity resolution decisions for steward review</caption>
                  <thead><tr><th>Decision ID</th><th>Decision</th><th>Rule</th><th>Confidence</th><th>Date</th><th>Actions</th></tr></thead>
                  <tbody>
                    {inbox.items.map((item, i) => (
                      <tr key={i}>
                        <td style={{fontFamily:'monospace', fontSize:'12px'}}>{item.decision_id?.substring(0, 12)}...</td>
                        <td><span className={`badge ${statusBadge(item.original_decision || item.status)}`}>{item.original_decision || item.status}</span></td>
                        <td>{item.match_rule || '—'}</td>
                        <td>
                          {item.confidence != null && <>
                            <span style={{fontSize:'12px'}}>{(item.confidence * 100).toFixed(0)}% {item.confidence >= 0.8 ? '(high)' : item.confidence >= 0.5 ? '(med)' : '(low)'}</span>
                            <div className="confidence-bar" role="meter" aria-label={`Confidence: ${(item.confidence*100).toFixed(0)}%`} aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(item.confidence*100)}><div className="confidence-fill" style={{width:`${item.confidence*100}%`, background: item.confidence >= 0.8 ? 'var(--success)' : item.confidence >= 0.5 ? 'var(--warning)' : 'var(--danger)'}}></div></div>
                          </>}
                        </td>
                        <td style={{fontSize:'12px', color:'var(--text-muted)'}}>{item.decided_at ? new Date(item.decided_at).toLocaleDateString() : '—'}</td>
                        <td>
                          {filter === 'pending' && (
                            <div className="steward-actions">
                              <button className="btn btn-sm btn-success" onClick={() => handleAction(item.decision_id, 'approve')}>Approve</button>
                              <button className="btn btn-sm btn-danger" onClick={() => handleAction(item.decision_id, 'reject')}>Reject</button>
                              <button className="btn btn-sm btn-ghost" onClick={() => handleAction(item.decision_id, 'defer')}>Defer</button>
                            </div>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                </div>
              )
            )}
            </div>
          </div>

          {entityDetail && (
            <div className="detail-panel" role="dialog" aria-label="Entity detail" ref={useFocusTrap(!!entityDetail)}>
              <button className="detail-close" aria-label="Close entity detail panel" onClick={() => setEntityDetail(null)}><Icon d={icons.x} size={16} /></button>
              <h2>Entity Detail</h2>
              {entityDetail.entity && (
                <div style={{marginTop:'12px'}}>
                  <div className="kpi-grid" style={{gridTemplateColumns:'1fr 1fr'}}>
                    <div><div className="kpi-label">Entity ID</div><div style={{fontWeight:600}}>{entityDetail.entity.entity_id}</div></div>
                    <div><div className="kpi-label">Status</div><span className={`badge ${statusBadge(entityDetail.entity.status)}`}>{entityDetail.entity.status}</span></div>
                  </div>
                </div>
              )}
              <div className="detail-section">
                <h3>Cross-References ({entityDetail.cross_references?.length || 0})</h3>

              <li><span className="diff-badge">CONSENT</span> Reachability validation ensures campaigns target customers who can legally receive them</li>

                  <div className="kpi-card">
                    <div className="kpi-label">Total Activations</div>
                    <div className="kpi-value">{fmt(actSum.total_activations)}</div>
                    <div className="kpi-sub">{actSum.channel_count} channels · {actSum.platform_count} platforms</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Attribution Revenue</div>
                    <div className="kpi-value" style={{color:'var(--success)'}}>{fmtCur(actSum.total_revenue)}</div>
                    <div className="kpi-sub">ROAS: {actSum.overall_roas}x</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Total Spend</div>
                    <div className="kpi-value" style={{color:'var(--warning)'}}>{fmtCur(actSum.total_cost)}</div>

                    <div style={{fontSize:'13px', fontWeight:600, marginBottom:'8px', color:'var(--text-primary)'}}>Revenue by Channel + Platform</div>

                      <div className="bar-chart-row" key={i} role="img" aria-label={`${c.channel}/${c.platform}: ${fmtCur(c.total_revenue)} revenue`}>
                        <div className="bar-label" style={{width:'130px'}}>{c.channel}/{c.platform?.split('_')[0]}</div>
                        <div className="bar-track">
                          <div className="bar-fill" style={{width: `${Math.max((c.total_revenue/maxActRev*100), 8).toFixed(0)}%`, background: c.channel === 'email' ? 'var(--accent)' : c.channel === 'paid_social' ? 'var(--info)' : c.channel === 'sms' ? '#6B8CC7' : c.channel === 'push_notification' ? 'var(--text-secondary)' : 'var(--text-muted)'}}>{fmtCur(c.total_revenue)}</div>

                  <div>
                    <div style={{fontSize:'13px', fontWeight:600, marginBottom:'8px', color:'var(--text-primary)'}}>By Campaign Purpose</div>
                    {byPurpose.map((p, i) => (
                      <div key={i} style={{padding:'8px 0', borderBottom:'1px solid var(--border)', fontSize:'13px'}}>
                        <div style={{display:'flex', justifyContent:'space-between'}}>
                          <span style={{fontWeight:500}}>{p.purpose}</span>

                  <tbody>
                    {channels.map((c, i) => (
                      <tr key={i}>
                        <td style={{fontWeight:500}}>{c.channel}</td>

                        <td>{fmt(c.conversions)}</td>
                        <td>{fmtPct(c.conversion_rate)}</td>
                        <td>{fmtCur(c.total_cost)}</td>
                        <td style={{color:'var(--success)'}}>{fmtCur(c.total_revenue)}</td>
                        <td style={{fontWeight:600, color: c.roas > 5 ? 'var(--success)' : c.roas > 1 ? 'var(--warning)' : 'var(--danger)'}}>{c.roas ? c.roas + 'x' : '—'}</td>

    // ---- ML Predictions Page (V6 — CMO-24, CMO-19) ----
    function MLPredictionsPage() {
      const [data, setData] = useState(null);
      const [matrix, setMatrix] = useState(null);
      const [scores, setScores] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [scoresLoading, setScoresLoading] = useState(false);
      const [scoresError, setScoresError] = useState(null);
      const [searchQ, setSearchQ] = useState('');
      const [riskFilter, setRiskFilter] = useState('');
      const [segFilter, setSegFilter] = useState('');
      const [scoresPage, setScoresPage] = useState(0);

      const load = useCallback(() => {
        setLoading(true);
        setError(null);
        Promise.all([
          api('/api/intelligence/ml-predictions'),
          api('/api/intelligence/ml-risk-matrix'),
        ]).then(([pred, mat]) => {
          setData(pred);
          setMatrix(mat);
          setLoading(false);
        }).catch(e => { setError(e.message); setLoading(false); });
      }, []);

      useEffect(() => { load(); }, [load]);

      // Load entity scores
      const loadScores = useCallback(() => {
        setScoresLoading(true);
        setScoresError(null);
        const params = new URLSearchParams({ limit: '30', offset: String(scoresPage * 30) });
        if (searchQ) params.set('q', searchQ);
        if (riskFilter) params.set('risk_tier', riskFilter);
        if (segFilter) params.set('value_segment', segFilter);
        api('/api/intelligence/ml-entity-scores?' + params)
          .then(d => { setScores(d); setScoresLoading(false); })
          .catch(e => { setScoresError(e.message); setScoresLoading(false); });
      }, [searchQ, riskFilter, segFilter, scoresPage]);

      useEffect(() => { loadScores(); }, [loadScores]);

      if (loading) return <div className="loading" role="status" aria-live="polite">Loading ML predictions...</div>;
      if (error) return <ErrorCard message={error} onRetry={load} />;
      if (!data) return <div className="empty-state" aria-live="polite">No ML prediction data available</div>;

      const cs = data.churn_summary || {};
      const ls = data.ltv_summary || {};

      const tierColor = (tier) => {
        const m = { CRITICAL: 'var(--danger)', HIGH: 'var(--warning)', MEDIUM: 'var(--info)', LOW: 'var(--success)', MINIMAL: 'var(--success)' };
        return m[tier] || 'var(--text-muted)';
      };
      const tierBadge = (tier) => {
        const m = { CRITICAL: 'badge-danger', HIGH: 'badge-warning', MEDIUM: 'badge-info', LOW: 'badge-success', MINIMAL: 'badge-success' };
        return m[tier] || 'badge-neutral';
      };
      const ltvColor = (tier) => {
        const m = { 'Very High': 'var(--success)', High: 'var(--success)', Medium: 'var(--info)', Low: 'var(--warning)' };
        return m[tier] || 'var(--text-muted)';
      };
      const segColor = (seg) => {
        const m = { 'Protect & Retain': 'var(--danger)', 'Grow': 'var(--success)', 'Nurture': 'var(--info)', 'Monitor': 'var(--warning)', 'Acquire': 'var(--accent)' };
        return m[seg] || 'var(--text-muted)';
      };

      const maxChurn = Math.max(...(data.churn_tiers || []).map(t => t.entity_count), 1);
      const maxLtv = Math.max(...(data.ltv_tiers || []).map(t => t.entity_count), 1);
      const maxSeg = Math.max(...(data.value_segments || []).map(t => t.entity_count), 1);

      // Risk matrix helpers
      const matrixData = matrix?.matrix || [];
      const churnTierOrder = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'MINIMAL'];
      const ltvTierOrder = ['Very High', 'High', 'Medium', 'Low'];
      const getCell = (ct, lt) => matrixData.find(m => m.churn_risk_tier === ct && m.ltv_tier === lt);
      const maxMatrixCount = Math.max(...matrixData.map(m => m.entity_count), 1);

      return (
        <div>
          <div className="page-header">
            <h2>ML Predictions</h2>
            <p>AI-powered churn, LTV, and propensity scores from trained ML models on identity-resolved profiles</p>
          </div>

          {/* KPI Cards */}
          <div className="kpi-grid">
            <div className="kpi-card">
              <div className="kpi-label">Entities Scored</div>
              <div className="kpi-value">{fmt(cs.total_scored)}</div>
              <div className="kpi-sub">Across churn + LTV + propensity models</div>
            </div>
            <div className="kpi-card">
              <div className="kpi-label">Avg Churn Probability</div>
              <div className="kpi-value" style={{color: (cs.avg_churn_prob||0) > 0.5 ? 'var(--danger)' : 'var(--success)'}}>
                {cs.avg_churn_prob != null ? (cs.avg_churn_prob * 100).toFixed(1) + '%' : '\u2014'}
              </div>
              <div className="kpi-sub">LightGBM model, AUC = 0.976</div>
            </div>
            <div className="kpi-card">
              <div className="kpi-label">Revenue at Risk</div>
              <div className="kpi-value" style={{color:'var(--danger)'}}>{fmtCur(cs.total_revenue_at_risk)}</div>
              <div className="kpi-sub">{fmt(cs.high_risk_count)} CRITICAL + HIGH risk entities</div>
            </div>
            <div className="kpi-card">
              <div className="kpi-label">Avg Predicted LTV (12m)</div>
              <div className="kpi-value" style={{color:'var(--success)'}}>{fmtCur(ls.avg_predicted_ltv)}</div>
              <div className="kpi-sub">Total: {fmtCur(ls.total_predicted_ltv)} | Median: {fmtCur(ls.median_ltv)}</div>
            </div>
          </div>

          {/* Model Info Banner */}
          <div className="card" style={{background:'var(--accent-light)', borderColor:'var(--accent)', marginBottom:'16px'}}>
            <div style={{display:'flex', gap:'24px', flexWrap:'wrap', fontSize:'13px'}}>
              <div><strong>Churn Model:</strong> LightGBM, AUC=0.976, {fmt(cs.total_scored)} scored</div>
              <div><strong>LTV Model:</strong> LightGBM Regressor, R\u00b2=0.999, {fmt(ls.total_scored)} scored</div>
              <div><strong>Source:</strong> <code style={{color:'var(--accent)'}}>gold.churn_prediction</code>, <code style={{color:'var(--accent)'}}>gold.ltv_prediction</code>, <code style={{color:'var(--accent)'}}>gold.propensity_scores</code></div>
            </div>
          </div>

          <div className="grid-2">
            {/* Churn Risk Tier Distribution */}
            <div className="card">
              <div className="card-title">Churn Risk Tier Distribution</div>
              {(data.churn_tiers || []).map(t => (
                <div className="bar-chart-row" key={t.churn_risk_tier}
                  role="img" aria-label={`${t.churn_risk_tier}: ${fmt(t.entity_count)} entities, ${fmtCur(t.total_revenue_at_risk)} revenue at risk`}>
                  <div className="bar-label">{t.churn_risk_tier}</div>
                  <div className="bar-track">
                    <div className="bar-fill" style={{
                      width: (t.entity_count / maxChurn * 100) + '%',
                      background: tierColor(t.churn_risk_tier),
                    }}>{fmt(t.entity_count)}</div>
                  </div>
                  <div style={{fontSize:'11px', color:'var(--text-muted)', width:'90px', textAlign:'right'}}>
                    {fmtCur(t.total_revenue_at_risk)}
                  </div>
                </div>
              ))}
              <div style={{fontSize:'11px', color:'var(--text-muted)', marginTop:'8px', textAlign:'right'}}>Revenue at risk shown right</div>
            </div>

            {/* LTV Tier Distribution */}
            <div className="card">
              <div className="card-title">LTV Tier Distribution (12-month predicted)</div>
              {(data.ltv_tiers || []).map(t => (
                <div className="bar-chart-row" key={t.ltv_tier}
                  role="img" aria-label={`${t.ltv_tier} LTV: ${fmt(t.entity_count)} entities, avg ${fmtCur(t.avg_ltv)}`}>
                  <div className="bar-label">{t.ltv_tier}</div>
                  <div className="bar-track">
                    <div className="bar-fill" style={{
                      width: (t.entity_count / maxLtv * 100) + '%',
                      background: ltvColor(t.ltv_tier),
                    }}>{fmt(t.entity_count)}</div>
                  </div>
                  <div style={{fontSize:'11px', color:'var(--text-muted)', width:'90px', textAlign:'right'}}>
                    avg {fmtCur(t.avg_ltv)}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Value Segments */}
          <div className="card">
            <div className="card-title">Value Segments (Churn \u00d7 LTV Combined)</div>
            <p style={{fontSize:'12px', color:'var(--text-muted)', marginBottom:'12px'}}>
              ML-derived action segments: who to protect, grow, nurture, or monitor
            </p>
            {(data.value_segments || []).map(s => (
              <div className="bar-chart-row" key={s.value_segment}
                role="img" aria-label={`${s.value_segment}: ${fmt(s.entity_count)} entities, avg LTV ${fmtCur(s.avg_ltv)}`}>
                <div className="bar-label">{s.value_segment}</div>
                <div className="bar-track">
                  <div className="bar-fill" style={{
                    width: (s.entity_count / maxSeg * 100) + '%',
                    background: segColor(s.value_segment),
                  }}>{fmt(s.entity_count)}</div>
                </div>
                <div style={{fontSize:'11px', color:'var(--text-muted)', width:'120px', textAlign:'right'}}>
                  avg LTV {fmtCur(s.avg_ltv)} | churn {(s.avg_churn_prob * 100).toFixed(0)}%
                </div>
              </div>
            ))}
          </div>

          {/* What Only CustomerLake Can Do — ML Predictions */}
          <div className="card" style={{marginTop:'16px'}}>
            <div className="card-title">What Only CustomerLake Can Do</div>
            <ul style={{listStyle:'none', fontSize:'13px', lineHeight:'2.2'}}>
              <li><span className="diff-badge">ENTITY</span> ML scores per identity-resolved entity, not per account record — one score per real person</li>
              <li><span className="diff-badge">CHURN</span> Cross-source churn signals (billing + usage + support) unified via identity resolution</li>
              <li><span className="diff-badge">PROTECT</span> Revenue-at-risk quantified per entity — know exactly who to save and what they're worth</li>
              <li><span className="diff-badge">LTV</span> Predicted lifetime value combines billing, transaction, and engagement data across all sources</li>
            </ul>
          </div>

          {/* Risk Matrix (Churn x LTV) */}
          <div className="card">
            <div className="card-title">Risk Matrix: Churn Tier \u00d7 LTV Tier</div>
            <p style={{fontSize:'12px', color:'var(--text-muted)', marginBottom:'12px'}}>
              Cross-source ML signals only possible with identity-resolved unified profiles
            </p>
            <div className="table-scroll">
              <table>
                <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Churn risk tier × LTV tier cross-analysis matrix</caption>
                <thead>
                  <tr>
                    <th>Churn Risk \u2193 / LTV \u2192</th>
                    {ltvTierOrder.map(lt => <th key={lt} style={{textAlign:'center'}}>{lt} LTV</th>)}
                  </tr>
                </thead>
                <tbody>
                  {churnTierOrder.map(ct => (
                    <tr key={ct}>
                      <td><span className={`badge ${tierBadge(ct)}`}>{ct}</span></td>
                      {ltvTierOrder.map(lt => {
                        const cell = getCell(ct, lt);
                        if (!cell) return <td key={lt} style={{textAlign:'center', color:'var(--text-muted)'}}>\u2014</td>;
                        const intensity = Math.max(0.08, cell.entity_count / maxMatrixCount * 0.5);
                        const bg = ct === 'CRITICAL' || ct === 'HIGH'
                          ? `rgba(248,113,113,${intensity})`
                          : `rgba(79,143,247,${intensity})`;
                        return (
                          <td key={lt} style={{textAlign:'center', background: bg, borderRadius:'4px'}}>
                            <div style={{fontWeight:600, fontSize:'15px'}}>{fmt(cell.entity_count)}</div>
                            <div style={{fontSize:'10px', color:'var(--text-muted)'}}>
                              {fmtCur(cell.total_revenue_at_risk)} at risk
                            </div>
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Entity-Level Scores Table */}
          <div className="card">
            <div className="card-title">Entity-Level ML Scores</div>
            <div className="search-bar">
              <input placeholder="Search entity ID..." value={searchQ}
                onChange={e => { setSearchQ(e.target.value); setScoresPage(0); }} />
              <select value={riskFilter} onChange={e => { setRiskFilter(e.target.value); setScoresPage(0); }}>
                <option value="">All Risk Tiers</option>
                <option value="CRITICAL">CRITICAL</option>
                <option value="HIGH">HIGH</option>
                <option value="MEDIUM">MEDIUM</option>
                <option value="LOW">LOW</option>
              </select>
              <select value={segFilter} onChange={e => { setSegFilter(e.target.value); setScoresPage(0); }}>
                <option value="">All Segments</option>
                <option value="Protect & Retain">Protect & Retain</option>
                <option value="Grow">Grow</option>
                <option value="Nurture">Nurture</option>
                <option value="Monitor">Monitor</option>
              </select>
            </div>
            {scoresError ? (
              <div className="error-card" role="alert" style={{margin:'16px 0'}}>
                <Icon d={icons.alertCircle} size={24} />
                <p style={{marginTop:'8px'}}>Failed to load entity scores</p>
                <div className="error-detail">{scoresError}</div>
                <button className="btn btn-primary" onClick={loadScores}>Retry</button>
              </div>
            ) : scores && scores.scores ? (
              <>
                <div style={{fontSize:'12px', color:'var(--text-muted)', marginBottom:'8px'}}>
                  {fmt(scores.total)} entities matched | Showing {scores.scores.length} | Page {scoresPage + 1}
                </div>
                <div className="table-scroll">
                  <table>
                    <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Entity-level churn, LTV, and value segment ML scores</caption>
                    <thead>
                      <tr>
                        <th>Entity ID</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Churn Prob</th>
                        <th>Risk Tier</th>
                        <th>Revenue at Risk</th>
                        <th>Predicted LTV</th>
                        <th>LTV Tier</th>
                        <th>Value Segment</th>
                      </tr>
                    </thead>
                    <tbody>
                      {scores.scores.map(s => (
                        <tr key={s.entity_id}>
                          <td style={{fontWeight:500, color:'var(--accent)'}}>{s.entity_id}</td>
                          <td>{s.entity_type}</td>
                          <td><span className={`badge ${statusBadge(s.lifecycle_status)}`}>{s.lifecycle_status}</span></td>
                          <td style={{color: s.ml_churn_probability > 0.7 ? 'var(--danger)' : s.ml_churn_probability > 0.4 ? 'var(--warning)' : 'var(--success)'}}>
                            {s.ml_churn_probability != null ? (s.ml_churn_probability * 100).toFixed(1) + '%' : '\u2014'}
                          </td>
                          <td><span className={`badge ${tierBadge(s.churn_risk_tier)}`}>{s.churn_risk_tier}</span></td>
                          <td>{fmtCur(s.revenue_at_risk)}</td>
                          <td>{fmtCur(s.predicted_ltv_12m)}</td>
                          <td><span className={`badge ${s.ltv_tier === 'High' ? 'badge-success' : s.ltv_tier === 'Medium' ? 'badge-info' : 'badge-warning'}`}>{s.ltv_tier || '\u2014'}</span></td>
                          <td style={{fontSize:'12px', fontWeight:500}}>{s.value_segment || '\u2014'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{display:'flex', gap:'8px', marginTop:'12px', justifyContent:'center'}}>
                  <button className="btn btn-ghost btn-sm" disabled={scoresPage === 0}
                    onClick={() => setScoresPage(p => Math.max(0, p - 1))}>Previous</button>
                  <button className="btn btn-ghost btn-sm"
                    disabled={scores.scores.length < 30}
                    onClick={() => setScoresPage(p => p + 1)}>Next</button>
                </div>
              </>
            ) : (
              <div className="loading" role="status" aria-live="polite">{scoresLoading ? 'Loading entity scores...' : 'No entity score data available'}</div>
            )}
          </div>
        </div>
      );
    }

    // ---- Incrementality Page (CMO-29/31/33) ----
    function IncrementalityPage() {

            api('/api/incrementality/suppress-insight').catch((e) => ({ _suppressError: e.message || 'Failed to load SUPPRESS insight' })),

            setSuppressData(null);
