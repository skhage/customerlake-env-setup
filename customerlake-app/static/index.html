<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1117">
  <title>CustomerLake — AI-Driven Customer Intelligence</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg-primary: #0f1117;
      --bg-secondary: #1a1d29;
      --bg-card: #1e2130;
      --bg-hover: #252840;
      --border: #2d3148;
      --text-primary: #e8eaf0;
      --text-secondary: #9498b0;
      --text-muted: #8b8fa8;
      --accent: #4f8ff7;
      --accent-hover: #3a7de8;
      --accent-light: rgba(79,143,247,0.12);
      --success: #34d399;
      --success-bg: rgba(52,211,153,0.12);
      --warning: #fbbf24;
      --warning-bg: rgba(251,191,36,0.12);
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.12);
      --info: #818cf8;
      --info-bg: rgba(129,140,248,0.12);
      --radius: 8px;
      --radius-lg: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }
    .app-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 240px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 20px 0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .sidebar-logo {
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .sidebar-logo h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sidebar-logo p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 14px;
      transition: all 0.15s;
      border-left: 3px solid transparent;
      background: none;
      border-right: none;
      border-top: none;
      border-bottom: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }
    .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-item.active {
      background: var(--accent-light);
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 500;
    }
    .nav-icon { font-size: 18px; width: 24px; text-align: center; }
    .nav-section {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      padding: 16px 20px 4px;
      margin-top: 4px;
    }
    .nav-section:first-child { margin-top: 0; padding-top: 12px; }
    .main-content { flex: 1; padding: 24px 32px; overflow-y: auto; max-height: 100vh; }
    .page-header { margin-bottom: 24px; }
    .page-header h2 { font-size: 22px; font-weight: 600; }
    .page-header p { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
    }
    .kpi-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-value { font-size: 28px; font-weight: 700; margin-top: 4px; }
    .kpi-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .search-bar input, .search-bar select {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }
    .search-bar input { flex: 1; }
    .search-bar input:focus, .search-bar select:focus { border-color: var(--accent); }
    .search-bar select { min-width: 140px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }
    tr:hover td { background: var(--bg-hover); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); }
    .badge-danger { background: var(--danger-bg); color: var(--danger); }
    .badge-info { background: var(--info-bg); color: var(--info); }
    .badge-neutral { background: var(--bg-hover); color: var(--text-secondary); }
    .btn {
      padding: 6px 14px;
      border-radius: var(--radius);
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); color: #000; }
    .btn-danger { background: var(--danger); color: #000; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
    .entity-link {
      color: var(--accent);
      cursor: pointer;
      font-weight: 500;
    }
    .entity-link:hover { text-decoration: underline; }
    .source-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      margin-right: 4px;
    }
    .source-TMF_PARTY { background: rgba(79,143,247,0.2); color: var(--accent); }
    .source-SALESFORCE { background: rgba(52,211,153,0.2); color: var(--success); }
    .source-ORACLE_ERP { background: rgba(251,191,36,0.2); color: var(--warning); }
    .confidence-bar {
      width: 60px;
      height: 6px;
      background: var(--bg-hover);
      border-radius: 3px;
      display: inline-block;
      vertical-align: middle;
      margin-left: 4px;
    }
    .confidence-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--success);
    }
    .detail-panel {
      position: fixed;
      right: 0;
      top: 0;
      width: 520px;
      height: 100vh;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 24px;
      z-index: 100;
      box-shadow: -4px 0 24px rgba(0,0,0,0.4);
    }
    .detail-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }
    .detail-section { margin-bottom: 20px; }
    .detail-section h3 {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .diff-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(79,143,247,0.15);
      color: var(--accent);
    }
    .journey-event:hover {
      background: var(--bg-hover);
      border-radius: var(--radius);
      margin-left: -4px;
      padding-left: 4px;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      color: var(--text-muted);
    }
    /* Skeleton shimmer — CMO-138: instant layout while data loads */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-hover) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: var(--radius);
    }
    .skeleton-kpi {
      height: 120px;
      min-width: 200px;
    }
    .skeleton-text {
      height: 14px;
      width: 60%;
      margin-bottom: 8px;
    }
    .skeleton-text.short { width: 40%; }
    .skeleton-text.long { width: 80%; }
    .skeleton-banner {
      height: 80px;
      width: 100%;
      margin-bottom: 16px;
    }
    .skeleton-table {
      height: 200px;
      width: 100%;
      margin-bottom: 16px;
    }
    .skeleton-section {
      margin-bottom: 24px;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
    .steward-actions {
      display: flex;
      gap: 6px;
    }
    .bar-chart-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .bar-label { width: 100px; font-size: 12px; color: var(--text-secondary); text-align: right; }
    .bar-track {
      flex: 1;
      height: 20px;
      background: var(--bg-hover);
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding-left: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      min-width: 30px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    /* Focus-visible for all interactive elements (UX-FIX-3) */
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
    .entity-link:focus-visible, .btn:focus-visible, .nav-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    /* Mobile hamburger toggle (UX-FIX-2) */
    .mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 110;
    }
    .mobile-header h1 {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hamburger-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      padding: 6px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hamburger-btn:hover { background: var(--bg-hover); }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
    }
    .sidebar-overlay.open { display: block; }
    /* Table scroll wrapper (UX-FIX-5) */
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* Error card (UX-FIX-5) */
    .error-card {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      border-radius: var(--radius-lg);
      padding: 24px;
      text-align: center;
    }
    .error-card p { color: var(--danger); margin-bottom: 12px; font-size: 14px; }
    .error-card .error-detail { color: var(--text-muted); font-size: 12px; margin-bottom: 16px; }
    @media (max-width: 768px) {
      .sidebar { display: none; position: fixed; z-index: 100; top: 0; left: 0; height: 100vh; }
      .sidebar.mobile-open { display: flex; }
      .mobile-header { display: flex; }
      .main-content { padding: 16px; max-height: none; }
      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
      .detail-panel { width: 100%; }
    }
    /* Simulation Environment Banner (CMO-82: synthetic data disclaimer) */
    .sim-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(251,191,36,0.10);
      border: 1px solid rgba(251,191,36,0.35);
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
    }
    .sim-banner strong { color: var(--warning); font-weight: 600; letter-spacing: 0.5px; }
    .sim-banner .sim-icon { flex-shrink: 0; color: var(--warning); }
    .sim-banner .sim-dismiss {
      margin-left: auto;
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      border-radius: 4px;
      font-size: 11px;
    }
    .sim-banner .sim-dismiss:hover { color: var(--text-primary); background: var(--bg-hover); }
    .sim-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 4px;
      vertical-align: middle;
    }
    .sim-badge--synthetic {
      background: rgba(251,191,36,0.15);
      color: var(--warning);
      border: 1px solid rgba(251,191,36,0.3);
    }
    .sim-badge--production {
      background: rgba(52,211,153,0.12);
      color: var(--success);
      border: 1px solid rgba(52,211,153,0.25);
    }
    /* Demo Walkthrough Styles */
    .demo-step-bar {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 12px 0;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .demo-step-bar-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: var(--radius);
      transition: all 0.15s;
      white-space: nowrap;
    }
    .demo-step-bar-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .demo-step-bar-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .demo-step-bar-item.completed-step { color: var(--success); }
    .demo-step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      background: var(--bg-hover);
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .demo-step-bar-item.active .demo-step-num { background: var(--accent); color: #fff; }
    .demo-step-bar-item.completed-step .demo-step-num { background: var(--success); color: #fff; }
    .demo-step-connector {
      width: 24px;
      height: 2px;
      background: var(--border);
      flex-shrink: 0;
    }
    .demo-step-connector.completed-conn { background: var(--success); }
    .demo-landing-hero {
      text-align: center;
      padding: 40px 24px 32px;
      margin-bottom: 24px;
    }
    .demo-landing-hero h2 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .demo-landing-hero p { color: var(--text-secondary); font-size: 14px; max-width: 600px; margin: 0 auto; }
    .demo-step-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.15s;
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 16px;
      align-items: start;
    }
    .demo-step-card:hover { border-color: var(--accent); background: rgba(79,143,247,0.04); }
    .demo-step-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .demo-step-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .demo-step-card .demo-duration { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .demo-step-card .demo-talk { font-size: 13px; color: var(--text-secondary); margin-top: 8px; font-style: italic; line-height: 1.5; }
    .demo-step-card .demo-metrics { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
    .demo-step-card .demo-metric {
      background: var(--bg-hover);
      border-radius: var(--radius);
      padding: 8px 12px;
      min-width: 100px;
    }
    .demo-step-card .demo-metric-val { font-size: 18px; font-weight: 700; }
    .demo-step-card .demo-metric-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .demo-pages { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .demo-page-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: var(--radius);
      background: var(--accent-light);
      color: var(--accent);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      font-family: inherit;
    }
    .demo-page-link:hover { background: var(--accent); color: #fff; }
    .demo-start-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 32px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--accent), #818cf8);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      margin-top: 24px;
    }
    .demo-start-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    @media (max-width: 768px) {
      .demo-step-card { grid-template-columns: 1fr; }
      .demo-step-icon { width: 40px; height: 40px; font-size: 18px; }
      .demo-step-bar { overflow-x: auto; }
    }
    /* --- Board Presentation Mode (APP-BOARD-PRESENTATION) --- */
    .presentation-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
    }
    .presentation-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .presentation-topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .presentation-progress {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .presentation-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--bg-hover);
      transition: all 0.2s;
    }
    .presentation-dot.active { background: var(--accent); transform: scale(1.3); }
    .presentation-dot.done { background: var(--success); }
    .presentation-timer {
      font-size: 13px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .presentation-body {
      flex: 1;
      overflow-y: auto;
      padding: 40px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .presentation-slide {
      max-width: 960px;
      width: 100%;
    }
    .presentation-slide-number {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .presentation-slide-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .presentation-nav-arrows {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .presentation-nav-btn {
      padding: 6px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .presentation-nav-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .presentation-nav-btn:disabled { opacity: 0.3; cursor: default; }
    .presentation-notes-bar {

    // ---- Focus Trap Hook (UX-FIX-4) ----
    function useFocusTrap(isOpen) {
      const ref = useRef(null);
      useEffect(() => {
        if (!isOpen || !ref.current) return;
        const panel = ref.current;
        const focusable = panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if (focusable.length) focusable[0].focus();
        const trap = (e) => {
          if (e.key !== 'Tab' || !focusable.length) return;
          const first = focusable[0], last = focusable[focusable.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        };
        panel.addEventListener('keydown', trap);
        return () => panel.removeEventListener('keydown', trap);
      }, [isOpen]);
      return ref;
    }

              <span style={{color:'var(--text-secondary)'}}>Incrementality KPIs reflect <strong style={{color:'var(--text-primary)'}}>{sq.measurable_count}</strong> of {sq.total_segments} segments ({sq.measurable_pct}% MEASURABLE). {sq.low_sample_count} excluded — holdout {'<'}30.</span>
            </div>
          )}
          {/* PLATFORM METRICS ROW (supporting detail — not the headline) */}
          <div className="kpi-grid">
            <div className="kpi-card">
              <div className="kpi-label">Resolved Entities</div>
              <div className="kpi-value">{fmt(identity.total_entities)}</div>
              <div className="kpi-sub">{fmt(identity.active_individuals)} individuals · {fmt(identity.active_orgs)} organizations</div>
            </div>
            <div className="kpi-card">
              <div className="kpi-label">Cross-References</div>
              <div className="kpi-value">{fmt(cross_references.total_xrefs)}</div>
              <div className="kpi-sub">{cross_references.source_systems} source systems · {fmtPct(cross_references.avg_confidence ? cross_references.avg_confidence * 100 : null)} avg confidence</div>
            </div>
            <div className="kpi-card">
              <div className="kpi-label">Unified Accounts</div>
              <div className="kpi-value">{fmt(accounts.total_accounts)}</div>
              <div className="kpi-sub">{fmt(accounts.unique_entities)} unique entities · {accounts.segment_count} segments</div>
            </div>
          </div>
          <div className="grid-2">
            <div className="card">
              <div className="card-title">Identity Resolution Quality</div>
              <div className="bar-chart-row" role="img" aria-label={`High confidence cross-references: ${fmt(cross_references.high_confidence_count)}`}>
                <div className="bar-label">High Conf</div>
                <div className="bar-track"><div className="bar-fill" style={{width: `${(cross_references.high_confidence_count/cross_references.total_xrefs*100).toFixed(0)}%`, background: 'var(--success)'}}>{fmt(cross_references.high_confidence_count)}</div></div>
              </div>
              <div className="bar-chart-row" role="img" aria-label={`Merged entities: ${fmt(identity.merged_count)}`}>
                <div className="bar-label">Merged</div>
                <div className="bar-track"><div className="bar-fill" style={{width: `${(identity.merged_count/identity.total_entities*100*20).toFixed(0)}%`, background: 'var(--info)'}}>{fmt(identity.merged_count)}</div></div>
              </div>
              <div className="bar-chart-row" role="img" aria-label={`Retired entities: ${fmt(identity.retired_count)}`}>
                <div className="bar-label">Retired</div>
                <div className="bar-track"><div className="bar-fill" style={{width: `${(identity.retired_count/identity.total_entities*100).toFixed(0)}%`, background: 'var(--text-muted)'}}>{fmt(identity.retired_count)}</div></div>
              </div>
            </div>
            <div className="card">
              <div className="card-title">What Only CustomerLake Can Do</div>
              <ul style={{listStyle: 'none', fontSize: '13px', lineHeight: '2'}}>
                <li><span className="diff-badge">UNIQUE</span> Identity-resolved profiles across {cross_references.source_systems} source systems</li>
                <li><span className="diff-badge">UNIQUE</span> Cross-role deduplicated audiences ({fmt(marketing.reachable_entities)} entities)</li>
                <li><span className="diff-badge">UNIQUE</span> Closed-loop campaign attribution tied to unified entities</li>
                <li><span className="diff-badge">UNIQUE</span> Sub-second steward adjudication via Lakebase synced tables</li>
              </ul>
            </div>
          </div>
        </div>
      );
    }

    // ---- Profile Search Page ----
    function ProfileSearchPage() {
      const [profiles, setProfiles] = useState([]);
      const [total, setTotal] = useState(0);
      const [loading, setLoading] = useState(false);
      const [searchError, setSearchError] = useState(null);
      const [query, setQuery] = useState('');
      const [segment, setSegment] = useState('');
      const [status, setStatus] = useState('');
      const [filters, setFilters] = useState({segments: [], statuses: []});
      const [detail, setDetail] = useState(null);
      const [detailData, setDetailData] = useState(null);
      const [journeyData, setJourneyData] = useState(null);

      useEffect(() => { api('/api/profiles/filters').then(setFilters).catch(() => null); }, []);

      // UX-FIX-8: Escape key closes detail panel
      useEffect(() => {
        const handler = (e) => { if (e.key === 'Escape' && detail) { setDetail(null); setDetailData(null); setJourneyData(null); } };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
      }, [detail]);

      const search = useCallback(() => {
        setLoading(true);
        setSearchError(null);
        const params = new URLSearchParams();
        if (query) params.set('q', query);
        if (segment) params.set('segment', segment);
        if (status) params.set('status', status);
        api(`/api/profiles/search?${params}`).then(d => {
          setProfiles(d.profiles || []);
          setTotal(d.total || 0);
        }).catch(e => setSearchError(e.message || 'Failed to search profiles')).finally(() => setLoading(false));
      }, [query, segment, status]);

      useEffect(() => { search(); }, []);

      const openDetail = (entityId) => {
        setDetail(entityId);
        setJourneyData(null);
        api(`/api/profiles/${entityId}`).then(setDetailData);
        api(`/api/profiles/${entityId}/journey`).then(setJourneyData).catch(() => null);
      };

      return (
        <div>
          <div className="page-header">
            <h2><Icon d={icons.userSearch} size={22} /> Profile Search</h2>
            <p>Search identity-resolved 360° customer profiles across all source systems</p>
          </div>
          <div className="search-bar">
            <input placeholder="Search by name, entity ID, or account number..." value={query} onChange={e => setQuery(e.target.value)} onKeyDown={e => e.key === 'Enter' && search()} />
            <select value={segment} onChange={e => setSegment(e.target.value)}>
              <option value="">All Segments</option>
              {filters.segments.map(s => <option key={s.segment} value={s.segment}>{s.segment} ({s.count})</option>)}
            </select>
            <select value={status} onChange={e => setStatus(e.target.value)}>
              <option value="">All Statuses</option>
              {filters.statuses.map(s => <option key={s.lifecycle_status} value={s.lifecycle_status}>{s.lifecycle_status} ({s.count})</option>)}
            </select>
            <button className="btn btn-primary" onClick={search}>Search</button>
          </div>
          {searchError && <ErrorCard message={searchError} onRetry={search} />}
          <div className="card">
            <div style={{display:'flex', justifyContent:'space-between', marginBottom: '8px'}}>
              <span style={{fontSize:'13px', color:'var(--text-muted)'}}>{fmt(total)} profiles found</span>
            </div>
            {loading ? <div className="loading" role="status" aria-live="polite">Searching...</div> : (
              <div className="table-scroll">
              <table>
                <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Customer profile search results</caption>
                <thead><tr>
                  <th>Entity ID</th><th>Name</th><th>Lifecycle</th><th>Segment</th>
                  <th>Sources</th><th>Revenue</th><th>Churn Risk</th><th>Xrefs</th>
                </tr></thead>
                <tbody>
                  {profiles.map(p => (
                    <tr key={p.entity_id}>
                      <td><span className="entity-link" tabIndex={0} role="button" onClick={() => openDetail(p.entity_id)} onKeyDown={e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), openDetail(p.entity_id))}>{p.entity_id}</span></td>
                      <td>{p.name}</td>
                      <td><span className={`badge ${statusBadge(p.lifecycle_status)}`}>{p.lifecycle_status}</span></td>
                      <td>{p.customer_segment}</td>
                      <td>
                        <span>{p.source_count || 0} sources</span>
                      </td>
                      <td>{fmtCur(p.total_billed_amount)}</td>
                      <td>
                        {p.churn_risk_score != null && <>
                          <span className={`badge ${p.churn_risk_score > 0.7 ? 'badge-danger' : p.churn_risk_score > 0.4 ? 'badge-warning' : 'badge-success'}`} style={{marginRight:'4px'}}>{p.churn_risk_score > 0.7 ? 'HIGH' : p.churn_risk_score > 0.4 ? 'MED' : 'LOW'}</span>
                          <span style={{fontSize:'12px', color:'var(--text-secondary)'}}>{(p.churn_risk_score * 100).toFixed(0)}%</span>
                        </>}
                      </td>
                      <td>{p.xref_count || 0}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              </div>
            )}
          </div>

          {detail && detailData && (
            <div className="detail-panel" role="dialog" aria-label="Customer profile detail" ref={useFocusTrap(!!detail)}>
              <button className="detail-close" aria-label="Close detail panel" onClick={() => {setDetail(null); setDetailData(null); setJourneyData(null);}}><Icon d={icons.x} size={16} /></button>
              <h2 style={{marginBottom: '4px'}}><Icon d={icons.userSearch} size={22} /> Entity {detail}</h2>
              {detailData.entity && (
                <div style={{marginBottom: '16px'}}>
                  <span className={`badge ${statusBadge(detailData.entity.status)}`}>{detailData.entity.status}</span>
                  <span style={{marginLeft:'8px', color:'var(--text-muted)', fontSize:'12px'}}>{detailData.entity.entity_type}</span>
                </div>
              )}
              <div className="detail-section">
                <h3>Linked Accounts ({detailData.accounts?.length || 0})</h3>
                {detailData.accounts?.map((a, i) => (
                  <div key={i} style={{padding:'8px', borderBottom:'1px solid var(--border)', fontSize:'13px'}}>
                    <span className={`source-badge source-${a.source_instance}`}>{a.source_instance}</span>
                    {a.account_name} — <span className={`badge ${statusBadge(a.account_status)}`}>{a.account_status}</span>
                    {a.mrr && <span style={{marginLeft:'8px', color:'var(--success)'}}>{fmtCur(a.mrr)} MRR</span>}
                  </div>
                ))}
              </div>
              <div className="detail-section">
                <h3>Identity Graph ({detailData.identity_graph?.length || 0} cross-refs)</h3>
                {detailData.identity_graph?.map((x, i) => (
                  <div key={i} style={{padding:'6px 0', fontSize:'12px', display:'flex', alignItems:'center', gap:'8px'}}>
                    <span className={`source-badge source-${x.source_instance}`}>{x.source_instance}</span>
                    <span style={{color:'var(--text-secondary)'}}>{x.object_type}:{x.source_record_id}</span>
                    <span className="badge badge-neutral">{x.match_rule}</span>
                    <div className="confidence-bar" role="meter" aria-label={`Confidence: ${(x.confidence*100).toFixed(0)}%`} aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(x.confidence*100)}><div className="confidence-fill" style={{width: `${(x.confidence*100)}%`, background: x.confidence >= 0.8 ? 'var(--success)' : x.confidence >= 0.5 ? 'var(--warning)' : 'var(--danger)'}}></div></div>
                    <span style={{fontSize:'11px', color:'var(--text-muted)'}}>{(x.confidence*100).toFixed(0)}% {x.confidence >= 0.8 ? '(high)' : x.confidence >= 0.5 ? '(med)' : '(low)'}</span>
                  </div>
                ))}
              </div>
              {detailData.audiences?.length > 0 && (
                <div className="detail-section">
                  <h3>Audience Memberships ({detailData.audiences.length})</h3>
                  {detailData.audiences.slice(0,8).map((a, i) => (
                    <div key={i} style={{padding:'4px 0', fontSize:'12px'}}>
                      <span className="badge badge-info">{a.purpose}</span> {a.audience_name}
                      <span style={{color:'var(--text-muted)', marginLeft:'6px'}}>{a.channel_type}</span>
                    </div>
                  ))}
                </div>
              )}
              {detailData.attributions?.length > 0 && (
                <div className="detail-section">
                  <h3>Campaign Attributions ({detailData.attributions.length})</h3>
                  {detailData.attributions.map((a, i) => (
                    <div key={i} style={{padding:'6px 0', fontSize:'12px', borderBottom:'1px solid var(--border)'}}>
                      <div>{a.campaign_name} — <span className={`badge ${a.purpose === 'retention' ? 'badge-success' : a.purpose === 'acquisition' ? 'badge-info' : a.purpose === 'winback' ? 'badge-warning' : a.purpose === 'upsell' ? 'badge-info' : 'badge-neutral'}`}>{a.purpose}</span></div>
                      <div style={{color:'var(--text-muted)'}}>{a.channel_type} · {fmtCur(a.attributed_amount)} attributed · {a.conversion_date}</div>
                    </div>
                  ))}
                </div>
              )}
              {/* V6: ML Predictions Section (CMO-24) */}
              {detailData.ml_predictions && (detailData.ml_predictions.churn || detailData.ml_predictions.ltv) && (
                <div className="detail-section">
                  <h3><Icon d={icons.sparkles} size={14} /> ML Predictions</h3>
                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px'}}>
                    {detailData.ml_predictions.churn && (
                      <div style={{background:'var(--bg-card)', padding:'10px', borderRadius:'var(--radius)', border:'1px solid var(--border)'}}>
                        <div style={{fontSize:'10px', color:'var(--text-muted)', textTransform:'uppercase'}}>Churn Risk</div>
                        <div style={{fontSize:'20px', fontWeight:700, color: detailData.ml_predictions.churn.ml_churn_probability > 0.7 ? 'var(--danger)' : detailData.ml_predictions.churn.ml_churn_probability > 0.4 ? 'var(--warning)' : 'var(--success)'}}>
                          {(detailData.ml_predictions.churn.ml_churn_probability * 100).toFixed(1)}%
                        </div>
                        <span className={`badge ${detailData.ml_predictions.churn.churn_risk_tier === 'CRITICAL' ? 'badge-danger' : detailData.ml_predictions.churn.churn_risk_tier === 'HIGH' ? 'badge-warning' : detailData.ml_predictions.churn.churn_risk_tier === 'LOW' ? 'badge-success' : 'badge-info'}`}>
                          {detailData.ml_predictions.churn.churn_risk_tier}
                        </span>
                        <div style={{fontSize:'10px', color:'var(--text-muted)', marginTop:'4px'}}>
                          {fmtCur(detailData.ml_predictions.churn.revenue_at_risk)} at risk
                        </div>
                      </div>
                    )}
                    {detailData.ml_predictions.ltv && (
                      <div style={{background:'var(--bg-card)', padding:'10px', borderRadius:'var(--radius)', border:'1px solid var(--border)'}}>
                        <div style={{fontSize:'10px', color:'var(--text-muted)', textTransform:'uppercase'}}>Predicted LTV (12m)</div>
                        <div style={{fontSize:'20px', fontWeight:700, color:'var(--success)'}}>
                          {fmtCur(detailData.ml_predictions.ltv.predicted_ltv_12m)}
                        </div>
                        <span className={`badge ${detailData.ml_predictions.ltv.ltv_tier === 'High' ? 'badge-success' : detailData.ml_predictions.ltv.ltv_tier === 'Medium' ? 'badge-info' : 'badge-warning'}`}>
                          {detailData.ml_predictions.ltv.ltv_tier} LTV
                        </span>
                        <div style={{fontSize:'10px', color:'var(--text-muted)', marginTop:'4px'}}>
                          MRR: {fmtCur(detailData.ml_predictions.ltv.total_mrr)}
                        </div>
                      </div>
                    )}
                  </div>
                  {detailData.ml_predictions.propensity && (
                    <div style={{marginTop:'8px', padding:'8px 10px', background:'var(--accent-light)', borderRadius:'var(--radius)', fontSize:'12px'}}>
                      <strong>Value Segment:</strong> {detailData.ml_predictions.propensity.value_segment}
                      <span style={{color:'var(--text-muted)', marginLeft:'8px'}}>Model: {detailData.ml_predictions.propensity.model_version}</span>
                    </div>
                  )}
                </div>
              )}
              {/* V10: Customer Journey Timeline */}
              {journeyData && journeyData.events && journeyData.events.length > 0 && (
                <div className="detail-section">
                  <h3 style={{display:'flex', alignItems:'center', gap:'6px'}}>
                    <Icon d={icons.trendingUp} size={14} /> Customer Journey ({journeyData.total_events} events)
                  </h3>
                  <div style={{display:'flex', gap:'6px', marginBottom:'10px', flexWrap:'wrap'}}>
                    {Object.entries(journeyData.event_type_counts || {}).map(([type, count]) => (
                      <span key={type} className="badge" style={{
                        background: type === 'digital' ? 'var(--accent-light)' :
                                    type === 'activation' ? 'var(--success-bg)' :
                                    type === 'identity' ? 'var(--info-bg)' :
                                    type === 'campaign' ? 'var(--warning-bg)' :
                                    type === 'consent' ? 'rgba(107,111,136,0.15)' : 'var(--bg-hover)',
                        color: type === 'digital' ? 'var(--accent)' :
                               type === 'activation' ? 'var(--success)' :
                               type === 'identity' ? 'var(--info)' :
                               type === 'campaign' ? 'var(--warning)' :
                               type === 'consent' ? 'var(--text-secondary)' : 'var(--text-secondary)',
                      }}>{type} ({count})</span>
                    ))}
                  </div>
                  <div style={{position:'relative', paddingLeft:'20px', borderLeft:'2px solid var(--border)'}}>
                    {journeyData.events.slice(0, 20).map((ev, i) => {
                      const typeColor = ev.event_type === 'digital' ? 'var(--accent)' :
                                        ev.event_type === 'activation' ? 'var(--success)' :
                                        ev.event_type === 'identity' ? 'var(--info)' :
                                        ev.event_type === 'campaign' ? 'var(--warning)' :
                                        ev.event_type === 'consent' ? 'var(--text-muted)' : 'var(--text-secondary)';
                      const ts = ev.event_timestamp ? new Date(ev.event_timestamp).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '';
                      return (
                        <div key={i} style={{position:'relative', paddingBottom:'12px', fontSize:'12px'}}>
                          <div style={{position:'absolute', left:'-25px', top:'2px', width:'10px', height:'10px', borderRadius:'50%', background: typeColor, border:'2px solid var(--bg-secondary)'}} />
                          <div style={{display:'flex', alignItems:'center', gap:'6px', flexWrap:'wrap'}}>
                            <span style={{fontSize:'10px', fontWeight:600, textTransform:'uppercase', color: typeColor}}>{ev.event_type}</span>
                            {ev.source_system && <span className={`source-badge source-${ev.source_system}`} style={{fontSize:'10px'}}>{ev.source_system}</span>}
                            <span style={{color:'var(--text-muted)', fontSize:'10px', marginLeft:'auto'}}>{ts}</span>
                          </div>
                          <div style={{color:'var(--text-primary)', marginTop:'2px', fontWeight:500}}>
                            {ev.event_category}{ev.event_detail ? ` \u2014 ${ev.event_detail}` : ''}
                          </div>
                          <div style={{color:'var(--text-muted)', marginTop:'1px', display:'flex', gap:'8px', flexWrap:'wrap'}}>
                            {ev.source_channel && <span>{ev.source_channel}</span>}
                            {ev.delivery_status && <span className={`badge ${ev.delivery_status === 'delivered' ? 'badge-success' : ev.delivery_status === 'bounced' ? 'badge-danger' : 'badge-neutral'}`}>{ev.delivery_status}</span>}
                            {ev.conversion_outcome && <span className="badge badge-success">Converted</span>}
                            {ev.attributed_revenue && Number(ev.attributed_revenue) > 0 && <span style={{color:'var(--success)'}}>{fmtCur(ev.attributed_revenue)}</span>}
                            {ev.device_type && <span>{ev.device_type}</span>}
                            {ev.duration_seconds && <span>{ev.duration_seconds}s</span>}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  <div style={{fontSize:'10px', color:'var(--text-muted)', marginTop:'8px', padding:'6px 8px', background:'var(--accent-light)', borderRadius:'var(--radius)'}}>
                    <span className="diff-badge">UNIQUE</span> Cross-source journey across {Object.keys(journeyData.event_type_counts || {}).length} data domains \u2014 identity-resolved to a single entity
                  </div>
                </div>
              )}
              {journeyData && (!journeyData.events || journeyData.events.length === 0) && (
                <div className="detail-section">
                  <h3>Customer Journey</h3>
                  <div style={{fontSize:'12px', color:'var(--text-muted)'}}>No journey events found for this entity.</div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ---- Audience Builder Page ----
    function AudienceBuilderPage() {
      const [data, setData] = useState(null);
      const [summary, setSummary] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const load = useCallback(() => {
        setLoading(true);
        setError(null);
        Promise.all([
          api('/api/audiences'),
          api('/api/audiences/summary'),
        ]).then(([d, s]) => { setData(d); setSummary(s); }).catch(e => setError(e.message || 'Failed to load audiences')).finally(() => setLoading(false));
      }, []);

      useEffect(() => { load(); }, [load]);

      if (loading) return <div className="loading" role="status" aria-live="polite">Loading audiences...</div>;
      if (error) return <ErrorCard message={error} onRetry={load} />;

      const purposes = summary?.by_purpose || [];
      const channels = summary?.by_channel || [];
      const maxReach = Math.max(...channels.map(c => c.reach || 0), 1);

      return (
        <div>
          <div className="page-header">
            <h2><Icon d={icons.target} size={22} /> Audience Builder</h2>
            <p>Cross-channel, identity-deduplicated audience targeting</p>
          </div>
          <div className="kpi-grid">
            {purposes.map(p => (
              <div className="kpi-card" key={p.purpose}>
                <div className="kpi-label">{p.purpose}</div>
                <div className="kpi-value">{fmt(p.unique_entities)}</div>
                <div className="kpi-sub">{p.channel_count} channels · {fmt(p.total_memberships)} touchpoints</div>
              </div>
            ))}
          </div>
          <div className="grid-2">
            <div className="card">
              <div className="card-title">Channel Reach</div>
              {channels.map(c => (
                <div className="bar-chart-row" key={c.channel_type} role="img" aria-label={`${c.channel_type}: ${fmt(c.reach)} reach`}>
                  <div className="bar-label">{c.channel_type}</div>
                  <div className="bar-track">
                    <div className="bar-fill" style={{width: `${(c.reach/maxReach*100).toFixed(0)}%`, background: 'var(--accent)'}}>{fmt(c.reach)}</div>
                  </div>
                </div>
              ))}
            </div>
            <div className="card">
              <div className="card-title">CustomerLake Advantage</div>
              <ul style={{listStyle:'none', fontSize:'13px', lineHeight:'2.2'}}>
                <li><span className="diff-badge">DEDUP</span> Cross-role deduplication prevents contacting the same person twice</li>
                <li><span className="diff-badge">RESOLVE</span> Entity-level targeting ensures campaigns reach real people, not records</li>
                <li><span className="diff-badge">MULTI-CH</span> {channels.length} channels orchestrated from a single audience definition</li>
                <li><span className="diff-badge">CONSENT</span> Consent-aware: audiences respect opt-out preferences</li>
              </ul>
            </div>
          </div>
          <div className="card">
            <div className="card-title">Audience Segments</div>
            <div className="table-scroll">
            <table>
              <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Audience segments with entity-level deduplication</caption>
              <thead><tr><th>Audience</th><th>Purpose</th><th>Channel</th><th>Members</th><th>Unique Entities</th><th>Orgs</th></tr></thead>
              <tbody>
                {(data?.audiences || []).slice(0, 40).map((a, i) => (
                  <tr key={i}>
                    <td style={{fontWeight:500}}>{a.audience_name}</td>
                    <td><span className="badge badge-info">{a.purpose}</span></td>
                    <td>{a.channel_type}</td>
                    <td>{fmt(a.total_members)}</td>

    // ---- Identity Steward Page ----
    function IdentityStewardPage() {
      const [inbox, setInbox] = useState({items: [], counts: {}});
      const [loading, setLoading] = useState(true);
      const [filter, setFilter] = useState('pending');
      const [entityDetail, setEntityDetail] = useState(null);
      const [actionError, setActionError] = useState(null);
      const [revImpact, setRevImpact] = useState(null);
      const [revLoading, setRevLoading] = useState(true);
      const [revError, setRevError] = useState(null);

      const loadInbox = useCallback(() => {
        setLoading(true);
        api(`/api/steward/inbox?status_filter=${filter}`)
          .then(setInbox)
          .finally(() => setLoading(false));
      }, [filter]);

      useEffect(() => { loadInbox(); }, [loadInbox]);

      // APP-IDENTITY-REV: Load revenue impact data
      useEffect(() => {
        setRevLoading(true);
        setRevError(null);
        api('/api/steward/revenue-impact')
          .then(setRevImpact)
          .catch(err => { setRevImpact(null); setRevError(err.message || 'Failed to load revenue impact data'); })
          .finally(() => setRevLoading(false));
      }, []);

      // V7-UX-FIX-2: Escape-to-close for entity detail panel
      useEffect(() => {
        const handler = (e) => { if (e.key === 'Escape' && entityDetail) setEntityDetail(null); };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
      }, [entityDetail]);

      const handleAction = async (decisionId, action) => {
        try {
          await apiPost('/api/steward/adjudicate', {
            decision_id: decisionId,
            action: action,
            steward_notes: `${action} via CustomerLake Steward UI`,
            steward_id: 'demo_steward',
          });
          loadInbox();
        } catch (err) {
          console.error('Steward action failed:', err);
          setActionError(err.message);
          setTimeout(() => setActionError(null), 5000);
        }
      };

      const openEntity = (entityId) => {
        api(`/api/steward/entity/${entityId}`).then(setEntityDetail);
      };

      const counts = inbox.counts || {};

      return (
        <div>
          <div className="page-header">
            <h2><Icon d={icons.gitMerge} size={22} /> Identity Steward</h2>
            <p>Revenue-aware identity resolution: adjudication, conflict triage, and marketing impact powered by Lakebase</p>
          </div>
          {actionError && (
            <div role="alert" style={{background:'var(--danger-bg)', border:'1px solid var(--danger)', borderRadius:'var(--radius-lg)', padding:'16px 24px', marginBottom:'16px', display:'flex', alignItems:'center', justifyContent:'space-between', fontSize:'13px'}}>
              <span style={{color:'var(--danger)', fontWeight:500}}>Action failed: {actionError}</span>
              <button className="btn btn-ghost btn-sm" onClick={() => setActionError(null)} aria-label="Dismiss error" style={{color:'var(--danger)', padding:'4px 8px'}}><Icon d={icons.x} size={14} /></button>
            </div>
          )}

          {entityDetail && (

            </div>

          setData(pred);
          setMatrix(mat);
          setLoading(false);
        }).catch(e => { setError(e.message); setLoading(false); });

        if (riskFilter) params.set('risk_tier', riskFilter);

          .catch(e => { setScoresError(e.message); setScoresLoading(false); });
      }, [searchQ, riskFilter, segFilter, scoresPage]);

      useEffect(() => { loadScores(); }, [loadScores]);

          api('/api/dark-audience/kpis'),
          api('/api/dark-audience/summary'),

                   <div className="kpi-sub">Any CVR above this is profitable (honest CAC)</div>
                 </div>
                 <div>
                   <div className="kpi-label">Dark Addressable Entities</div>
                   <div style={{fontSize:24, fontWeight:700, color:'var(--info)'}}>{fmt(honestRev.headline.dark_addressable)}</div>
                   <div className="kpi-sub">Never marketed to — only CustomerLake can find them</div>
                 </div>
                 <div>
                   <div className="kpi-label">Honest CAC</div>

              <div className="kpi-sub" style={{fontSize:10, marginTop:2}}>Calibrated 12-month LTV for dark addressable</div>
            </div>
            <div className="kpi-card" style={{borderLeft:'3px solid var(--warning)'}}>
              <div className="kpi-label">Opportunity Score</div>

          {/* DIFFERENTIATOR */}

          </div>

          {/* PRIORITY BREAKDOWN */}
          <div className="card">
            <div className="card-title"><Icon d={icons.target} size={16} /> Priority Breakdown</div>

              <table>

                  <tr>
                    <th>Priority Tier</th>
                    <th style={{textAlign:'right'}}>Total Entities</th>
                    <th style={{textAlign:'right'}}>Dark Addressable</th>
                    <th style={{textAlign:'right'}}>Predicted LTV</th>
                    <th style={{textAlign:'right'}}>Opportunity</th>
                    <th style={{textAlign:'right'}}>Avg Churn Risk</th>
                  </tr>
                </thead>
                <tbody>
                  {prio.map((r, i) => (
                    <tr key={i}>
                      <td><span style={{color: prioColor(r.dark_audience_priority), fontWeight:600}}>{prioLabel(r.dark_audience_priority)}</span></td>
                      <td style={{textAlign:'right'}}>{fmt(r.total)}</td>
                      <td style={{textAlign:'right'}}>
                        <span style={{color:'var(--info)', fontWeight:600}}>{fmt(r.dark_addressable)}</span>
                      </td>
                      <td style={{textAlign:'right'}}>{fmtB(r.total_ltv)}</td>
                      <td style={{textAlign:'right'}}>{fmtB(r.total_opportunity)}</td>
                      <td style={{textAlign:'right'}}>
                        <span className={r.avg_churn > 0.5 ? 'badge badge-danger' : r.avg_churn > 0.3 ? 'badge badge-warning' : 'badge badge-success'}>
                          {(r.avg_churn * 100).toFixed(1)}%
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* ACTION SEGMENTS */}
          <div className="card">
            <div className="card-title"><Icon d={icons.sparkles} size={16} /> Action Segments \u2014 Why They\u2019re Dark & What To Do</div>
            <div className="table-scroll">
              <table>
                <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Dark audience action segments with reason and recovery potential</caption>
                <thead>
                  <tr>
                    <th>Reason</th>
                    <th>Type</th>
                    <th>Action</th>
                    <th style={{textAlign:'right'}}>Entities</th>
                    <th style={{textAlign:'right'}}>Revenue at Stake</th>
                    <th style={{textAlign:'right'}}>Recoverable</th>
                    <th style={{textAlign:'right'}}>Reachable</th>
                  </tr>
                </thead>
                <tbody>
                  {segs.map((s, i) => (
                    <tr key={i}>
                      <td style={{fontSize:12}}>{reasonLabel(s.dark_reason)}</td>
                      <td><span className="badge badge-info">{s.entity_type}</span></td>
                      <td style={{fontSize:12, maxWidth:200, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                        {s.recommended_action}
                      </td>
                      <td style={{textAlign:'right', fontWeight:600}}>{fmt(s.entity_count)}</td>
                      <td style={{textAlign:'right'}}>{fmtCur(s.revenue_at_stake)}</td>
                      <td style={{textAlign:'right', color:'var(--success)'}}>{fmtCur(s.recoverable_revenue)}</td>
                      <td style={{textAlign:'right'}}>{fmt(s.multi_channel_reachable + (s.email_only_reachable || 0) + (s.phone_only_reachable || 0))}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* ENTITY LIST */}
          <div className="card">
            <div className="card-title" style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:8}}>
              <span><Icon d={icons.userSearch} size={16} /> Dark Addressable Entities ({fmt(entTotal)} total)</span>
              <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
                <input
                  type="text"
                  placeholder="Search by name or ID..."
                  aria-label="Search dark audience entities by name or ID"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter') {
                      setEntPage(0);
                      loadEntities(0, filter, search, addressableOnly);
                    }

                  style={{padding:'6px 10px', background:'var(--bg-secondary)', border:'1px solid var(--border)', borderRadius:'var(--radius)', color:'var(--text-primary)', fontSize:13, width:180}}
                />
                <select
                  value={filter}
                  aria-label="Filter by priority tier"
                  onChange={(e) => { setFilter(e.target.value); setEntPage(0); loadEntities(0, e.target.value, search, addressableOnly); }}
                  style={{padding:'6px 10px', background:'var(--bg-secondary)', border:'1px solid var(--border)', borderRadius:'var(--radius)', color:'var(--text-primary)', fontSize:13}}
                >
                  <option value="">All Priorities</option>
                  <option value="P0_HIGH_LTV_AT_RISK">P0: High LTV at Risk</option>
                  <option value="P1_HIGH_LTV_STABLE">P1: High LTV Stable</option>
                  <option value="P2_MEDIUM_LTV">P2: Medium LTV</option>
                  <option value="P3_LOW_LTV">P3: Low LTV</option>
                </select>
                <label style={{display:'flex', alignItems:'center', gap:4, fontSize:12, color:'var(--text-secondary)', cursor:'pointer'}}>
                  <input
                    type="checkbox"
                    checked={addressableOnly}
                    onChange={(e) => { setAddressableOnly(e.target.checked); setEntPage(0); loadEntities(0, filter, search, e.target.checked); }}
                  />
                  Addressable only
                </label>
              </div>
            </div>
            <div className="table-scroll">
              <table>
                <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Dark addressable entity list with predicted LTV and opportunity scores</caption>
                <thead>
                  <tr>
                    <th>Entity</th>
                    <th>Segment</th>
                    <th>Priority</th>
                    <th style={{textAlign:'right'}}>Predicted LTV</th>
                    <th style={{textAlign:'right'}}>Opportunity</th>
                    <th>Churn</th>
                    <th>Channel</th>
                    <th>Identity</th>
                  </tr>
                </thead>
                <tbody>
                  {ents.map((e, i) => (
                    <tr key={i}>
                      <td>
                        <div style={{fontWeight:500, fontSize:13}}>{e.customer_name || e.entity_id}</div>
                        <div style={{fontSize:11, color:'var(--text-muted)'}}>{e.entity_id}</div>
                      </td>
                      <td><span className="badge badge-neutral">{e.customer_segment}</span></td>
                      <td><span style={{color: prioColor(e.dark_audience_priority), fontSize:12, fontWeight:600}}>{(e.dark_audience_priority || '').replace(/_/g, ' ')}</span></td>
                      <td style={{textAlign:'right'}}>{fmtCur(e.predicted_ltv_12m)}</td>
                      <td style={{textAlign:'right', color:'var(--success)', fontWeight:600}}>{fmtCur(e.opportunity_score)}</td>
                      <td>
                        <span className={e.churn_risk_score > 0.6 ? 'badge badge-danger' : e.churn_risk_score > 0.3 ? 'badge badge-warning' : 'badge badge-success'}>
                          {e.churn_risk_tier}
                        </span>
                      </td>
                      <td style={{fontSize:12}}>{e.recommended_channel}</td>
                      <td>
                        <span className={e.identity_confidence_tier === 'VERY_HIGH' || e.identity_confidence_tier === 'HIGH' ? 'badge badge-success' : 'badge badge-warning'}>
                          {e.identity_confidence_tier}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {/* Pagination */}
            {entTotal > 25 && (
              <div style={{display:'flex', justifyContent:'center', gap:8, marginTop:12}}>
                <button
                  className="btn btn-primary"
                  disabled={entPage === 0}
                  onClick={() => { const p = entPage - 1; setEntPage(p); loadEntities(p, filter, search, addressableOnly); }}
                  style={{padding:'6px 16px', fontSize:13}}
                >
                  Previous
                </button>
                <span style={{padding:'6px 0', fontSize:13, color:'var(--text-secondary)'}}>
                  Page {entPage + 1} of {Math.ceil(entTotal / 25)}
                </span>
                <button
                  className="btn btn-primary"
                  disabled={(entPage + 1) * 25 >= entTotal}
                  onClick={() => { const p = entPage + 1; setEntPage(p); loadEntities(p, filter, search, addressableOnly); }}
                  style={{padding:'6px 16px', fontSize:13}}
                >
                  Next
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ---- Channel Maturity Page (CMO-142: per-channel measurement maturity roadmap) ----

      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        setLoading(true);
        setError(null);
        api('/api/channels/maturity')
          .then(d => { setData(d); setLoading(false); })
          .catch(e => { setError(e.message); setLoading(false); });

      if (loading) return <div role="status" aria-live="polite" style={{padding:40, textAlign:'center', color:'var(--text-secondary)'}}>Loading channel maturity data...</div>;

              <div className="kpi-label">Total Holdout Conversions</div>

            <div className="card" style={{textAlign:'center', padding:20}}>

    // -----------------------------------------------------------------------
    // DataFreshnessBar — Cache table freshness guard (APP-CACHE-HEALTH)
    // CMO-145 systemic fix: shows data recency and warns on stale caches
    // -----------------------------------------------------------------------
    function DataFreshnessBar() {
      const [health, setHealth] = useState(null);
      const [expanded, setExpanded] = useState(false);

      useEffect(() => {
        api('/api/cache/table-health')
          .then(setHealth)
          .catch(() => null);
      }, []);

      if (!health) return null;

      const isStale = health.overall_status === 'stale';
      const dataTs = health.data_as_of;
      const fmtTime = (iso) => {
        if (!iso) return 'unknown';
        const d = new Date(iso);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' ' + d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      };

      const barStyle = {
        display: 'flex', alignItems: 'center', gap: 8, padding: '6px 16px',
        fontSize: 11, fontWeight: 500, borderRadius: 'var(--radius)',
        marginBottom: 12, cursor: 'pointer', userSelect: 'none',
        background: isStale ? 'var(--warning-bg)' : 'rgba(52,211,153,0.08)',
        color: isStale ? 'var(--warning)' : 'var(--success)',
        border: '1px solid ' + (isStale ? 'rgba(251,191,36,0.25)' : 'rgba(52,211,153,0.15)'),
      };

      return React.createElement('div', null,
        React.createElement('div', {
          style: barStyle,
          onClick: () => setExpanded(!expanded),
          onKeyDown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setExpanded(!expanded); } },
          role: 'button',
          tabIndex: 0,
          'aria-expanded': expanded,
          'aria-label': (isStale ? 'Data cache is stale' : 'Data cache is fresh') + '. Click for cache details',
        },
          React.createElement(Icon, { d: isStale ? icons.alertCircle : icons.shieldCheck, size: 14 }),
          React.createElement('span', null,
            isStale
              ? 'Data may be stale \u2014 ' + health.tables_stale + '/' + health.tables_total + ' tables need refresh'
              : 'Data fresh \u2014 ' + health.tables_fresh + '/' + health.tables_total + ' tables'
          ),
          React.createElement('span', { style: { color: 'var(--text-muted)', marginLeft: 'auto' } },
            'As of ' + fmtTime(dataTs)
          ),
          React.createElement('span', { style: { fontSize: 10, color: 'var(--text-muted)' } },
            expanded ? '\u25B2' : '\u25BC'
          )
        ),
        expanded && React.createElement('div', {
          style: { background: 'var(--bg-card)', border: '1px solid var(--border)',
                   borderRadius: 'var(--radius)', padding: 12, marginBottom: 12,
                   maxHeight: 200, overflowY: 'auto', fontSize: 11 }
        },
          React.createElement('table', { style: { width: '100%', borderCollapse: 'collapse' } },
            React.createElement('caption', { className: 'kpi-label', style: { captionSide: 'top', textAlign: 'left', marginBottom: 8 } },
              'Cached Table Health (threshold: ' + health.stale_threshold_hours + 'h)'
            ),
            React.createElement('thead', null,
              React.createElement('tr', { style: { background: 'var(--bg-secondary)', borderBottom: '1px solid var(--border)' } },
                React.createElement('th', { style: { textAlign: 'left', padding: '6px 12px', fontWeight: 600, color: 'var(--text-secondary)', letterSpacing: '0.02em' } }, 'Table'),
                React.createElement('th', { style: { textAlign: 'right', padding: '6px 12px', fontWeight: 600, color: 'var(--text-secondary)', letterSpacing: '0.02em' } }, 'Age (hrs)'),
                React.createElement('th', { style: { textAlign: 'center', padding: '6px 12px', fontWeight: 600, color: 'var(--text-secondary)', letterSpacing: '0.02em' } }, 'Status')
              )
            ),
            React.createElement('tbody', null,
              (health.tables || []).map((t, i) =>
                React.createElement('tr', { key: i },
                  React.createElement('td', { style: { padding: '4px 12px', color: 'var(--text-secondary)', maxWidth: 300, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } },
                    t.table.replace('customerlake_', '').replace('_cached', '').replace('_materialized', '')
                  ),
                  React.createElement('td', { style: { padding: '4px 12px', textAlign: 'right', color: 'var(--text-secondary)' } },
                    t.age_hours != null ? t.age_hours + 'h' : '\u2014'
                  ),
                  React.createElement('td', { style: { padding: '4px 12px', textAlign: 'center' } },
                    React.createElement('span', {
                      className: 'badge ' + (t.status === 'fresh' ? 'badge-success' : t.status === 'stale' ? 'badge-warning' : 'badge-danger')
                    }, t.status.toUpperCase())
                  )
                )
              )
            )
          )
        )
      );
    }

    // ---- Spend Transparency Page (CMO-252/289: CFO-ready reconciliation) ----
    function SpendTransparencyPage() {
      const [data, setData] = useState(null);
      const [error, setError] = useState(null);
      useEffect(() => {
        api('/api/spend-crosswalk').then(setData).catch(e => setError(e.message));
      }, []);
      if (error) return <ErrorCard message={error} onRetry={() => { setError(null); api('/api/spend-crosswalk').then(setData).catch(e => setError(e.message)); }} />;
      if (!data) return <div aria-live="polite" role="status"><LoadingShimmer /></div>;

      const fmtUsd = (v) => v == null ? '\u2014' : '$' + Number(v).toLocaleString(undefined, {maximumFractionDigits:0});
      const maxSpend = Math.max(...data.methodologies.map(m => m.spend_usd || 0), 1);

      const methodColors = {
        FULLY_LOADED_TREATMENT: 'var(--success)',
        DELIVERY_ONLY: 'var(--accent)',
        CPA_DELIVERY: 'var(--warning)',
        CAC_MODELED_LIFETIME: 'var(--danger)',
        PLATFORM_INFRASTRUCTURE: 'var(--info)',
      };

      return (
        <div className="page-content">
          <div className="page-header">
            <h2><Icon d={icons.fileText} size={22} /> Spend Transparency</h2>
            <p className="page-subtitle">{data.subtitle}</p>
          </div>

          {/* Hero: canonical spend */}
          <div className="card" style={{padding:24, marginBottom:24, background:'linear-gradient(135deg, var(--bg-card) 0%, var(--accent-light) 100%)', borderLeft:'3px solid var(--success)'}}>
            <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))', gap:20}}>
              <div style={{textAlign:'center'}}>
                <div className="kpi-label">Canonical Spend (CFO)</div>
                <div style={{fontSize:32, fontWeight:700, color:'var(--success)'}}>{fmtUsd(data.hero.canonical_spend_usd)}</div>
                <div style={{fontSize:12, color:'var(--text-secondary)'}}>{(data.hero.canonical_methodology || '').replace(/_/g, ' ')}</div>
              </div>
              <div style={{textAlign:'center'}}>
                <div className="kpi-label">Methodologies</div>
                <div style={{fontSize:32, fontWeight:700, color:'var(--accent)'}}>{data.hero.total_methodologies}</div>
                <div style={{fontSize:12, color:'var(--text-secondary)'}}>All reconciled</div>
              </div>
              <div style={{textAlign:'center'}}>
                <div className="kpi-label">Spread Factor</div>
                <div style={{fontSize:32, fontWeight:700, color:'var(--warning)'}}>{data.hero.spread_x}x</div>
                <div style={{fontSize:12, color:'var(--text-secondary)'}}>Max / Min across methods</div>
              </div>
            </div>
            <div style={{textAlign:'center', marginTop:16, fontSize:13, color:'var(--text-secondary)', fontStyle:'italic'}}>
              Only the CANONICAL row should be quoted in board materials. All others are context.
            </div>
          </div>

          {/* Diff badge */}
          <div style={{marginBottom:16}}>
            <span className="diff-badge">CFO-READY</span>
            <span style={{fontSize:13, color:'var(--text-secondary)', marginLeft:8}}>
              Legacy CDPs report one number. CustomerLake reconciles all five and explains each.
            </span>
          </div>

          {/* Methodology cards */}
          {data.methodologies.map((m, i) => {
            const color = methodColors[m.methodology] || 'var(--text-secondary)';
            const barWidth = m.spend_usd ? Math.max((m.spend_usd / maxSpend) * 100, 2) : 0;
            return (
              <div key={i} className="card" style={{marginBottom:16, padding:20, borderLeft: `3px solid ${color}`, position:'relative', overflow:'hidden'}}>
                {m.is_canonical && (
                  <div style={{position:'absolute', top:0, right:0, background:'var(--success)', color:'#fff', fontSize:10, fontWeight:700, padding:'4px 12px', borderBottomLeftRadius:8, letterSpacing:0.5}}>
                    CANONICAL
                  </div>
                )}
                <div style={{display:'flex', alignItems:'center', gap:12, marginBottom:12}}>
                  <span style={{background: color, color:'#fff', borderRadius:'50%', width:32, height:32, display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, fontWeight:700}}>{m.order}</span>
                  <div>
                    <div style={{fontSize:16, fontWeight:700}}>{(m.methodology || '').replace(/_/g, ' ')}</div>
                    <div style={{fontSize:12, color:'var(--text-secondary)'}}>{m.description}</div>
                  </div>
                </div>

                {/* Spend bar */}
                <div style={{marginBottom:12}}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:4}}>
                    <span style={{fontSize:28, fontWeight:700, color: m.is_canonical ? 'var(--success)' : 'var(--text-primary)'}}>{fmtUsd(m.spend_usd)}</span>
                    <span style={{fontSize:11, color:'var(--text-muted)'}}>{m.contributing_rows.toLocaleString()} source rows</span>
                  </div>
                  <div role="img" aria-label={`${(m.methodology || '').replace(/_/g, ' ')}: ${fmtUsd(m.spend_usd)}`} style={{background:'var(--border)', borderRadius:4, height:8, overflow:'hidden'}}>
                    <div style={{background: color, height:'100%', width: barWidth + '%', borderRadius:4, transition:'width 0.6s ease'}} />
                  </div>
                </div>

                {/* Scope */}
                <div style={{fontSize:12, color:'var(--text-secondary)', marginBottom:8, lineHeight:1.5}}>
                  <span style={{fontWeight:600}}>Scope:</span> {m.scope}
                </div>

                {/* Reconciliation note */}
                <div style={{fontSize:12, color: m.is_canonical ? 'var(--success)' : 'var(--text-muted)', lineHeight:1.5, padding:'8px 12px', background: m.is_canonical ? 'var(--success)' + '11' : 'var(--bg-hover)', borderRadius:6}}>
                  <span style={{fontWeight:600}}>CFO Note:</span> {m.reconciliation_note}
                </div>

                {/* Guidance */}
                <div style={{fontSize:11, color:'var(--text-muted)', marginTop:8, fontStyle:'italic'}}>
                  {m.guidance}
                </div>
              </div>
            );
          })}

          {/* Differentiator */}
          <div style={{fontSize:12, color:'var(--text-secondary)', textAlign:'center', marginTop:8, marginBottom:12}}>
            {data.differentiator}
          </div>
          <div style={{fontSize:11, color:'var(--text-secondary)', textAlign:'right'}}>Methodology: {data.methodology} | Source: customerlake_spend_crosswalk</div>
        </div>
      );
    }
