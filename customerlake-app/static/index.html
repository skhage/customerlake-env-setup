            setSuppressData(supRes);
          }
        } catch (e) {
          setError(e.message);
        }
        setLoading(false);
      }, [purposeFilter, riskFilter]);

      useEffect(() => { loadData(); }, [loadData]);

      if (loading) return <div className="loading" role="status" aria-live="polite">Loading incrementality data…</div>;

      const purposes = data.by_purpose || [];

        if (v > 0) return 'var(--accent)';
        return 'var(--danger)';

                      <div role="img" aria-label={`Treatment conversion rate: ${fmtPct(m.treatment_cvr)}`} style={{background:'var(--bg-hover)', borderRadius:4, height:28, overflow:'hidden'}}>
                        <div style={{height:'100%', borderRadius:4, background:'var(--danger)', width: Math.max(Number(m.treatment_cvr) / 12 * 100, 5) + '%', display:'flex', alignItems:'center', paddingLeft:8, fontSize:12, fontWeight:700, color:'#fff', minWidth:50}}>

                      <div role="img" aria-label={`Organic conversion rate: ${fmtPct(m.organic_cvr)}`} style={{background:'var(--bg-hover)', borderRadius:4, height:28, overflow:'hidden'}}>
                        <div style={{height:'100%', borderRadius:4, background:'var(--success)', width: Math.max(Number(m.organic_cvr) / 12 * 100, 5) + '%', display:'flex', alignItems:'center', paddingLeft:8, fontSize:12, fontWeight:700, color:'#fff', minWidth:50}}>
                          {fmtPct(m.organic_cvr)}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Worst Segments Table */}

                  <div>

                            <th>CHANNEL</th>

                            <th>LIFT</th>
                            <th>REVENUE IMPACT</th>
                            <th>COST WASTED</th>
                          </tr>
                        </thead>
                        <tbody>
                          {worstSegs.slice(0, 5).map((s, i) => (
                            <tr key={i}>
                              <td style={{fontWeight:500}}>{s.purpose}</td>
                              <td>{s.channel}</td>
                              <td><span style={{color:'var(--text-muted)', fontWeight:600, fontSize:11}}>{s.churn_risk_tier}</span></td>
                              <td style={{color:'var(--danger)'}}>{fmtPct(s.treatment_conversion_rate_pct)}</td>
                              <td style={{color:'var(--success)'}}>{fmtPct(s.holdout_conversion_rate_pct)}</td>
                              <td style={{color:'var(--danger)', fontWeight:600}}>{s.lift_pct != null ? s.lift_pct + '%' : '—'}</td>
                              <td style={{color:'var(--danger)', fontWeight:600}}>{fmtCur(s.revenue_impact)}</td>
                              <td>{fmtCur(s.cost_wasted)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            );
          })()}

          {/* What Only CustomerLake Can Do */}
          <div className="card" style={{background:'rgba(79,143,247,0.06)', borderColor:'var(--accent)'}}>
            <div className="card-title" style={{color:'var(--accent)'}}>
              <Icon d={icons.trendingUp} size={16} /> What Only CustomerLake Can Do
            </div>
            <div style={{fontSize:13, color:'var(--text-secondary)', lineHeight:1.6}}>
              <span className="diff-badge">HOLDOUT</span> 10% entity-level holdout proves true incremental lift — no legacy CDP runs real experiments. <br/>
              <span className="diff-badge">RISK-TIER</span> ML churn predictions stratify incrementality by risk — CRITICAL entities show 5×+ lift vs holdout. <br/>
              <span className="diff-badge">TRUE ROI</span> Subtracts organic conversions to reveal honest ROI — naive metrics inflate by 10–50×. <br/>
              <span className="diff-badge">SUPPRESS</span> Identifies campaigns that DESTROY value (negative lift) — save budget by suppressing them.
            </div>

            <p style={{fontSize:12, color:'var(--text-muted)', marginBottom:12}}>Higher churn risk = higher incremental lift from intervention. This is the CustomerLake value story.</p>
            {tiers.map(t => {
              const barW = Math.min(Math.abs(Number(t.incremental_revenue) || 0) / maxIncrRev * 100, 100);
              const isPos = (Number(t.incremental_revenue) || 0) >= 0;
              return (
                <div key={t.churn_risk_tier} className="bar-chart-row" role="img" aria-label={`${t.churn_risk_tier}: ${fmtCur(t.incremental_revenue)} incremental revenue, ${t.lift_pct != null ? t.lift_pct + '% lift' : 'n/a lift'}`}>
                  <span className="bar-label" style={{color: tierColor(t.churn_risk_tier), fontWeight:600, width:80}}>{t.churn_risk_tier}</span>
                  <div className="bar-track">
                    <div className="bar-fill" style={{width: barW + '%', background: isPos ? tierColor(t.churn_risk_tier) : 'var(--danger)'}}>

    // ---- Dark Audience Explorer (CMO-80, CMO-100, CMO-106) ----
    function DarkAudiencePage() {
      const [kpiData, setKpiData] = useState(null);
      const [summary, setSummary] = useState(null);
      const [entities, setEntities] = useState(null);
      const [loading, setLoading] = useState(true);
      const [filter, setFilter] = useState('');
      const [search, setSearch] = useState('');
      const [addressableOnly, setAddressableOnly] = useState(false);
      const [entPage, setEntPage] = useState(0);

      useEffect(() => {
        Promise.all([
          api('/api/dark-audience/kpis'),
          api('/api/dark-audience/summary'),
          api('/api/dark-audience/entities?addressable_only=true&limit=25'),
        ]).then(([k, s, e]) => {
          setKpiData(k);
          setSummary(s);
          setEntities(e);
        }).finally(() => setLoading(false));
      }, []);

      const loadEntities = (pg, prio, q, addrOnly) => {
        const params = new URLSearchParams();
        params.set('limit', '25');
        params.set('offset', String(pg * 25));
        if (prio) params.set('priority', prio);
        if (q) params.set('q', q);
        if (addrOnly) params.set('addressable_only', 'true');
        api('/api/dark-audience/entities?' + params.toString()).then(setEntities);
      };

      if (loading) return <div className="loading" role="status" aria-live="polite">Loading dark audience data...</div>;
      if (!kpiData) return <ErrorCard message="Failed to load dark audience data" onRetry={() => window.location.reload()} />;

      const k = kpiData.kpis || {};
      const prio = kpiData.priority_breakdown || [];
      const segs = (summary && summary.segments) || [];
      const ents = (entities && entities.entities) || [];
      const entTotal = (entities && entities.total) || 0;

      const fmtB = (v) => {
        if (v == null) return '\u2014';
        const n = Number(v);
        if (n >= 1e9) return '$' + (n / 1e9).toFixed(1) + 'B';
        if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
        if (n >= 1e3) return '$' + (n / 1e3).toFixed(0) + 'K';
        return '$' + n.toLocaleString();
      };

      const prioLabel = (p) => {
        const map = {
          'P0_HIGH_LTV_AT_RISK': 'P0: High LTV + At Risk',
          'P1_HIGH_LTV_STABLE': 'P1: High LTV + Stable',
          'P2_MEDIUM_LTV': 'P2: Medium LTV',
          'P3_LOW_LTV': 'P3: Low LTV',
        };
        return map[p] || p;
      };

      const prioColor = (p) => {
        const map = {
          'P0_HIGH_LTV_AT_RISK': 'var(--danger)',
          'P1_HIGH_LTV_STABLE': 'var(--accent)',
          'P2_MEDIUM_LTV': 'var(--warning)',
          'P3_LOW_LTV': 'var(--text-muted)',
        };
        return map[p] || 'var(--text-secondary)';
      };

      const reasonLabel = (r) => {
        const map = {
          'ADDRESSABLE_NEVER_ACTIVATED': 'Addressable \u2014 Never Activated',
          'NO_CONSENT': 'No Marketing Consent',
          'DO_NOT_CONTACT': 'Do Not Contact',
        };
        return map[r] || r;
      };

      return (
        <div>
          <div className="page-header">
            <h2>Dark Audience Explorer</h2>
            <p>CMO-80: {fmtPct(k.dark_pct)} of profiles have never been activated \u2014 surface the hidden revenue opportunity</p>
          </div>

          {/* HERO KPIs */}
          <div className="kpi-grid" style={{gridTemplateColumns:'repeat(4, 1fr)'}}>
            <div className="kpi-card" style={{borderLeft:'3px solid var(--danger)'}}>
              <div className="kpi-label">Never Activated</div>
              <div className="kpi-value" style={{color:'var(--danger)'}}>{fmt(k.never_activated)}</div>
              <div className="kpi-sub">{fmtPct(k.dark_pct)} of all entities \u2014 invisible to marketing</div>
            </div>
            <div className="kpi-card" style={{borderLeft:'3px solid var(--info)'}}>
              <div className="kpi-label">Dark Addressable</div>
              <div className="kpi-value" style={{color:'var(--info)'}}>{fmt(k.dark_addressable)}</div>
              <div className="kpi-sub">Have consent + ML scores but zero campaigns</div>
            </div>
            <div className="kpi-card" style={{borderLeft:'3px solid var(--success)'}}>
              <div className="kpi-label">Recoverable LTV</div>
              <div className="kpi-value" style={{color:'var(--success)'}}>{fmtB(k.addressable_dark_ltv)}</div>
              <div className="kpi-sub">Predicted 12-month LTV for dark addressable</div>
            </div>
            <div className="kpi-card" style={{borderLeft:'3px solid var(--warning)'}}>
              <div className="kpi-label">Opportunity Score</div>
              <div className="kpi-value" style={{color:'var(--warning)'}}>{fmtB(k.addressable_opportunity)}</div>
              <div className="kpi-sub">Risk-adjusted, confidence-weighted value</div>
            </div>
          </div>

          {/* DIFFERENTIATOR */}
          <div className="card" style={{borderLeft:'3px solid var(--accent)', marginBottom:16}}>
            <div style={{fontSize:13, color:'var(--text-secondary)'}}>
              <span className="diff-badge">UNIQUE</span> Only CustomerLake can surface dark audiences \u2014 entities with consent and ML predictions but zero activation history.
              Legacy CDPs cannot correlate identity graph, consent layer, activation log, and ML scores across source systems to find what you\u2019re NOT doing.
            </div>
          </div>

          {/* PRIORITY BREAKDOWN */}
          <div className="card">
            <div className="card-title"><Icon d={icons.target} size={16} /> Priority Breakdown</div>
            <div className="table-scroll">
              <table>
                <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Dark audience priority breakdown by LTV and churn risk</caption>
                <thead>
                  <tr>
                    <th>Priority Tier</th>
                    <th style={{textAlign:'right'}}>Total Entities</th>
                    <th style={{textAlign:'right'}}>Dark Addressable</th>
                    <th style={{textAlign:'right'}}>Predicted LTV</th>
                    <th style={{textAlign:'right'}}>Opportunity</th>
                    <th style={{textAlign:'right'}}>Avg Churn Risk</th>
                  </tr>
                </thead>
                <tbody>
                  {prio.map((r, i) => (
                    <tr key={i}>
                      <td><span style={{color: prioColor(r.dark_audience_priority), fontWeight:600}}>{prioLabel(r.dark_audience_priority)}</span></td>
                      <td style={{textAlign:'right'}}>{fmt(r.total)}</td>
                      <td style={{textAlign:'right'}}>
                        <span style={{color:'var(--info)', fontWeight:600}}>{fmt(r.dark_addressable)}</span>
                      </td>
                      <td style={{textAlign:'right'}}>{fmtB(r.total_ltv)}</td>
                      <td style={{textAlign:'right'}}>{fmtB(r.total_opportunity)}</td>
                      <td style={{textAlign:'right'}}>
                        <span className={r.avg_churn > 0.5 ? 'badge badge-danger' : r.avg_churn > 0.3 ? 'badge badge-warning' : 'badge badge-success'}>
                          {(r.avg_churn * 100).toFixed(1)}%
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* ACTION SEGMENTS */}
          <div className="card">
            <div className="card-title"><Icon d={icons.sparkles} size={16} /> Action Segments \u2014 Why They\u2019re Dark & What To Do</div>
            <div className="table-scroll">
              <table>
                <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Dark audience action segments with reason and recovery potential</caption>
                <thead>
                  <tr>
                    <th>Reason</th>
                    <th>Type</th>
                    <th>Action</th>
                    <th style={{textAlign:'right'}}>Entities</th>
                    <th style={{textAlign:'right'}}>Revenue at Stake</th>
                    <th style={{textAlign:'right'}}>Recoverable</th>
                    <th style={{textAlign:'right'}}>Reachable</th>
                  </tr>
                </thead>
                <tbody>
                  {segs.map((s, i) => (
                    <tr key={i}>
                      <td style={{fontSize:12}}>{reasonLabel(s.dark_reason)}</td>
                      <td><span className="badge badge-info">{s.entity_type}</span></td>
                      <td style={{fontSize:12, maxWidth:200, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                        {s.recommended_action}
                      </td>
                      <td style={{textAlign:'right', fontWeight:600}}>{fmt(s.entity_count)}</td>
                      <td style={{textAlign:'right'}}>{fmtCur(s.revenue_at_stake)}</td>
                      <td style={{textAlign:'right', color:'var(--success)'}}>{fmtCur(s.recoverable_revenue)}</td>
                      <td style={{textAlign:'right'}}>{fmt(s.multi_channel_reachable + (s.email_only_reachable || 0) + (s.phone_only_reachable || 0))}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* ENTITY LIST */}
          <div className="card">
            <div className="card-title" style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:8}}>
              <span><Icon d={icons.userSearch} size={16} /> Dark Addressable Entities ({fmt(entTotal)} total)</span>
              <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
                <input
                  type="text"
                  placeholder="Search by name or ID..."
                  aria-label="Search dark audience entities by name or ID"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter') {
                      setEntPage(0);
                      loadEntities(0, filter, search, addressableOnly);
                    }
                  }}
                  style={{padding:'6px 10px', background:'var(--bg-secondary)', border:'1px solid var(--border)', borderRadius:'var(--radius)', color:'var(--text-primary)', fontSize:13, width:180}}
                />
                <select
                  value={filter}
                  aria-label="Filter by priority tier"
                  onChange={(e) => { setFilter(e.target.value); setEntPage(0); loadEntities(0, e.target.value, search, addressableOnly); }}
                  style={{padding:'6px 10px', background:'var(--bg-secondary)', border:'1px solid var(--border)', borderRadius:'var(--radius)', color:'var(--text-primary)', fontSize:13}}
                >
                  <option value="">All Priorities</option>
                  <option value="P0_HIGH_LTV_AT_RISK">P0: High LTV at Risk</option>
                  <option value="P1_HIGH_LTV_STABLE">P1: High LTV Stable</option>
                  <option value="P2_MEDIUM_LTV">P2: Medium LTV</option>
                  <option value="P3_LOW_LTV">P3: Low LTV</option>
                </select>
                <label style={{display:'flex', alignItems:'center', gap:4, fontSize:12, color:'var(--text-secondary)', cursor:'pointer'}}>
                  <input
                    type="checkbox"
                    checked={addressableOnly}
                    onChange={(e) => { setAddressableOnly(e.target.checked); setEntPage(0); loadEntities(0, filter, search, e.target.checked); }}
                  />
                  Addressable only
                </label>
              </div>
            </div>
            <div className="table-scroll">
              <table>
                <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:'8px'}}>Dark addressable entity list with predicted LTV and opportunity scores</caption>
                <thead>
                  <tr>
                    <th>Entity</th>
                    <th>Segment</th>
                    <th>Priority</th>
                    <th style={{textAlign:'right'}}>Predicted LTV</th>
                    <th style={{textAlign:'right'}}>Opportunity</th>
                    <th>Churn</th>
                    <th>Channel</th>
                    <th>Identity</th>
                  </tr>
                </thead>
                <tbody>
                  {ents.map((e, i) => (
                    <tr key={i}>
                      <td>
                        <div style={{fontWeight:500, fontSize:13}}>{e.customer_name || e.entity_id}</div>
                        <div style={{fontSize:11, color:'var(--text-muted)'}}>{e.entity_id}</div>
                      </td>
                      <td><span className="badge badge-neutral">{e.customer_segment}</span></td>
                      <td><span style={{color: prioColor(e.dark_audience_priority), fontSize:12, fontWeight:600}}>{(e.dark_audience_priority || '').replace(/_/g, ' ')}</span></td>
                      <td style={{textAlign:'right'}}>{fmtCur(e.predicted_ltv_12m)}</td>
                      <td style={{textAlign:'right', color:'var(--success)', fontWeight:600}}>{fmtCur(e.opportunity_score)}</td>
                      <td>
                        <span className={e.churn_risk_score > 0.6 ? 'badge badge-danger' : e.churn_risk_score > 0.3 ? 'badge badge-warning' : 'badge badge-success'}>

                        </span>
                      </td>
                      <td style={{fontSize:12}}>{e.recommended_channel}</td>
                      <td>
                        <span className={e.identity_confidence_tier === 'VERY_HIGH' || e.identity_confidence_tier === 'HIGH' ? 'badge badge-success' : 'badge badge-warning'}>
                          {e.identity_confidence_tier}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {/* Pagination */}
            {entTotal > 25 && (
              <div style={{display:'flex', justifyContent:'center', gap:8, marginTop:12}}>
                <button
                  className="btn btn-primary"
                  disabled={entPage === 0}
                  onClick={() => { const p = entPage - 1; setEntPage(p); loadEntities(p, filter, search, addressableOnly); }}
                  style={{padding:'6px 16px', fontSize:13}}
                >
                  Previous
                </button>
                <span style={{padding:'6px 0', fontSize:13, color:'var(--text-secondary)'}}>
                  Page {entPage + 1} of {Math.ceil(entTotal / 25)}

                <button
                  className="btn btn-primary"
                  disabled={(entPage + 1) * 25 >= entTotal}
                  onClick={() => { const p = entPage + 1; setEntPage(p); loadEntities(p, filter, search, addressableOnly); }}
                  style={{padding:'6px 16px', fontSize:13}}
                >
                  Next
                </button>
              </div>
            )}

    // ---- Channel Maturity Page (CMO-142: per-channel measurement maturity roadmap) ----
    function ChannelMaturityPage() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        setLoading(true);
        setError(null);
        api('/api/channels/maturity')
          .then(d => { setData(d); setLoading(false); })
          .catch(e => { setError(e.message); setLoading(false); });
      }, []);

      if (loading) return <div role="status" aria-live="polite" style={{padding:40, textAlign:'center', color:'var(--text-secondary)'}}>Loading channel maturity data...</div>;
      if (error) return <ErrorCard message={error} onRetry={() => { setLoading(true); setError(null); api('/api/channels/maturity').then(d => { setData(d); setLoading(false); }).catch(e => { setError(e.message); setLoading(false); }); }} />;
      if (!data) return null;

      const s = data.summary || {};
      const channels = data.channels || [];
      const roadmap = data.roadmap || [];
      const narr = data.narrative || {};

      const tierColor = (tier) => {
        if (tier === 'PRODUCTION') return 'var(--success)';
        if (tier === 'EXPLORATORY') return 'var(--warning)';
        return 'var(--text-muted)';
      };

      const tierBadge = (tier) => {
        if (tier === 'PRODUCTION') return 'badge-success';
        if (tier === 'EXPLORATORY') return 'badge-warning';
        return 'badge-neutral';
      };

      return (
        <div>
          <div className="page-header">
            <h2><Icon d={icons.trendingUp} size={20} /> Channel Maturity</h2>
            <p>Per-channel measurement maturity progression toward PRODUCTION threshold</p>
          </div>

          <div style={{display:'flex', gap:8, flexWrap:'wrap', marginBottom:16}}>
            <span className="diff-badge">MEASUREMENT</span>
            <span className="diff-badge">HOLDOUT</span>
            <span className="diff-badge">HONEST</span>
            <span className="diff-badge">PER-CHANNEL</span>
          </div>

          {/* Hero KPIs */}
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))', gap:16, marginBottom:24}}>
            <div className="card" style={{textAlign:'center', padding:20}}>
              <div className="kpi-label">Channels at PRODUCTION</div>
              <div className="kpi-value" style={{color: s.channels_at_production > 0 ? 'var(--success)' : 'var(--danger)'}}>
                {s.channels_at_production} / {s.total_channels}
              </div>
              <div style={{fontSize:11, color:'var(--text-muted)', marginTop:4}}>200+ holdout conversions required</div>
            </div>
            <div className="card" style={{textAlign:'center', padding:20}}>
              <div className="kpi-label">Total Holdout Conversions</div>
              <div className="kpi-value">{fmt(s.total_holdout_conversions)}</div>
              <div style={{fontSize:11, color:'var(--text-muted)', marginTop:4}}>Across all channels</div>
            </div>
            <div className="card" style={{textAlign:'center', padding:20}}>
              <div className="kpi-label">Closest to PRODUCTION</div>
              <div className="kpi-value" style={{color:'var(--accent)'}}>{s.best_channel}</div>
              <div style={{fontSize:11, color:'var(--text-muted)', marginTop:4}}>{s.best_channel_pct}% of threshold</div>
            </div>
            <div className="card" style={{textAlign:'center', padding:20}}>
              <div className="kpi-label">Portfolio Progress</div>
              <div className="kpi-value">{s.portfolio_pct_to_production}%</div>
              <div style={{fontSize:11, color:'var(--text-muted)', marginTop:4}}>Average across channels</div>
            </div>
          </div>

          {/* Why It Matters */}
          <div className="card" role="note" style={{padding:'12px 16px', marginBottom:24, borderLeft:'3px solid var(--warning)'}}>
            <div style={{fontWeight:600, fontSize:13, marginBottom:4}}><Icon d={icons.alertCircle} size={14} /> Why This Matters</div>
            <div style={{fontSize:12, color:'var(--text-secondary)', lineHeight:1.5}}>{narr.why_it_matters}</div>
          </div>

          {/* Per-Channel Maturity Cards */}
          <div className="card-title" style={{marginBottom:12}}><Icon d={icons.barChart} size={16} /> Channel-by-Channel Maturity</div>
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(320px, 1fr))', gap:16, marginBottom:24}}>
            {channels.map(c => {
              const pct = Math.min(c.pct_to_production, 100);
              const gap = c.production_threshold - c.holdout_conversions;
              return (
                <div key={c.channel} className="card" style={{padding:20}}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12}}>
                    <h3 style={{fontSize:15, fontWeight:600, textTransform:'capitalize'}}>{c.channel.replace(/_/g, ' ')}</h3>
                    <span className={tierBadge(c.maturity_tier)} style={{fontSize:11}}>{c.maturity_tier}</span>
                  </div>

                  {/* Progress bar */}
                  <div style={{marginBottom:12}}>
                    <div style={{display:'flex', justifyContent:'space-between', fontSize:11, color:'var(--text-secondary)', marginBottom:4}}>
                      <span>{c.holdout_conversions} holdout conversions</span>
                      <span>{c.production_threshold} needed</span>
                    </div>
                    <div role="img" aria-label={c.channel + ': ' + pct + '% toward production'} style={{height:8, background:'var(--bg-hover)', borderRadius:4, overflow:'hidden'}}>
                      <div style={{height:'100%', width: pct + '%', background: tierColor(c.maturity_tier), borderRadius:4, transition:'width 0.5s ease'}} />
                    </div>
                    <div style={{fontSize:10, color:'var(--text-muted)', marginTop:2, textAlign:'right'}}>{pct.toFixed(1)}% to PRODUCTION</div>
                  </div>

                  {/* Metrics row */}
                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, marginBottom:12}}>
                    <div>
                      <div className="kpi-label">ROI</div>
                      <div style={{fontSize:14, fontWeight:600}}>{c.campaign_roi_x.toFixed(2)}x</div>
                    </div>
                    <div>
                      <div className="kpi-label">LTV:CAC</div>
                      <div style={{fontSize:14, fontWeight:600}}>{c.ltv_cac_ratio.toFixed(2)}x</div>
                    </div>
                    <div>
                      <div className="kpi-label">Evidence</div>
                      <div style={{fontSize:11, fontWeight:500, color: c.verdict_is_trustworthy ? 'var(--success)' : 'var(--text-muted)'}}>
                        {c.evidence_strength === 'SUGGESTIVE_NOT_CONCLUSIVE' ? 'Suggestive' : c.evidence_strength === 'ANECDOTAL_ONLY' ? 'Anecdotal' : c.evidence_strength}
                      </div>
                    </div>
                  </div>

                  {/* Board readiness */}
                  <div style={{fontSize:11, padding:'6px 10px', background:'var(--bg-hover)', borderRadius:'var(--radius-sm)', marginBottom:8}}>
                    <span style={{fontWeight:600}}>Board Readiness:</span> <span style={{color: c.board_readiness === 'NOT_FOR_DECISIONS' ? 'var(--danger)' : 'var(--success)'}}>{c.board_readiness.replace(/_/g, ' ')}</span>
                  </div>

                  {/* Path to production */}
                  <div style={{fontSize:11, color:'var(--text-secondary)', lineHeight:1.4}}>
                    <Icon d={icons.trendingUp} size={12} /> {c.path_to_production}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Portfolio Measurement Roadmap */}
          {roadmap.length > 0 && (
            <div className="card" style={{padding:20, marginBottom:24}}>
              <div className="card-title"><Icon d={icons.refreshCw} size={16} /> Measurement Maturity Roadmap</div>
              <table className="data-table">
                <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:8}}>Quarterly measurement maturity targets</caption>
                <thead><tr>
                  <th>Period</th><th>Current Proven %</th><th>Target %</th><th>Pipeline</th><th>Action Plan</th>
                </tr></thead>
                <tbody>
                  {roadmap.map((r, i) => (
                    <tr key={i}>
                      <td style={{fontWeight:600}}>{r.period_label}</td>
                      <td>{r.current_proven_pct}%</td>
                      <td style={{color:'var(--accent)'}}>{r.target_proven_pct}%</td>
                      <td>{r.signal_pipeline_segments} segments</td>
                      <td style={{fontSize:11, maxWidth:300}}>{r.action_plan}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* Differentiator */}
          <div className="card" style={{padding:20, borderLeft:'3px solid var(--accent)'}}>
            <div className="card-title"><Icon d={icons.zap} size={16} /> What Only CustomerLake Can Do</div>
            <div style={{fontSize:13, color:'var(--text-secondary)', lineHeight:1.6}}>{narr.differentiator}</div>
          </div>
        </div>
      );
    }

    // ---- Demo Walkthrough Step Definitions ----
    const DEMO_STEPS = [
      {
        id: 1, key: 'identify', label: 'IDENTIFY', duration: '3 min',
        color: 'var(--accent)', bg: 'var(--accent-light)',
        talk: 'Legacy CDPs store contacts. CustomerLake resolves IDENTITIES across billing, CRM, service, and digital — creating a single truth that no point solution can match.',
        pages: ['profiles', 'steward', 'overview'],
        pageLabels: ['Profile Search', 'Identity Steward', 'Overview'],
        primary: 'profiles',
        metrics: [
          { label: 'Unified Entities', key: 'total_entities' },
          { label: 'Source Systems', key: 'source_systems', static: '5' },
          { label: 'Multi-Source', key: 'cross_source_pct', suffix: '%' },
        ],
      },
      {
        id: 2, key: 'activate', label: 'ACTIVATE', duration: '3 min',
        color: 'var(--success)', bg: 'var(--success-bg)',
        talk: 'CustomerLake doesn\'t just build audiences — it activates them with holdout groups and consent enforcement baked in. Every campaign is an experiment from Day 1.',
        pages: ['audiences', 'dark-audience'],
        pageLabels: ['Audience Builder', 'Dark Audience'],
        primary: 'audiences',
        metrics: [
          { label: 'Addressable', key: 'addressable', static: '7,300' },
          { label: 'Channels', key: 'channels', static: '5' },
          { label: 'Dark Audience', key: 'dark', static: '777' },
        ],
      },
      {
        id: 3, key: 'measure', label: 'MEASURE', duration: '3 min',
        color: 'var(--warning)', bg: 'var(--warning-bg)',
        talk: 'Every other CDP inflates ROI with naive last-touch attribution. CustomerLake runs holdout experiments and reports HONEST incrementality — even when the numbers are uncomfortable.',
        pages: ['campaigns', 'incrementality', 'confidence'],
        pageLabels: ['Campaigns', 'Incrementality', 'Stat. Confidence'],
        primary: 'incrementality',
        metrics: [
          { label: 'True Portfolio ROI', key: 'roi', static: '37%' },
          { label: 'Measurement Gap', key: 'gap', static: '81%' },
          { label: 'Methods', key: 'methods', static: '5' },
        ],
      },
      {
        id: 4, key: 'optimize', label: 'OPTIMIZE', duration: '3 min',
        color: 'var(--danger)', bg: 'var(--danger-bg)',
        talk: 'CustomerLake identifies which campaigns DESTROY value and reallocates budget to what works — with ROI guardrails ensuring every dollar is defensible.',
        pages: ['ml', 'closedloop'],
        pageLabels: ['ML Predictions', 'Closed Loop'],
        primary: 'ml',
        metrics: [
          { label: 'Suppress Targets', key: 'suppress', static: '5,612' },
          { label: 'Savings', key: 'savings', static: '$335K' },
          { label: 'ROI-Guarded', key: 'guarded', static: 'Yes' },
        ],
      },
      {
        id: 5, key: 'differentiate', label: 'DIFFERENTIATE', duration: '3 min',
        color: 'var(--info)', bg: 'var(--info-bg)',
        talk: 'This is what only CustomerLake can do. 6 capabilities no legacy CDP matches. 69 metric views. A roadmap from 19% to 50% measurement coverage.',
        pages: ['comparison', 'tco', 'executive', 'channel-maturity'],
        pageLabels: ['Why CustomerLake', 'Cost & ROI', 'Exec Summary', 'Channel Maturity'],
        primary: 'comparison',
        metrics: [
          { label: 'Capabilities', key: 'caps', static: '6' },
          { label: 'Metric Views', key: 'mv', static: '69' },
          { label: 'Measurement Target', key: 'target', static: '50%' },
        ],
      },
    ];

    // Map page IDs to their demo step
    const PAGE_TO_STEP = {};
    DEMO_STEPS.forEach(s => s.pages.forEach(p => { PAGE_TO_STEP[p] = s.id; }));

    // ---- Demo Step Bar (shown when in demo mode) ----
    function DemoStepBar({ currentStep, onStepClick, onExit }) {
      return (
        <div style={{background:'var(--bg-card)', border:'1px solid var(--border)', borderRadius:'var(--radius-lg)', padding:'8px 16px', marginBottom:16, display:'flex', alignItems:'center', gap:4}}>
          <button onClick={onExit} className="btn btn-ghost btn-sm" style={{marginRight:8, fontSize:11}} aria-label="Exit demo mode">
            <Icon d={icons.x} size={14} /> Exit Demo
          </button>
          <div className="demo-step-bar">
            {DEMO_STEPS.map((step, idx) => {
              const isActive = step.id === currentStep;
              const isCompleted = step.id < currentStep;
              return (
                <React.Fragment key={step.id}>
                  {idx > 0 && <div className={`demo-step-connector${isCompleted || isActive ? ' completed-conn' : ''}`} />}
                  <button
                    className={`demo-step-bar-item${isActive ? ' active' : ''}${isCompleted ? ' completed-step' : ''}`}
                    onClick={() => onStepClick(step.id)}
                    aria-current={isActive ? 'step' : undefined}
                  >
                    <span className="demo-step-num">
                      {isCompleted ? <Icon d={icons.checkCircle} size={14} /> : step.id}
                    </span>
                    {step.label}
                  </button>
                </React.Fragment>
              );
            })}
          </div>
          <div style={{marginLeft:'auto', display:'flex', gap:8}}>
            <button
              className="btn btn-ghost btn-sm"
              disabled={currentStep <= 1}
              onClick={() => onStepClick(currentStep - 1)}
              style={{fontSize:11}}
            >
              Previous
            </button>
            <button
              className="btn btn-primary btn-sm"
              disabled={currentStep >= 5}
              onClick={() => onStepClick(currentStep + 1)}
              style={{fontSize:11}}
            >
              Next Step
            </button>
          </div>
        </div>
      );
    }

    // ---- Demo Walkthrough Landing Page ----
    function DemoWalkthroughPage({ onStartDemo, onNavigate }) {
      const [cacheStatus, setCacheStatus] = useState(null);
      const [warming, setWarming] = useState(false);

      const warmCache = useCallback(async () => {
        setWarming(true);
        setCacheStatus(null);
        try {
          const res = await api('/api/demo/prefetch');
          setCacheStatus(res);
        } catch (e) {
          setCacheStatus({ prefetch_status: 'error', message: 'Cache warm failed: ' + e.message });
        } finally {
          setWarming(false);
        }
      }, []);

      // Check cache status on mount
      useEffect(() => {
        api('/api/demo/cache-status').then(s => setCacheStatus(prev => prev || { ...s, prefetch_status: s.cache_warm ? 'warm' : 'cold' })).catch(() => null);
      }, []);

      return (
        <div>
          <div className="demo-landing-hero">
            <h2>CustomerLake: The 15-Minute Story</h2>
            <p>
              One compelling CDP buyer story in 5 steps. Real numbers. Corrected verdicts. No placeholder metrics.
              Walk through IDENTIFY → ACTIVATE → MEASURE → OPTIMIZE → DIFFERENTIATE.
            </p>
            <div style={{display:'flex', gap:12, justifyContent:'center', flexWrap:'wrap'}}>
              <button className="demo-start-btn" onClick={() => onStartDemo(1)}>
                <Icon d={icons.megaphone} size={20} /> Start Guided Demo
              </button>
              <button
                className="demo-start-btn"
                style={{background: warming ? 'var(--warning-bg)' : cacheStatus && cacheStatus.cache_warm ? 'var(--success-bg)' : 'var(--bg-card)', color: warming ? 'var(--warning)' : cacheStatus && cacheStatus.cache_warm ? 'var(--success)' : 'var(--text-secondary)', border: '1px solid var(--border)'}}
                onClick={warmCache}
                disabled={warming}
                aria-label="Warm demo cache for instant page loads"
              >
                <Icon d={icons.trendingUp} size={20} /> {warming ? 'Warming cache...' : cacheStatus && cacheStatus.cache_warm ? 'Cache warm' : 'Warm Demo Cache'}
              </button>
            </div>
            {cacheStatus && cacheStatus.message && (
              <div role="status" aria-live="polite" style={{marginTop:12, padding:'8px 16px', borderRadius:'var(--radius)', background: cacheStatus.prefetch_status === 'complete' ? 'var(--success-bg)' : cacheStatus.prefetch_status === 'error' ? 'var(--danger-bg)' : 'var(--bg-card)', fontSize:12, color: cacheStatus.prefetch_status === 'complete' ? 'var(--success)' : cacheStatus.prefetch_status === 'error' ? 'var(--danger)' : 'var(--text-secondary)'}}>
                {cacheStatus.message}
              </div>
            )}
          </div>

          {DEMO_STEPS.map(step => (
            <div key={step.id} className="demo-step-card" tabIndex={0} role="button" aria-label={`Step ${step.id}: ${step.label} — ${step.duration}`} onClick={() => onStartDemo(step.id)} onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onStartDemo(step.id); } }}>
              <div className="demo-step-icon" style={{background: step.bg, color: step.color}}>
                {step.id}
              </div>
              <div>
                <div style={{display:'flex', alignItems:'center', gap:8}}>
                  <h3 style={{color: step.color}}>{step.label}</h3>
                  <span className="demo-duration">{step.duration}</span>
                </div>
                <div className="demo-talk">"{step.talk}"</div>
                <div className="demo-metrics">
                  {step.metrics.map(m => (
                    <div key={m.label} className="demo-metric">
                      <div className="demo-metric-val" style={{color: step.color}}>{m.static}{m.suffix || ''}</div>
                      <div className="demo-metric-label">{m.label}</div>
                    </div>
                  ))}
                </div>
                <div className="demo-pages">
                  {step.pages.map((p, i) => (
                    <button key={p} className="demo-page-link" onClick={(e) => { e.stopPropagation(); onNavigate(p); }}>
                      {step.pageLabels[i]}
                    </button>
                  ))}
                </div>
              </div>
              <div style={{color:'var(--text-muted)', fontSize:11, textAlign:'right', whiteSpace:'nowrap', paddingTop:4}}>
                Click to start
              </div>
            </div>
          ))}

          <div style={{textAlign:'center', padding:'24px 0', color:'var(--text-muted)', fontSize:12}}>
            Based on the <strong>demo_walkthrough_15min</strong> notebook · 5 sections · 12 live SQL queries
          </div>
        </div>
      );
    }

    function App() {
      const [page, setPage] = useState('demo');
      const [mobileNavOpen, setMobileNavOpen] = useState(false);
      const [demoMode, setDemoMode] = useState(false);
      const [demoStep, setDemoStep] = useState(1);

      const startDemo = (step) => {
        setDemoMode(true);
        setDemoStep(step);
        const s = DEMO_STEPS.find(ds => ds.id === step);
        if (s) setPage(s.primary);
      };

      const exitDemo = () => {
        setDemoMode(false);
        setPage('demo');
      };

      const handleDemoStepClick = (step) => {
        if (step < 1 || step > 5) return;
        setDemoStep(step);
        const s = DEMO_STEPS.find(ds => ds.id === step);
        if (s) setPage(s.primary);
      };

      // Track demo step based on active page
      useEffect(() => {
        if (demoMode && PAGE_TO_STEP[page]) {
          setDemoStep(PAGE_TO_STEP[page]);
        }
      }, [page, demoMode]);

      const pages = [
        { id: 'demo', label: 'Demo Walkthrough', icon: icons.megaphone },
        { id: 'executive', label: 'Exec Summary', icon: icons.award },
        { id: 'overview', label: 'Overview', icon: icons.home },
        { id: 'intelligence', label: 'Intelligence', icon: icons.brain },
        { id: 'profiles', label: 'Profile Search', icon: icons.userSearch },
        { id: 'audiences', label: 'Audience Builder', icon: icons.target },
        { id: 'campaigns', label: 'Campaigns', icon: icons.barChart },
        { id: 'steward', label: 'Identity Steward', icon: icons.gitMerge },
        { id: 'dark-audience', label: 'Dark Audience', icon: icons.alertCircle },
        { id: 'health', label: 'Data Health', icon: icons.shieldCheck },
        { id: 'ml', label: 'ML Predictions', icon: icons.sparkles },
        { id: 'incrementality', label: 'Incrementality', icon: icons.trendingUp },
        { id: 'closedloop', label: 'Closed Loop', icon: icons.refreshCw },
        { id: 'confidence', label: 'Stat. Confidence', icon: icons.lock },
        { id: 'channel-maturity', label: 'Channel Maturity', icon: icons.trendingUp },
        { id: 'tco', label: 'Cost & ROI', icon: icons.dollarSign },
        { id: 'comparison', label: 'Why CustomerLake', icon: icons.zap },
      ];

      const navigate = (id) => {
        setPage(id);
        setMobileNavOpen(false);
      };

      // Close mobile nav on Escape
      useEffect(() => {
        const handler = (e) => { if (e.key === 'Escape') setMobileNavOpen(false); };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
      }, []);

      const renderPage = () => {
        switch(page) {
          case 'demo': return <DemoWalkthroughPage onStartDemo={startDemo} onNavigate={(p) => { setPage(p); }} />;
          case 'executive': return <ExecutiveSummaryPage />;
          case 'overview': return <OverviewPage />;
          case 'intelligence': return <IntelligencePage />;
          case 'profiles': return <ProfileSearchPage />;
          case 'audiences': return <AudienceBuilderPage />;
          case 'campaigns': return <CampaignDashboardPage />;
          case 'steward': return <IdentityStewardPage />;
          case 'dark-audience': return <DarkAudiencePage />;
          case 'health': return <DataHealthPage />;
          case 'ml': return <MLPredictionsPage />;
          case 'incrementality': return <IncrementalityPage />;
          case 'closedloop': return <ClosedLoopPage />;
          case 'confidence': return <StatisticalConfidencePage />;
          case 'channel-maturity': return <ChannelMaturityPage />;
          case 'tco': return <CostRoiPage />;
          case 'comparison': return <ComparisonPage />;
          default: return <OverviewPage />;
        }
      };

      return (
        <div className="app-layout">
          {/* Mobile header with hamburger (UX-FIX-2) */}
          <div className="mobile-header">
            <h1>CustomerLake</h1>
            <button className="hamburger-btn" aria-label="Open navigation menu" onClick={() => setMobileNavOpen(true)}>
              <Icon d={icons.menu} size={20} />
            </button>
          </div>
          {/* Overlay for mobile nav */}
          <div className={`sidebar-overlay ${mobileNavOpen ? 'open' : ''}`} onClick={() => setMobileNavOpen(false)} />
          {/* Sidebar with semantic nav landmark (UX-FIX-4) */}
          <div className={`sidebar ${mobileNavOpen ? 'mobile-open' : ''}`}>
            <div className="sidebar-logo" style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
              <div>
                <h1>CustomerLake</h1>
                <p>AI Customer Intelligence</p>
              </div>
              {mobileNavOpen && (
                <button className="hamburger-btn" aria-label="Close navigation menu" onClick={() => setMobileNavOpen(false)} style={{marginTop:'2px'}}>
                  <Icon d={icons.x} size={18} />
                </button>
              )}
            </div>
            <nav aria-label="Main navigation">
              {pages.map(p => (
                <button key={p.id}
                  className={`nav-item ${page === p.id ? 'active' : ''}`}
                  onClick={() => navigate(p.id)}
                  aria-current={page === p.id ? 'page' : undefined}>
                  <span className="nav-icon" aria-hidden="true"><Icon d={p.icon} /></span>
                  {p.label}
                </button>
              ))}
            </nav>
            <div style={{marginTop:'auto', padding:'16px 20px', borderTop:'1px solid var(--border)'}}>
              <div style={{fontSize:'11px', color:'var(--text-muted)'}}>Powered by Databricks</div>
              <div style={{fontSize:'10px', color:'var(--text-muted)', marginTop:'2px'}}>cdm_tmforum · Lakebase · Unity Catalog · v33.0.0</div>
            </div>
          </div>
          <main className="main-content">
            {demoMode && page !== 'demo' && (
              <DemoStepBar currentStep={demoStep} onStepClick={handleDemoStepClick} onExit={exitDemo} />
            )}
            <SimulationBanner page={page} />
            {renderPage()}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
