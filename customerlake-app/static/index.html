        Promise.all([
          api('/api/board-presentation/script'),
          api('/api/board-presentation/prefetch'),
        ]).then(([s, p]) => {
          setScript(s);
          setPrefetchData(p);
          setLoading(false);
          startTimeRef.current = Date.now();
        }).catch(e => { setError(e.message); setLoading(false); });
      }, []);

      // Timer
      useEffect(() => {
        if (loading) return;
        const iv = setInterval(() => setElapsed(Math.floor((Date.now() - startTimeRef.current) / 1000)), 1000);
        return () => clearInterval(iv);
      }, [loading]);

      // Keyboard navigation
      useEffect(() => {
        const handler = (e) => {
          if (e.key === 'Escape') onExit();
          if (e.key === 'ArrowRight' || e.key === ' ') {
            e.preventDefault();
            setCurrentSlide(s => Math.min(s + 1, (script?.slides?.length || 5) - 1));
          }
          if (e.key === 'ArrowLeft') {
            e.preventDefault();
            setCurrentSlide(s => Math.max(s - 1, 0));
          }
          if (e.key === 'n' || e.key === 'N') setShowNotes(n => !n);
        };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
      }, [script]);

      const fmtTime = (s) => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

      if (loading) return (
        <div className="presentation-overlay" role="dialog" aria-label="Board Presentation loading">
          <div style={{display:'flex', alignItems:'center', justifyContent:'center', flex:1, flexDirection:'column', gap:16}}>
            <LoadingShimmer />
            <p style={{color:'var(--text-muted)', fontSize:14}}>Loading board presentation data...</p>
          </div>
        </div>
      );
      if (error) return (
        <div className="presentation-overlay" role="dialog" aria-label="Board Presentation error">
          <div style={{display:'flex', alignItems:'center', justifyContent:'center', flex:1}}>
            <ErrorCard message={error} onRetry={onExit} />
          </div>
        </div>
      );

      const slides = script?.slides || [];
      const slide = slides[currentSlide] || {};
      const dataKey = slide.data_key || '';
      const slideData = prefetchData?.data?.[dataKey];
      const timing = (prefetchData?.timings || []).find(t => t.slide === dataKey);
      const totalSlides = slides.length;
      const iconKey = slide.icon || 'briefcase';
      const slideIcon = icons[iconKey] || icons.briefcase;

      // Render slide-specific content based on prefetched data
      const renderSlideContent = () => {
        if (!slideData || slideData.status !== 'ok') {
          return <div className="card" style={{textAlign:'center', padding:40}}><Icon d={icons.alertCircle} size={32} /><p style={{marginTop:8, color:'var(--text-muted)'}}>Data unavailable for this slide</p></div>;
        }
        const d = slideData.data || {};
        switch (dataKey) {
          case 'value_summary': {
            const streams = d.value_streams || [];
            const total = d.total || {};
            return (
              <div>
                <div className="card" style={{border:'2px solid var(--accent)', marginBottom:16}}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                    <div>
                      <div className="kpi-label">Total Demonstrable Value</div>
                      <div style={{fontSize:36, fontWeight:700, color:'var(--accent)', marginTop:4}}>{fmtCur(total.amount_usd)}</div>
                    </div>
                    <span className="badge badge-info">{streams.length} value streams</span>
                  </div>
                </div>
                <div className="kpi-grid">{streams.map((s,i) => (
                  <div key={i} className="kpi-card">
                    <div className="kpi-label">{s.category?.replace(/_/g,' ')}</div>
                    <div className="kpi-value" style={{fontSize:22}}>{fmtCur(s.amount_usd)}</div>
                    <div className="kpi-sub"><span className={`badge badge-${s.tier_color === 'success' ? 'success' : s.tier_color === 'warning' ? 'warning' : 'info'}`}>{s.tier_label}</span></div>
                    {s.board_one_liner && <div style={{fontSize:12, color:'var(--text-muted)', marginTop:6}}>{s.board_one_liner}</div>}
                  </div>
                ))}</div>
              </div>
            );
          }
          case 'board_exec': {
            const execRows = d.rows || [];
            const prov = d.provenance || {};
            return (
              <div>
                <div style={{display:'flex', gap:8, marginBottom:16, alignItems:'center'}}>
                  <span className="badge badge-success">{d.board_safe_count || 0}/{d.total_rows || 0} Board Safe</span>
                  <span style={{fontSize:12, color:'var(--text-muted)'}}>Canonical 5-row summary (CMO-355)</span>
                </div>
                {execRows.map((r, i) => (
                  <div key={i} className="card" style={{marginBottom:12, borderLeft: `4px solid var(--${r.tier_color === 'success' ? 'success' : r.tier_color === 'warning' ? 'warning' : 'text-muted'})`}}>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                      <div style={{flex:1}}>
                        <div style={{fontSize:15, fontWeight:600, marginBottom:4}}>{r.headline}</div>
                        <div style={{fontSize:13, color:'var(--text-secondary)', marginBottom:8}}>{r.metric_value}</div>
                        {r.talking_point && <div style={{fontSize:12, color:'var(--text-muted)', lineHeight:1.5}}>{r.talking_point}</div>}
                      </div>
                      <span className={`badge badge-${r.tier_color === 'success' ? 'success' : r.tier_color === 'warning' ? 'warning' : 'info'}`} style={{flexShrink:0, marginLeft:12}}>{r.tier_label}</span>
                    </div>
                  </div>
                ))}
                {prov.disclosure && (
                  <div className="card" style={{background:'var(--bg-hover)', border:'1px solid var(--border)', marginTop:16}}>
                    <div style={{display:'flex', gap:8, alignItems:'flex-start'}}>
                      <Icon d={icons.info} size={14} style={{flexShrink:0, marginTop:2, color:'var(--text-muted)'}} />
                      <div>
                        <div style={{fontSize:11, fontWeight:600, textTransform:'uppercase', letterSpacing:0.5, color:'var(--text-muted)', marginBottom:4}}>Data Provenance</div>
                        <div style={{fontSize:12, color:'var(--text-muted)', lineHeight:1.5}}>{prov.disclosure}</div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          }
          case 'exec_summary': {
            const h = d.hero_kpis || {};
            return (
              <div className="kpi-grid">
                <div className="kpi-card"><div className="kpi-label">Portfolio Revenue</div><div className="kpi-value">{fmtCur(h.total_portfolio_revenue)}</div><div className="kpi-sub">Identity-resolved customer base</div></div>
                <div className="kpi-card"><div className="kpi-label">Revenue at Risk (Calibrated)</div><div className="kpi-value" style={{color:'var(--warning)'}}>{fmtCur(h.revenue_at_risk_calibrated)}</div><div className="kpi-sub">Churn probability \u00D7 calibrated LTV</div></div>
                <div className="kpi-card"><div className="kpi-label">Incremental ROI</div><div className="kpi-value" style={{color: h.incremental_roi_x >= 0 ? 'var(--success)' : 'var(--danger)'}}>{h.incremental_roi_x != null ? h.incremental_roi_x.toFixed(2) + 'x' : '\u2014'}</div><div className="kpi-sub">Holdout-measured, not model-predicted</div></div>
                <div className="kpi-card"><div className="kpi-label">Snapshot Date</div><div className="kpi-value" style={{fontSize:18}}>{d.snapshot_date || '\u2014'}</div><div className="kpi-sub">Materialized for demo performance</div></div>
              </div>
            );
          }
          case 'board_ready': {
            const cats = d.categories || {};
            const catKeys = Object.keys(cats);
            return (
              <div>
                {catKeys.map(cat => (
                  <div key={cat} className="card" style={{marginBottom:12}}>
                    <h4 style={{fontSize:13, fontWeight:600, textTransform:'uppercase', letterSpacing:0.5, marginBottom:8, color:'var(--text-muted)'}}>{cat.replace(/_/g,' ')}</h4>
                    <table><caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:8}}>{cat.replace(/_/g,' ')} board metrics</caption><thead><tr><th>Metric</th><th>Value</th><th>Confidence</th><th>Talking Point</th></tr></thead>
                    <tbody>{(cats[cat] || []).map((m,i) => (
                      <tr key={i}><td style={{fontWeight:500}}>{m.name}</td><td>{m.value} {m.unit}</td><td><span className={`badge ${m.confidence === 'HIGH' ? 'badge-success' : m.confidence === 'MEDIUM' ? 'badge-warning' : 'badge-info'}`}>{m.confidence}</span></td><td style={{fontSize:12, color:'var(--text-muted)'}}>{m.talking_point}</td></tr>
                    ))}</tbody></table>
                  </div>
                ))}
              </div>
            );
          }
          case 'cltv_impact': {
            const h = d.hero_kpis || {};
            const sv = d.siloed_vs_unified || {};
            return (
              <div>
                <div className="kpi-grid">
                  <div className="kpi-card"><div className="kpi-label">Invisible Without CustomerLake</div><div className="kpi-value" style={{color:'var(--danger)'}}>{fmtPct(h.pct_invisible)}</div><div className="kpi-sub">{fmt(h.siloed_entities)} siloed fragments</div></div>
                  <div className="kpi-card"><div className="kpi-label">Visible With CustomerLake</div><div className="kpi-value" style={{color:'var(--success)'}}>{fmtPct(h.pct_visible)}</div><div className="kpi-sub">{fmt(h.unified_entities)} unified entities</div></div>
                  <div className="kpi-card"><div className="kpi-label">Revenue Unlocked</div><div className="kpi-value">{fmtCur(h.revenue_unlocked)}</div><div className="kpi-sub">By identity resolution</div></div>
                  <div className="kpi-card"><div className="kpi-label">Revenue Under Management</div><div className="kpi-value">{fmtCur(h.revenue_under_management)}</div><div className="kpi-sub">Unified + scorable + reachable</div></div>
                </div>
                {sv.siloed && sv.unified && (
                  <div className="card" style={{marginTop:16}}>
                    <h4 className="card-title">Siloed vs Unified Comparison</h4>
                    <table><caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:8}}>Siloed vs Unified entity comparison</caption><thead><tr><th>Metric</th><th>Siloed</th><th>Unified</th></tr></thead><tbody>
                      <tr><td>Entity Count</td><td>{fmt(sv.siloed.entity_count)}</td><td style={{color:'var(--success)'}}>{fmt(sv.unified.entity_count)}</td></tr>
                      <tr><td>Avg Completeness</td><td>{fmtPct(sv.siloed.avg_completeness)}</td><td style={{color:'var(--success)'}}>{fmtPct(sv.unified.avg_completeness)}</td></tr>
                      <tr><td>Total Revenue</td><td>{fmtCur(sv.siloed.total_revenue)}</td><td style={{color:'var(--success)'}}>{fmtCur(sv.unified.total_revenue)}</td></tr>
                    </tbody></table>
                  </div>
                )}
              </div>
            );
          }
          case 'narrative_slides': {
            const sl = d.slides || [];
            const sm = d.summary || {};
            return (
              <div>
                <div className="kpi-grid" style={{marginBottom:16}}>
                  <div className="kpi-card"><div className="kpi-label">Board Safe</div><div className="kpi-value" style={{color:'var(--success)'}}>{sm.board_safe_count || 0}</div><div className="kpi-sub">{fmtCur(sm.board_safe_total_usd)} total</div></div>
                  <div className="kpi-card"><div className="kpi-label">Needs Validation</div><div className="kpi-value" style={{color:'var(--warning)'}}>{sm.requires_validation_count || 0}</div></div>
                  <div className="kpi-card"><div className="kpi-label">Hypothesis</div><div className="kpi-value" style={{color:'var(--accent)'}}>{sm.hypothesis_count || 0}</div></div>
                  <div className="kpi-card"><div className="kpi-label">Total Sections</div><div className="kpi-value">{sl.length}</div></div>
                </div>
                {sl.slice(0, 6).map((s,i) => (
                  <div key={i} className="card" style={{marginBottom:8}}>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                      <div style={{fontWeight:600, fontSize:14}}>{s.title}</div>
                      <span className={`badge ${s.evidence_level === 'BOARD_SAFE' ? 'badge-success' : s.evidence_level === 'REQUIRES_VALIDATION' ? 'badge-warning' : s.evidence_level === 'HYPOTHESIS' ? 'badge-info' : 'badge-neutral'}`}>{s.evidence_level?.replace(/_/g,' ')}</span>
                    </div>
                    {s.value_usd ? <div style={{fontSize:18, fontWeight:700, marginTop:4}}>{fmtCur(s.value_usd)}</div> : null}
                    {s.talking_point && <div style={{fontSize:12, color:'var(--text-muted)', marginTop:6}}>{s.talking_point}</div>}
                  </div>
                ))}
              </div>
            );
          }
          default:
            return <div className="card"><p style={{color:'var(--text-muted)'}}>Slide content loading...</p></div>;
        }
      };

      return (
        <div className="presentation-overlay" role="dialog" aria-label="Board Presentation">
          {/* Top bar: progress dots, timer, exit */}
          <div className="presentation-topbar">
            <div className="presentation-topbar-left">
              <span style={{fontWeight:600, fontSize:14, color:'var(--accent)'}}>CustomerLake Board Deck</span>
              <div className="presentation-progress" role="tablist" aria-label="Presentation slides">
                {slides.map((s, i) => (
                  <button key={i}
                    className={`presentation-dot ${i === currentSlide ? 'active' : i < currentSlide ? 'done' : ''}`}
                    onClick={() => setCurrentSlide(i)}
                    aria-label={`Slide ${i+1}: ${s.title}`}
                    aria-selected={i === currentSlide}
                    role="tab"
                    style={{border:'none', cursor:'pointer'}}
                  />
                ))}
              </div>
              <span className="presentation-timer">{fmtTime(elapsed)} / {script?.total_duration_minutes || 20}:00</span>
              {timing && <span style={{fontSize:11, color: timing.ok ? 'var(--success)' : 'var(--danger)'}}>{timing.ms}ms</span>}
            </div>
            <div className="presentation-nav-arrows">
              <button className="presentation-nav-btn" disabled={currentSlide === 0} onClick={() => setCurrentSlide(s => s-1)} aria-label="Previous slide">&larr; Prev</button>
              <span style={{fontSize:13, color:'var(--text-muted)'}}>{currentSlide+1} / {totalSlides}</span>
              <button className="presentation-nav-btn" disabled={currentSlide === totalSlides-1} onClick={() => setCurrentSlide(s => s+1)} aria-label="Next slide">Next &rarr;</button>
              <button className="presentation-nav-btn" onClick={onExit} aria-label="Exit presentation" style={{color:'var(--danger)', borderColor:'var(--danger)'}}>Exit</button>
            </div>
          </div>

          {/* Slide body */}
          <div className="presentation-body">
            <div className="presentation-slide">
              <div className="presentation-slide-number">Slide {currentSlide+1} of {totalSlides} &mdash; {slide.duration_minutes} min</div>
              <h2 className="presentation-slide-title"><Icon d={slideIcon} size={28} /> {slide.title}</h2>
              {renderSlideContent()}
              {slide.transition && currentSlide < totalSlides - 1 && (
                <div style={{marginTop:24, padding:'12px 16px', background:'var(--accent-light)', borderRadius:8, fontSize:13, color:'var(--accent)', fontStyle:'italic'}}>
                  <strong>Transition:</strong> {slide.transition}
                </div>
              )}
            </div>
          </div>

          {/* Presenter notes bar */}
          {showNotes && (
            <div className="presentation-notes-bar">
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:16}}>
                <div>
                  <strong style={{color:'var(--text-primary)', fontSize:12, textTransform:'uppercase', letterSpacing:0.5}}>Presenter Notes</strong>
                  <div style={{marginTop:4}}>{slide.presenter_notes}</div>
                </div>
                <button className="presentation-notes-toggle" onClick={() => setShowNotes(false)}>Hide (N)</button>
              </div>
            </div>
          )}
          {!showNotes && (
            <div style={{padding:'4px 24px', background:'var(--bg-secondary)', borderTop:'1px solid var(--border)'}}>
              <button className="presentation-notes-toggle" onClick={() => setShowNotes(true)}>Show Notes (N)</button>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [page, setPage] = useState('demo');
      const [mobileNavOpen, setMobileNavOpen] = useState(false);
      const [demoMode, setDemoMode] = useState(false);
      const [demoStep, setDemoStep] = useState(1);
      const [appVersion, setAppVersion] = useState('…');
      const [presentationMode, setPresentationMode] = useState(false);

      // V74-FIX-VERSION-FOOTER: fetch live version from /api/health
      useEffect(() => {
        fetch('/api/health').then(r => r.json()).then(d => { if (d.version) setAppVersion(d.version); }).catch(() => {});
      }, []);

      const startDemo = (step) => {
        setDemoMode(true);
        setDemoStep(step);
        const s = DEMO_STEPS.find(ds => ds.id === step);
        if (s) setPage(s.primary);
      };

      const exitDemo = () => {
        setDemoMode(false);
        setPage('demo');
      };

      const handleDemoStepClick = (step) => {
        if (step < 1 || step > 5) return;
        setDemoStep(step);
        const s = DEMO_STEPS.find(ds => ds.id === step);
        if (s) setPage(s.primary);
      };

      // Track demo step based on active page
      useEffect(() => {
        if (demoMode && PAGE_TO_STEP[page]) {
          setDemoStep(PAGE_TO_STEP[page]);
        }
      }, [page, demoMode]);

    // ---- Customer Lifecycle Page (CMO-300: lifecycle stages, cross-source retention, cohort analysis) ----
    function LifecyclePage() {
      const [stages, setStages] = useState(null);
      const [retention, setRetention] = useState(null);
      const [cohorts, setCohorts] = useState(null);
      const [error, setError] = useState(null);
      useEffect(() => {
        api('/api/lifecycle/stages').then(setStages).catch(e => setError(e.message));
        api('/api/lifecycle/cross-source-retention').then(setRetention).catch(() => {});
        api('/api/lifecycle/cohort-analysis').then(setCohorts).catch(() => {});
      }, []);
      if (error) return <ErrorCard message={error} onRetry={() => { setError(null); api('/api/lifecycle/stages').then(setStages).catch(e => setError(e.message)); }} />;
      if (!stages) return <div aria-live="polite" role="status"><LoadingShimmer /></div>;

      const fmtN = (v) => v == null ? '\u2014' : Number(v).toLocaleString();
      const fmtUsd = (v) => v == null ? '\u2014' : '$' + Number(v).toLocaleString(undefined, {maximumFractionDigits:0});
      const fmtB = (v) => v == null ? '\u2014' : '$' + (v >= 1e6 ? (v/1e6).toFixed(1)+'M' : (v/1e3).toFixed(0)+'K');
      const fmtPct = (v) => v == null ? '\u2014' : v.toFixed(1) + '%';

      const stageColors = {
        prospect: 'var(--text-muted)', lead: 'var(--info)', active: 'var(--success)',
        dormant: 'var(--warning)', suspended: 'var(--danger)', churned: 'var(--danger)',
        win_back: 'var(--accent)', deceased: 'var(--text-muted)'
      };
      const maxEntities = Math.max(...stages.stages.map(s => s.entity_count), 1);

      return (
        <div className="page-content">
          <div className="page-header">
            <h2><Icon d={icons.users} size={22} /> Customer Lifecycle</h2>
            <p className="page-subtitle">{stages.subtitle}</p>
          </div>

          {/* Data provenance disclosure — CMO-306 compliance (V100-UX-FIX-5) */}
          <div role="note" style={{background:'var(--warning-bg)', border:'1px solid var(--warning)', borderRadius:'var(--radius)', padding:'12px 16px', marginBottom:16, fontSize:12, color:'var(--warning)', lineHeight:1.5}}>
            <span style={{fontWeight:700, display:'inline-flex', alignItems:'center', gap:4}}><Icon d={icons.alertTriangle} size={14} /> SIMULATION ENVIRONMENT:</span> Lifecycle stages computed from modeled identity-resolved data. These metrics model production patterns, not production measurements.
          </div>

          {/* Hero KPIs */}
          <div className="card" style={{padding:24, marginBottom:24, background:'linear-gradient(135deg, var(--bg-card) 0%, var(--accent-light) 100%)', borderLeft:'3px solid var(--accent)'}}>
            <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(160px, 1fr))', gap:16}}>
              <div style={{textAlign:'center'}}>
                <div className="kpi-label">Total Entities</div>
                <div style={{fontSize:32, fontWeight:700, color:'var(--accent)'}}>{fmtN(stages.hero.total_entities)}</div>
                <div style={{fontSize:12, color:'var(--text-secondary)'}}>Identity-resolved</div>
              </div>
              <div style={{textAlign:'center'}}>
                <div className="kpi-label">Total Revenue</div>
                <div style={{fontSize:32, fontWeight:700, color:'var(--success)'}}>{fmtB(stages.hero.total_revenue)}</div>
                <div style={{fontSize:12, color:'var(--text-secondary)'}}>Lifetime across stages</div>
              </div>
              <div style={{textAlign:'center'}}>
                <div className="kpi-label">Active Revenue</div>
                <div style={{fontSize:32, fontWeight:700, color:'var(--success)'}}>{fmtB(stages.hero.active_revenue)}</div>
                <div style={{fontSize:12, color:'var(--text-secondary)'}}>Active + Lead</div>
              </div>
              <div style={{textAlign:'center'}}>
                <div className="kpi-label">At-Risk Revenue</div>
                <div style={{fontSize:32, fontWeight:700, color:'var(--danger)'}}>{fmtB(stages.hero.at_risk_revenue)}</div>
                <div style={{fontSize:12, color:'var(--text-secondary)'}}>Dormant + Suspended</div>
              </div>
            </div>
          </div>

          {/* Differentiator badge */}
          <div style={{marginBottom:16}}>
            <span className="diff-badge">CDP DIFFERENTIATOR</span>
            <span style={{fontSize:13, color:'var(--text-secondary)', marginLeft:8}}>
              {stages.differentiator}
            </span>
          </div>

          {/* Lifecycle Stage Funnel */}
          <div className="card" style={{padding:20, marginBottom:24}}>
            <div className="card-title"><Icon d={icons.barChart} size={16} /> Lifecycle Stage Distribution</div>
            {stages.stages.map((s, i) => {
              const color = stageColors[s.stage] || 'var(--text-muted)';
              const barW = Math.max((s.entity_count / maxEntities) * 100, 2);
              return (
                <div key={i} style={{marginBottom:16, padding:'12px 16px', borderLeft:`3px solid ${color}`, background:'var(--bg-hover)', borderRadius:'0 8px 8px 0'}}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>
                    <div>
                      <span style={{fontWeight:600, fontSize:14, textTransform:'capitalize'}}>{s.stage}</span>
                      <span style={{fontSize:11, color:'var(--text-muted)', marginLeft:8}}>{s.description}</span>
                    </div>
                    <span style={{fontSize:18, fontWeight:700, color}}>{fmtN(s.entity_count)}</span>
                  </div>
                  <div role="img" aria-label={`${s.stage}: ${fmtN(s.entity_count)} entities, ${fmtPct(s.pct_of_base)} of base`} style={{background:'var(--border)', borderRadius:4, height:6, overflow:'hidden', marginBottom:6}}>
                    <div style={{background:color, height:'100%', width:barW+'%', borderRadius:4, transition:'width 0.6s ease'}} />
                  </div>
                  <div style={{display:'flex', gap:20, fontSize:11, color:'var(--text-secondary)'}}>
                    <span>{fmtPct(s.pct_of_base)} of base</span>
                    <span>Avg Rev: {fmtUsd(s.avg_revenue)}</span>
                    <span>Multi-src: {fmtPct(s.pct_multi_source)}</span>
                    <span>Churn Risk: {(s.avg_churn_risk * 100).toFixed(0)}%</span>
                    <span>ID Depth: {s.avg_identity_depth.toFixed(1)}</span>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Cross-Source Retention */}
          {retention && (
            <div className="card" style={{padding:20, marginBottom:24}}>

                    <div style={{display:'flex', gap:20, fontSize:11, color:'var(--text-secondary)'}}>
                      <span>Churn: {fmtPct(t.churn_pct)}</span>
                      <span>Win-back: {fmtPct(t.win_back_pct)}</span>
                      <span>Avg Rev: {fmtUsd(t.avg_revenue)}</span>
                      <span>Rev/Source: {fmtUsd(t.revenue_per_source)}</span>

                  </div>

              <div style={{marginTop:12, padding:'10px 14px', background:'var(--success)11', borderRadius:6, fontSize:12, color:'var(--success)', lineHeight:1.5}}>

          {/* Cohort Analysis */}
          {cohorts && (
            <div className="card" style={{padding:20, marginBottom:24}}>

                  <div className="kpi-label">Revenue Retained</div>
                  <div style={{fontSize:28, fontWeight:700, color:'var(--success)'}}>{fmtB(cohorts.hero.total_retained_revenue)}</div>
                </div>
                <div style={{textAlign:'center'}}>
                  <div className="kpi-label">Revenue Lost</div>
                  <div style={{fontSize:28, fontWeight:700, color:'var(--danger)'}}>{fmtB(cohorts.hero.total_lost_revenue)}</div>
                </div>
                <div style={{textAlign:'center'}}>
                  <div className="kpi-label">Multi-Source Lift</div>
                  <div style={{fontSize:28, fontWeight:700, color:'var(--accent)'}}>+{cohorts.hero.avg_multi_source_lift_pp}pp</div>
                  <div style={{fontSize:11, color:'var(--text-secondary)'}}>Avg across {cohorts.hero.total_cohorts} cohorts</div>
                </div>
              </div>

              <div style={{overflowX:'auto'}}>
                <table>
                  <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:8}}>Cohort retention by activation year</caption>
                  <thead>
                    <tr>
                      <th>Cohort</th>
                      <th>Size</th>
                      <th>Retained</th>
                      <th>Churned</th>
                      <th>Dormant</th>
                      <th>Win-Back</th>
                      <th>Retention</th>
                      <th>Multi-Src Ret.</th>
                      <th>Single-Src Ret.</th>
                      <th>Lift</th>
                      <th>Rev Retained</th>
                      <th>Rev Lost</th>
                    </tr>
                  </thead>
                  <tbody>
                    {cohorts.cohorts.map((c, i) => (
                      <tr key={i}>
                        <td style={{fontWeight:700}}>{c.year}</td>
                        <td>{fmtN(c.size)}</td>
                        <td style={{color:'var(--success)'}}>{fmtN(c.active)}</td>
                        <td style={{color:'var(--danger)'}}>{fmtN(c.churned)}</td>
                        <td style={{color:'var(--warning)'}}>{fmtN(c.dormant)}</td>
                        <td style={{color:'var(--accent)'}}>{fmtN(c.win_back)}</td>
                        <td style={{fontWeight:700}}>{fmtPct(c.retention_pct)}</td>
                        <td style={{fontWeight:600, color:'var(--success)'}}>{fmtPct(c.multi_source_retention)}</td>
                        <td style={{color:'var(--text-muted)'}}>{fmtPct(c.single_source_retention)}</td>
                        <td style={{fontWeight:700, color: c.multi_source_lift_pp > 0 ? 'var(--success)' : 'var(--danger)'}}>

                        </td>
                        <td>{fmtB(c.total_retained)}</td>
                        <td style={{color:'var(--danger)'}}>{fmtB(c.total_lost)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div style={{marginTop:12, padding:'10px 14px', background:'var(--accent)11', borderRadius:6, fontSize:12, color:'var(--accent)', lineHeight:1.5}}>
                <span style={{fontWeight:700}}>CustomerLake Insight:</span> {cohorts.differentiator}
              </div>
            </div>
          )}

          <div style={{fontSize:11, color:'var(--text-secondary)', marginTop:12, textAlign:'right'}}>Methodology: {stages.methodology}</div>
        </div>
      );
    }

    // ---- Production Path Page (CMO-312/314/306/310: simulation-to-reality roadmap) ----
    // ---- CPA Sensitivity Analysis Page (CMO-313: CVR scenario breakeven) ----
    function CpaSensitivityPage() {
      const [data, setData] = useState(null);
      const [error, setError] = useState(null);
      useEffect(() => {
        api('/api/cpa-sensitivity').then(setData).catch(e => setError(e.message));
      }, []);

      if (error) return <ErrorCard message={error} onRetry={() => { setError(null); api('/api/cpa-sensitivity').then(setData).catch(e => setError(e.message)); }} />;
      if (!data) return <div aria-live="polite" role="status"><div className="card" style={{padding:40, textAlign:'center'}}><div className="shimmer" style={{height:200}} /></div></div>;

      const fmtUsd = (v) => v == null ? '\u2014' : '$' + Math.round(v).toLocaleString();
      const fmtPctLocal = (v) => v == null ? '\u2014' : v.toFixed(1) + '%';
      const s = data.summary;

      const verdictColor = (v) => {
        if (v === 'STRONG_POSITIVE') return 'var(--success)';
        if (v === 'MARGINAL_POSITIVE') return 'var(--success)';
        if (v === 'MARGINAL_NEGATIVE') return 'var(--warning)';
        return 'var(--danger)';
      };
      const verdictLabel = (v) => v ? v.replace(/_/g, ' ') : '\u2014';

      // Max revenue for bar scaling
      const maxRev = Math.max(...data.scenarios.map(r => Math.abs(r.incremental_revenue_usd || 0)), 1);

      return (
        <div style={{maxWidth:1100, margin:'0 auto'}}>
          <h2 style={{fontSize:22, fontWeight:600, marginBottom:4}}><Icon d={icons.percent} size={22} /> CPA Sensitivity Analysis</h2>
          <p style={{fontSize:13, color:'var(--text-secondary)', marginBottom:16}}>{data.subtitle} <ProvenanceBadge synthetic={true} /></p>

          {/* PROVENANCE DISCLOSURE BANNER */}
          <div style={{padding:'14px 18px', background:'var(--warning)18', border:'1px solid var(--warning)44', borderRadius:8, marginBottom:24, display:'flex', gap:10, alignItems:'flex-start'}}>
            <Icon d={icons.alertCircle} size={18} />
            <div>
              <div style={{fontWeight:700, fontSize:13, color:'var(--warning)', marginBottom:4, textTransform:'uppercase', letterSpacing:0.5}}>Synthetic Data Scenarios</div>
              <div style={{fontSize:12, color:'var(--text-secondary)', lineHeight:1.6}}>{data.provenance_warning}</div>
            </div>
          </div>

          {/* BREAKEVEN HERO */}
          <div className="card" style={{padding:20, marginBottom:24, borderLeft:'4px solid var(--accent)'}}>
            <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(140px, 1fr))', gap:16, marginBottom:16}}>
              <div className="kpi-card">
                <div className="kpi-label">Breakeven Lift</div>
                <div className="kpi-value" style={{color:'var(--accent)', fontSize:28}}>{s.breakeven_lift_pct != null ? s.breakeven_lift_pct + '%' : '\u2014'}</div>
                <div style={{fontSize:11, color:'var(--text-muted)'}}>of synthetic lift needed</div>
              </div>
              <div className="kpi-card">
                <div className="kpi-label">Base Revenue</div>
                <div className="kpi-value" style={{color:'var(--success)'}}>{fmtUsd(s.base_revenue_usd)}</div>
                <div style={{fontSize:11, color:'var(--text-muted)'}}>at 100% lift (synthetic)</div>
              </div>
              <div className="kpi-card">
                <div className="kpi-label">Delivery Cost</div>
                <div className="kpi-value">{fmtUsd(s.delivery_cost_usd)}</div>
                <div style={{fontSize:11, color:'var(--text-muted)'}}>constant across scenarios</div>
              </div>
              <div className="kpi-card">
                <div className="kpi-label">Worst Case Loss</div>
                <div className="kpi-value" style={{color:'var(--danger)'}}>{fmtUsd(s.worst_case_loss_usd)}</div>
                <div style={{fontSize:11, color:'var(--text-muted)'}}>zero-lift null hypothesis</div>
              </div>
            </div>
            <div style={{fontSize:13, color:'var(--accent)', fontWeight:600, lineHeight:1.5}}>
              <Icon d={icons.trendingUp} size={14} /> {data.breakeven_insight}
            </div>
          </div>

          {/* SCENARIO CHART — horizontal bar visualization */}
          <div className="card" style={{padding:20, marginBottom:24}}>
            <h3 style={{fontSize:16, fontWeight:600, marginBottom:16}}>Revenue by Lift Scenario</h3>
            {data.scenarios.filter(r => r.scenario_code !== 'S5_ZERO_LIFT').map((r, i) => {
              const barWidth = Math.max(Math.abs(r.incremental_revenue_usd || 0) / maxRev * 100, 2);
              const isPositive = (r.net_profit_usd || 0) > 0;
              const barColor = isPositive ? 'var(--success)' : 'var(--danger)';
              const isBase = r.scenario_code === 'S0_CURRENT_SYNTHETIC' || r.scenario_code === 'S4_FULL_LIFT';
              return (
                <div key={i} style={{marginBottom:16, padding:'12px 16px', background: isBase ? 'var(--accent)08' : 'var(--bg-hover)', borderRadius:8, borderLeft: isBase ? '3px solid var(--accent)' : '3px solid transparent'}}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>
                    <div>
                      <span style={{fontWeight:700, fontSize:13}}>{r.lift_pct_of_observed}% Lift</span>
                      <span style={{fontSize:11, color:'var(--text-muted)', marginLeft:8}}>{r.scenario_description}</span>
                    </div>
                    <span style={{fontSize:12, fontWeight:700, color: verdictColor(r.investment_verdict), padding:'2px 8px', borderRadius:4, background: verdictColor(r.investment_verdict) + '22'}}>
                      {verdictLabel(r.investment_verdict)}
                    </span>
                  </div>
                  <div style={{display:'flex', alignItems:'center', gap:12}}>
                    <div role="img" aria-label={r.scenario_description + ': ' + fmtUsd(r.incremental_revenue_usd)} style={{flex:1, height:24, background:'var(--bg-secondary)', borderRadius:4, overflow:'hidden', position:'relative'}}>
                      <div style={{width: barWidth + '%', height:'100%', background: barColor, borderRadius:4, transition:'width 0.5s ease'}} />
                      {/* Breakeven line */}
                      {s.breakeven_lift_pct != null && r.lift_pct_of_observed >= s.breakeven_lift_pct && i > 0 && (
                        <div style={{position:'absolute', left: (s.delivery_cost_usd / maxRev * 100) + '%', top:0, bottom:0, borderLeft:'2px dashed var(--accent)', opacity:0.6}} />
                      )}
                    </div>
                    <div style={{minWidth:120, textAlign:'right'}}>
                      <span style={{fontSize:13, fontWeight:700, color:'var(--text-primary)'}}>{fmtUsd(r.incremental_revenue_usd)}</span>
                      <span style={{fontSize:11, color: isPositive ? 'var(--success)' : 'var(--danger)', marginLeft:6}}>({fmtPctLocal(r.delivery_roi_pct)} ROI)</span>
                    </div>
                  </div>
                  <div style={{fontSize:11, color:'var(--text-muted)', marginTop:4}}>
                    Net: {fmtUsd(r.net_profit_usd)} | Cost efficiency: {r.cost_efficiency} | {r.profitable_channels}/{r.total_channels} channels profitable
                  </div>
                </div>
              );
            })}

            {/* Zero-lift callout */}
            {data.scenarios.filter(r => r.scenario_code === 'S5_ZERO_LIFT').map((r, i) => (
              <div key={'zero-'+i} style={{padding:'12px 16px', background:'var(--danger)12', borderRadius:8, borderLeft:'3px solid var(--danger)', marginTop:8}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                  <div>
                    <span style={{fontWeight:700, fontSize:13, color:'var(--danger)'}}>0% Lift \u2014 Null Hypothesis</span>
                    <span style={{fontSize:11, color:'var(--text-muted)', marginLeft:8}}>{r.scenario_description}</span>
                  </div>
                  <span style={{fontSize:13, fontWeight:700, color:'var(--danger)'}}>{fmtUsd(r.net_profit_usd)} pure loss</span>
                </div>
                <div style={{fontSize:11, color:'var(--text-secondary)', marginTop:4}}>{r.methodology_note}</div>
              </div>
            ))}
          </div>

          {/* DETAILED SCENARIO TABLE */}
          <div className="card" style={{padding:20, marginBottom:24}}>
            <h3 style={{fontSize:16, fontWeight:600, marginBottom:12}}>Scenario Detail</h3>
            <div style={{overflowX:'auto'}}>
              <table>
                <caption className="kpi-label" style={{captionSide:'top', textAlign:'left', marginBottom:8}}>CVR scenario analysis with investment verdicts</caption>
                <thead>
                  <tr>
                    <th>Scenario</th>
                    <th>Lift %</th>
                    <th>Incremental Rev.</th>
                    <th>Net Profit</th>
                    <th>ROI</th>
                    <th>Cost/$ Rev</th>
                    <th>Verdict</th>
                  </tr>
                </thead>
                <tbody>
                  {data.scenarios.map((r, i) => (
                    <tr key={i} style={{background: (r.scenario_code === 'S0_CURRENT_SYNTHETIC' || r.scenario_code === 'S4_FULL_LIFT') ? 'var(--accent)08' : undefined}}>
                      <td style={{fontWeight:600, fontSize:12, maxWidth:200}}>{r.scenario_description}</td>
                      <td style={{fontWeight:700}}>{r.lift_pct_of_observed}%</td>
                      <td>{fmtUsd(r.incremental_revenue_usd)}</td>
                      <td style={{color: (r.net_profit_usd || 0) > 0 ? 'var(--success)' : 'var(--danger)', fontWeight:700}}>{fmtUsd(r.net_profit_usd)}</td>
                      <td style={{color: (r.delivery_roi_pct || 0) > 0 ? 'var(--success)' : 'var(--danger)'}}>{fmtPctLocal(r.delivery_roi_pct)}</td>
                      <td style={{fontSize:11}}>{r.cost_efficiency}</td>
                      <td><span style={{padding:'2px 8px', borderRadius:4, fontSize:11, fontWeight:600, background: verdictColor(r.investment_verdict) + '22', color: verdictColor(r.investment_verdict)}}>{verdictLabel(r.investment_verdict)}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* METHODOLOGY NOTES */}
          <div className="card" style={{padding:20, marginBottom:24}}>
            <h3 style={{fontSize:16, fontWeight:600, marginBottom:12}}>Methodology Notes</h3>
            {data.scenarios.map((r, i) => (
              <div key={i} style={{padding:'8px 12px', marginBottom:8, background:'var(--bg-hover)', borderRadius:6, fontSize:12, lineHeight:1.5}}>
                <span style={{fontWeight:700, color:'var(--accent)'}}>{r.lift_pct_of_observed}% Lift:</span>{' '}
                <span style={{color:'var(--text-secondary)'}}>{r.methodology_note}</span>
              </div>
            ))}
          </div>

          {/* DIFFERENTIATOR */}
          <div style={{marginTop:12, padding:'10px 14px', background:'var(--accent)11', borderRadius:6, fontSize:12, color:'var(--accent)', lineHeight:1.5}}>
            <span style={{fontWeight:700}}>CustomerLake Insight:</span> {data.differentiator}
          </div>

          <div style={{fontSize:11, color:'var(--text-secondary)', marginTop:12, textAlign:'right'}}>Source: customerlake_cpa_sensitivity_analysis</div>
        </div>
      );
    }

                {data.checks.map((c, i) => (
                  <tr key={i} style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:'8px 12px', fontSize:12, fontFamily:'monospace'}}>{c.source}</td>
                    <td style={{padding:'8px 12px', textAlign:'center'}}>
                      <span style={{fontSize:10, fontWeight:700, padding:'2px 8px', borderRadius:4, background: statusColor(c.status), color:'#fff'}}>{c.status}</span>
                    </td>
                    <td style={{padding:'8px 12px', textAlign:'center', fontSize:14}}>
                      {c.is_demo_safe ? <span style={{color:'var(--success)'}}>\u2713</span> : <span style={{color:'var(--danger)'}}>\u2717</span>}
                    </td>
                    <td style={{padding:'8px 12px', fontSize:11, color:'var(--text-muted)'}}>
                      {c.headline_conversions != null && `${c.headline_conversions} conversions, $${(c.headline_revenue_usd||0).toLocaleString()}`}
                      {c.gap_usd != null && `Gap: $${c.gap_usd.toLocaleString()} (${c.gap_pct > 0 ? '+' : ''}${c.gap_pct}%)`}
                      {c.row3_stale && 'Row 3 cites $210K (canonical $503K)'}
                      {c.slide_count != null && `${c.slide_count}/${c.expected} slides`}
                      {c.consistent === true && `$${(c.proven_revenue_usd||0).toLocaleString()} consistent`}
                      {c.consistent === false && `Mismatch: $${(c.proven_revenue_usd||0).toLocaleString()} vs $${(c.canonical_revenue_usd||0).toLocaleString()}`}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* === SECTION 4: Channel Detail === */}
          {data.checks[0] && data.checks[0].channel_detail && (
            <div className="card" style={{marginBottom:16}}>
              <h3 style={{fontWeight:600, marginBottom:12}}><Icon d={icons.barChart} size={16} /> Channel Performance (Canonical)</h3>
              <table><caption style={{captionSide:'top', textAlign:'left', fontSize:11, color:'var(--text-muted)', marginBottom:8}}>Per-channel incremental conversions from holdout experiments</caption>
                <thead><tr>
                  <th style={{textAlign:'left', fontSize:11, padding:'8px 12px'}}>Channel</th>
                  <th style={{textAlign:'right', fontSize:11, padding:'8px 12px'}}>Incr. Conv.</th>
                  <th style={{textAlign:'right', fontSize:11, padding:'8px 12px'}}>Revenue</th>
                  <th style={{textAlign:'right', fontSize:11, padding:'8px 12px'}}>ROI</th>
                  <th style={{textAlign:'center', fontSize:11, padding:'8px 12px'}}>Action</th>
                </tr></thead>
                <tbody>
                  {data.checks[0].channel_detail.map((ch, i) => (
                    <tr key={i} style={{borderBottom:'1px solid var(--border)', background: ch.incremental_conversions < 0 ? 'rgba(248,113,113,0.05)' : 'transparent'}}>
                      <td style={{padding:'8px 12px', fontSize:12, fontWeight:600}}>{ch.channel}</td>
                      <td style={{padding:'8px 12px', textAlign:'right', fontSize:12, fontWeight:600, color: ch.incremental_conversions > 0 ? 'var(--success)' : 'var(--danger)'}}>{ch.incremental_conversions}</td>
                      <td style={{padding:'8px 12px', textAlign:'right', fontSize:12}}>${ch.revenue_usd.toLocaleString(undefined, {maximumFractionDigits:0})}</td>
                      <td style={{padding:'8px 12px', textAlign:'right', fontSize:12}}>{ch.roi_x.toFixed(1)}x</td>
                      <td style={{padding:'8px 12px', textAlign:'center'}}>
                        <span style={{fontSize:10, fontWeight:700, padding:'2px 8px', borderRadius:4, background: ch.action === 'SCALE' ? 'var(--success)' : ch.action === 'EXIT' ? 'var(--danger)' : 'var(--warning)', color:'#fff'}}>{ch.action}</span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* === SECTION 5: Recommended Demo Path === */}
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:16}}>
            <div className="card" style={{borderLeft:'3px solid var(--success)'}}>
              <h3 style={{fontWeight:600, marginBottom:12, color:'var(--success)'}}><Icon d={icons.checkCircle} size={16} /> Safe Pages</h3>
              {data.recommended_demo_path.map((p, i) => (
                <div key={i} style={{padding:'8px 12px', marginBottom:4, background:'rgba(52,211,153,0.05)', borderRadius:'var(--radius)', cursor:'pointer'}} onClick={() => window.dispatchEvent(new CustomEvent('navigate', {detail: p.id}))}>
                  <div style={{fontSize:13, fontWeight:600}}>{p.label}</div>
                  <div style={{fontSize:11, color:'var(--text-muted)'}}>{p.reason}</div>
                </div>
              ))}
            </div>
            <div className="card" style={{borderLeft:'3px solid var(--danger)'}}>
              <h3 style={{fontWeight:600, marginBottom:12, color:'var(--danger)'}}><Icon d={icons.alertTriangle} size={16} /> Unsafe Pages</h3>
              {data.unsafe_pages.map((p, i) => (
                <div key={i} style={{padding:'8px 12px', marginBottom:4, background:'rgba(248,113,113,0.05)', borderRadius:'var(--radius)'}}>
                  <div style={{display:'flex', alignItems:'center', gap:8}}>
                    <span style={{fontSize:13, fontWeight:600}}>{p.label}</span>
                    <span style={{fontSize:10, fontWeight:700, padding:'2px 6px', borderRadius:4, background:'var(--danger)', color:'#fff'}}>{p.severity}</span>
                  </div>
                  <div style={{fontSize:11, color:'var(--text-muted)'}}>{p.reason}</div>
                </div>
              ))}
            </div>
          </div>

          {/* === SECTION 6: Demo Opener Script === */}
          <div className="card" style={{marginBottom:16, background:'var(--bg-card)', border:'2px solid var(--accent)'}}>
            <h3 style={{fontWeight:600, marginBottom:8}}><Icon d={icons.megaphone} size={16} /> Demo Opener (copy-paste ready)</h3>
            <div style={{fontSize:13, lineHeight:1.7, padding:'12px 16px', background:'rgba(0,0,0,0.03)', borderRadius:'var(--radius)', fontStyle:'italic'}}>{data.demo_opener}</div>
          </div>

          <div style={{fontSize:11, color:'var(--text-muted)', textAlign:'right'}}>CustomerLake v{data.app_version} | Demo Readiness Check | CMO-374 + PM-ENFORCE-VIEW-DISCIPLINE</div>
        </div>
      );
    }

      const pages = [
        // --- BOARD DECK: Demo-safe pages a board member finds in <60s (CMO-354) ---
        { section: 'BOARD DECK' },
        { id: 'budget-reallocation', label: 'Budget Reallocation', icon: icons.trendingUp },
        { id: 'budget-waste', label: 'Budget Waste Headline', icon: icons.scissors },
        { id: 'demo-readiness', label: 'Demo Readiness', icon: icons.shieldCheck },
        { id: 'demo', label: 'Demo Walkthrough', icon: icons.megaphone },
        { id: 'conversion-narrative', label: 'Conversion Narrative', icon: icons.target },
        { id: 'board-narrative', label: 'Board Narrative', icon: icons.briefcase },
        { id: 'executive', label: 'Exec Summary', icon: icons.award },
        { id: 'board-ready', label: 'Board Ready', icon: icons.checkCircle },
        { id: 'cltv-impact', label: 'CLTV Impact', icon: icons.heart },
        // --- CUSTOMER INTELLIGENCE ---
        { section: 'CUSTOMER INTELLIGENCE' },
        { id: 'overview', label: 'Overview', icon: icons.home },
        { id: 'intelligence', label: 'Intelligence', icon: icons.brain },
        { id: 'profiles', label: 'Profile Search', icon: icons.userSearch },
        { id: 'audiences', label: 'Audience Builder', icon: icons.target },
        { id: 'steward', label: 'Identity Steward', icon: icons.gitMerge },
        // --- CAMPAIGN ANALYTICS ---
        { section: 'CAMPAIGN ANALYTICS' },
        { id: 'campaigns', label: 'Campaigns', icon: icons.barChart },
        { id: 'dark-audience', label: 'Dark Audience', icon: icons.alertCircle },
        { id: 'ml', label: 'ML Predictions', icon: icons.sparkles },
        { id: 'incrementality', label: 'Incrementality', icon: icons.trendingUp },
        { id: 'closedloop', label: 'Closed Loop', icon: icons.refreshCw },
        { id: 'learning-loop', label: 'Learning Loop', icon: icons.activity },
        { id: 'activation-intel', label: 'Activation Intel', icon: icons.send },
        // --- MEASUREMENT ---
        { section: 'MEASUREMENT' },
        { id: 'attribution-truth', label: 'Attribution Truth', icon: icons.alertTriangle },
        { id: 'confidence', label: 'Stat. Confidence', icon: icons.lock },
        { id: 'channel-maturity', label: 'Channel Maturity', icon: icons.layers },
        { id: 'cpa-sensitivity', label: 'CPA Sensitivity', icon: icons.percent },
        { id: 'lifecycle', label: 'Lifecycle', icon: icons.users },
        // --- VALUE & OPTIMIZATION ---
        { section: 'VALUE & OPTIMIZATION' },
        { id: 'tco', label: 'Cost & ROI', icon: icons.dollarSign },
        { id: 'comparison', label: 'Why CustomerLake', icon: icons.zap },
        { id: 'action-playbook', label: 'Action Playbook', icon: icons.clipboardList },
        { id: 'waste-exposure', label: 'Waste Exposure', icon: icons.scissors },
        { id: 'spend-optimization', label: 'Spend Less, Get More', icon: icons.trendingDown },
        { id: 'reoptimization', label: 'Reoptimization', icon: icons.rocket },
        // --- OPERATIONS ---
        { section: 'OPERATIONS' },
        { id: 'health', label: 'Data Health', icon: icons.shieldCheck },
        { id: 'spend-transparency', label: 'Spend Transparency', icon: icons.fileText },
        { id: 'production-path', label: 'Production Path', icon: icons.calendar },
        { id: 'cost-methodology', label: 'Cost Methodology', icon: icons.alertTriangle },
      ];

      const navigate = (id) => {
        setPage(id);
        setMobileNavOpen(false);
      };

      // Close mobile nav on Escape
      useEffect(() => {
        const handler = (e) => { if (e.key === 'Escape') setMobileNavOpen(false); };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
      }, []);

      const renderPage = () => {
        switch(page) {
          case 'demo': return <DemoWalkthroughPage onStartDemo={startDemo} onNavigate={(p) => { setPage(p); }} />;
          case 'executive': return <ExecutiveSummaryPage />;
          case 'overview': return <OverviewPage />;
          case 'intelligence': return <IntelligencePage />;
          case 'profiles': return <ProfileSearchPage />;
          case 'audiences': return <AudienceBuilderPage />;
          case 'campaigns': return <CampaignDashboardPage />;
          case 'steward': return <IdentityStewardPage />;
          case 'dark-audience': return <DarkAudiencePage />;
          case 'health': return <DataHealthPage />;
          case 'ml': return <MLPredictionsPage />;
          case 'incrementality': return <IncrementalityPage />;
          case 'closedloop': return <ClosedLoopPage />;
          case 'confidence': return <StatisticalConfidencePage />;
          case 'channel-maturity': return <ChannelMaturityPage />;
          case 'tco': return <CostRoiPage />;
          case 'comparison': return <ComparisonPage />;
          case 'action-playbook': return <ActionPlaybookPage />;
          case 'waste-exposure': return <WasteExposurePage />;
          case 'reoptimization': return <ReoptimizationPage />;
          case 'learning-loop': return <CampaignLearningLoopPage />;
          case 'activation-intel': return <ActivationIntelligencePage />;
          case 'attribution-truth': return <AttributionTruthPage />;
          case 'conversion-narrative': return <ConversionNarrativePage />;
          case 'budget-reallocation': return <BudgetReallocationSlidePage />;
          case 'budget-waste': return <BudgetWasteHeadlinePage />;
          case 'demo-readiness': return <DemoReadinessPage />;
          case 'board-ready': return <BoardReadyPage />;
          case 'spend-transparency': return <SpendTransparencyPage />;
          case 'lifecycle': return <LifecyclePage />;
          case 'cpa-sensitivity': return <CpaSensitivityPage />;
          case 'production-path': return <ProductionPathPage />;
          case 'cltv-impact': return <CLTVImpactPage />;
          case 'spend-optimization': return <SpendOptimizationPage />;
          case 'cost-methodology': return <CostMethodologyPage />;
          case 'board-narrative': return <BoardNarrativePage onPresent={() => setPresentationMode(true)} />;
          default: return <OverviewPage />;
        }
      };

      // Board Presentation Mode overlay
      if (presentationMode) {
        return <BoardPresentationMode onExit={() => setPresentationMode(false)} />;
      }

      return (
        <div className="app-layout">
          {/* Mobile header with hamburger (UX-FIX-2) */}
          <div className="mobile-header">
            <h1>CustomerLake</h1>
            <button className="hamburger-btn" aria-label="Open navigation menu" onClick={() => setMobileNavOpen(true)}>
              <Icon d={icons.menu} size={20} />
            </button>
          </div>
          {/* Overlay for mobile nav */}
          <div className={`sidebar-overlay ${mobileNavOpen ? 'open' : ''}`} onClick={() => setMobileNavOpen(false)} />
          {/* Sidebar with semantic nav landmark (UX-FIX-4) */}
          <div className={`sidebar ${mobileNavOpen ? 'mobile-open' : ''}`}>
            <div className="sidebar-logo" style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
              <div>
                <h1>CustomerLake</h1>
                <p>AI Customer Intelligence</p>
              </div>
              {mobileNavOpen && (
                <button className="hamburger-btn" aria-label="Close navigation menu" onClick={() => setMobileNavOpen(false)} style={{marginTop:'2px'}}>
                  <Icon d={icons.x} size={18} />
                </button>
              )}
            </div>
            <nav aria-label="Main navigation">
              {pages.map((p, idx) => (
                p.section
                  ? <div key={`section-${idx}`} className="nav-section">{p.section}</div>
                  : <button key={p.id}
                      className={`nav-item ${page === p.id ? 'active' : ''}`}
                      onClick={() => navigate(p.id)}
                      aria-current={page === p.id ? 'page' : undefined}>
                      <span className="nav-icon" aria-hidden="true"><Icon d={p.icon} /></span>
                      {p.label}
                    </button>
              ))}
            </nav>
            <div style={{marginTop:'auto', padding:'16px 20px', borderTop:'1px solid var(--border)'}}>
              <div style={{fontSize:'11px', color:'var(--text-muted)'}}>Powered by Databricks</div>
              <div style={{fontSize:'10px', color:'var(--text-muted)', marginTop:'2px'}}>cdm_tmforum · Lakebase · Unity Catalog · v{appVersion}</div>
            </div>
          </div>
          <main className="main-content">
            {demoMode && page !== 'demo' && (
              <DemoStepBar currentStep={demoStep} onStepClick={handleDemoStepClick} onExit={exitDemo} />
            )}
            <SimulationBanner page={page} />
            <DataFreshnessBar />
            {renderPage()}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
