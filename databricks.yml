# CustomerLake Readiness — Declarative Automation Bundle
# Project: customerlake-env-setup
# Owner: @devops (Release Engineering)
# Tagging mandate: All assets MUST carry customerlake_project: customerlake

bundle:
  name: customerlake-env-setup
  # Note: Project tagging is enforced at the resource level (jobs, pipelines).
  # Bundle-level 'tags' is not a valid DAB field.

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for CustomerLake objects
    default: cdm_tmforum
  schema:
    description: Default schema within the catalog
    default: gold
  warehouse_id:
    description: SQL warehouse ID for jobs and dashboards
    lookup:
      warehouse: Serverless Starter Warehouse

# ──────────────────────────────────────────────
# Targets: dev / test / prod
# ──────────────────────────────────────────────
targets:
  dev:
    default: true
    mode: development
    # workspace.host omitted — resolved from CLI profile or DATABRICKS_HOST env var.
    # CI workflows set DATABRICKS_HOST via GitHub secrets.
    variables:
      catalog: cdm_tmforum
      schema: gold

  test:
    mode: development
    variables:
      catalog: cdm_tmforum
      schema: gold

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/stephen.hage@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: cdm_tmforum
      schema: gold
    run_as:
      # Production runs as a service principal — update when provisioned
      user_name: stephen.hage@databricks.com
    resources:
      pipelines:
        customerlake_gold_pipeline:
          development: false
        customerlake_audience_pipeline:
          development: false
