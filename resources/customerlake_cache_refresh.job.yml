# CustomerLake Cache Refresh — Daily Metric Materialization
# Owner: @data-engineer + @devops
# Refreshes all 40 _cached tables in cdm_tmforum._metrics via INSERT OVERWRITE.
# Each source metric view is atomically replaced with fresh data + materialized_at timestamp.
# Tag: customerlake_project: customerlake
# Created by @devops (DE-CACHE-SDP, 2026-10-06). Expanded to 40 tables (DEVOPS-SCHEDULE-CACHE-JOB, 2026-10-13).

resources:
  jobs:
    customerlake_cache_refresh:
      name: customerlake-cache-refresh
      tags:
        customerlake_project: customerlake
      tasks:
        - task_key: refresh_cached_metrics
          notebook_task:
            notebook_path: ../src/pipelines/cache_refresh_pipeline.ipynb
            source: WORKSPACE
          # Uses serverless compute by default
      schedule:
        quartz_cron_expression: '0 0 6 * * ?'
        timezone_id: UTC
      queue:
        enabled: true
      email_notifications:
        on_failure:
          - stephen.hage@databricks.com
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 2400
